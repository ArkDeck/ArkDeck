platform: macos
evidence_classes:
- contract
- realHardware
cases:
- acceptance_id: E2R-CATALOG-001
  test_id: TEST-E2R-CATALOG-001
  method: >-
    Cross-file policy audit plus Catalog schema, generator unit and zero-drift
    checks over every published destructive operation.
  expected_source: openspec/changes/chg-2026-056-e2-policy-baseline-alignment/verification.md#acceptance-matrix
  minimum_evidence: contract
  expected_result: >-
    New writers and admission paths contain no E2, standing authorization or
    campaign requirement; the unversioned flash.dayu200 and deploy.native-library.system@1
    remain destructive with unchanged typed Steps and use the unified
    RuntimeCapability policy. Exactly one unversioned dayu200 profile retains
    the current nine-partition recovery facts. flash.dayu200@1, dayu200@1 and
    dayu200@2 are rejected for new requests without an alias or history rewrite;
    App/UI/CLI/Agent/Provider output contains only flash.dayu200.
- acceptance_id: E2R-RUNTIME-001
  test_id: TEST-E2R-RUNTIME-001
  method: >-
    Fake-provider end-to-end Agent request plus a two-candidate Runtime-owned
    debug invocation through production Runtime composition, with no authority,
    campaign, Git, PR, merge or chat fields.
  expected_source: openspec/changes/chg-2026-056-e2-policy-baseline-alignment/verification.md#acceptance-matrix
  minimum_evidence: contract
  expected_result: >-
    Protected-main Runtime completely materializes the published plan, derives
    trusted facts, generates and reserves its exact RuntimeCapability, dispatches
    only the declared fake typed Steps and persists truthful intent/outcome and
    capability lineage without caller administration. A second isolated candidate
    may follow a durable safeToReflash without a per-attempt PR; the broker accepts
    only observe/execute/stop for the exact pinned typed request.
- acceptance_id: E2R-NEGATIVE-001
  test_id: TEST-E2R-NEGATIVE-001
  method: >-
    Fault matrix over caller forgery, target/binding/input/plan/archive/artifact/
    tool drift, reservation lineage, crash, cancellation, missing recovery proof,
    candidate authority/fact/plan/argv/timing injection, seed drift, expiry and
    attempt/concurrency budgets.
  expected_source: openspec/changes/chg-2026-056-e2-policy-baseline-alignment/verification.md#negative-and-recovery-tests
  minimum_evidence: contract
  expected_result: >-
    Every missing, forged, drifted, unbounded, incompletely covered, expired or
    over-budget case has zero new external dispatch and a durable blocker; no
    restart, UI click, chat text or evidence record can replay or override it.
- acceptance_id: E2R-COMPAT-001
  test_id: TEST-E2R-COMPAT-001
  method: >-
    Versioned legacy authority/evidence decoder fixtures plus new-admission,
    migration plus V5-read/V6-writer negative tests.
  expected_source: openspec/changes/chg-2026-056-e2-policy-baseline-alignment/verification.md#acceptance-matrix
  minimum_evidence: contract
  expected_result: >-
    Historical V1-V4 standing/campaign/chat records remain immutable and
    decodable/exportable, while none can mint RuntimeCapability, reserve, admit,
    dispatch, migrate into V6 or be emitted by a new writer.
- acceptance_id: E2R-RECOVERY-001
  test_id: TEST-E2R-RECOVERY-001
  method: >-
    Fake-provider target-lane fixture with a durable destructive outcomeUnknown,
    known physical identity, exact effect universe and reviewed complete-overwrite
    coverage; execute autonomous recovery through production Runtime composition.
  expected_source: openspec/changes/chg-2026-056-e2-policy-baseline-alignment/verification.md#acceptance-matrix
  minimum_evidence: contract
  expected_result: >-
    Runtime never replays or rewrites the old intent, mints a distinct capability
    and reservation, dispatches only the complete recovery plan without a human
    prompt, and releases the lane only after all effects and postflight are confirmed.
- acceptance_id: E2R-RECOVERY-NEGATIVE-001
  test_id: TEST-E2R-RECOVERY-NEGATIVE-001
  method: >-
    Pairwise fault matrix over physical identity, binding/topology, effect-set
    closure, omitted/protected partitions, coverage declaration, Artifact/tool
    drift, caller-supplied proof, cancellation, expiry and total epoch budget.
  expected_source: openspec/changes/chg-2026-056-e2-policy-baseline-alignment/verification.md#negative-and-recovery-tests
  minimum_evidence: contract
  expected_result: >-
    Each incomplete or untrusted proof dispatches zero original and recovery
    effects, persists the exact blocker and exposes no UI/chat approval path.
- acceptance_id: E2R-HISTORY-001
  test_id: TEST-E2R-HISTORY-001
  method: >-
    Versioned immutable journal fixtures pair old unknown intents with later Flash
    histories that vary identity, ordering, partition coverage, outcomes and
    reboot/rebind/runtime-build postflight.
  expected_source: openspec/changes/chg-2026-056-e2-policy-baseline-alignment/verification.md#acceptance-matrix
  minimum_evidence: contract
  expected_result: >-
    Only the fixture with complete same-target coverage and postflight appends a
    supersession relation with zero device dispatch; old bytes remain identical
    and every incomplete fixture remains blocked.
- acceptance_id: E2R-NOQUESTION-001
  test_id: TEST-E2R-NOQUESTION-001
  method: >-
    Agent/UI surface audit and fake Runtime flows for initial Flash, a distinct
    isolated candidate after safeToReflash, eligible complete-overwrite recovery
    and an ineligible recovery blocker.
  expected_source: openspec/changes/chg-2026-056-e2-policy-baseline-alignment/verification.md#acceptance-matrix
  minimum_evidence: contract
  expected_result: >-
    Eligible paths run without standing/campaign/UI/chat/human-action or
    per-attempt Git/PR/merge input; the ineligible path reports a non-overridable
    diagnostic rather than asking a user to authorize absent device-state proof.
- acceptance_id: E2R-GJ4-001
  test_id: TEST-E2R-GJ4-001
  method: >-
    Explicit standalone UI-driver execution through the production signed App and
    protected-main Runtime against one real bound DAYU200 using the supplied
    OpenHarmony 7.0.0.35 archive, followed by Job/Session/Artifact and device
    version postflight and supersession-lineage review.
  expected_source: openspec/changes/chg-2026-056-e2-policy-baseline-alignment/verification.md#acceptance-matrix
  minimum_evidence: realHardware
  expected_result: >-
    The real typed Flash completes without standing authorization, campaign or
    per-attempt PR/merge/chat or outcome-decision confirmation; postflight proves
    the flashed build, V6 evidence records the actual Agent executor,
    RuntimeCapability, exact target/plan/Artifact, candidate provenance and
    applicable recovery lineage, and the driver remains outside all default
    Swift/Xcode/UI test discovery.
