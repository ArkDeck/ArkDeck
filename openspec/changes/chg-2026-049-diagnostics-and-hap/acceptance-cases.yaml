---
schema_version: 1.0.0
change_id: CHG-2026-049-diagnostics-and-hap
change_revision: 8
platform: macos
evidence_classes:
- contract
- realHardware
cases:
- acceptance_id: DHA-GJ4-HANDOFF-003
  test_id: TEST-DHA-GJ4-HANDOFF-003
  method: >-
    Contract and host-only real-input verification of dayu200@2 human handoff,
    trusted execute-plan profile selection and pre-consumption profile closure.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-gj4-handoff-003
  minimum_evidence: contract
  expected_result: >-
    Human execute emits only the exact v2 handoff with zero dispatch; authorized
    execution derives the profile from exact archive pins, rejects caller profile,
    unknown archives and member drift, and cannot consume authorization or stage
    when the admitted plan has no published profile.
- acceptance_id: DHA-GJ4-PROFILE-001
  test_id: TEST-DHA-GJ4-PROFILE-001
  method: >-
    Profile, Catalog and Provider contracts plus a host-only real-input
    archive summary over the 7.0.0.35 candidate.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-gj4-profile-001
  minimum_evidence: contract
  expected_result: >-
    The archive and all 17 members match exact size/SHA-256 pins;
    Catalog offers dayu200@2 and the Provider materializes only the exact
    nine-partition order while rejecting reordered and cross-version inputs.
- acceptance_id: DHA-GJ4-PLAN-002
  test_id: TEST-DHA-GJ4-PLAN-002
  method: >-
    Runtime planOnly and job.plan wire contracts, including a host-only
    real-input pass with sealed target facts and a fail-on-call dispatcher.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-gj4-plan-002
  minimum_evidence: contract
  expected_result: >-
    Full typed materialization returns the exact digest and selected steps
    without admitting a Job, creating/installing/consuming a capability or
    dispatching a provider action; negative plans have the same zero-effect result.
- acceptance_id: DHA-AGENT-001
  test_id: TEST-DHA-AGENT-001
  method: >-
    One-shot Device Runtime Agent runner contract and fake-daemon
    integration, including typed-only inputs, bounded execution,
    structured human-action pause/resume, authority references and
    execution-receipt persistence.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-agent-001
  minimum_evidence: contract
  expected_result: >-
    An Agent can complete doctor, adopt, one published operation and
    artifact query without raw HDC, argv or shell access; physical trust
    and target ambiguity pause explicitly; the receipt identifies the
    Agent executor and authority; capability administration is absent
    from the Agent-facing surface.
- acceptance_id: DHA-ART-001
  test_id: TEST-DHA-ART-001
  method: >-
    Artifact model contract tests plus path-traversal and symlink
    negatives, GC/quota/retention matrix, and an end-to-end
    observe.device@1 publication read back through the daemon.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-art-001
  minimum_evidence: contract
  expected_result: >-
    Artifacts carry complete metadata and are reachable only by ID or
    lease; traversal and symlink escapes fail closed; GC spares active and
    pinned entries; a full quota refuses new capture without damaging
    existing artifacts; observe.device@1 publishes its four artifacts.
- acceptance_id: DHA-CAP-001
  test_id: TEST-DHA-CAP-001
  method: >-
    capture.diagnostics@1 orchestration contract with partial-failure,
    cancellation, byte-budget and remote-cleanup-debt scenarios.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-cap-001
  minimum_evidence: contract
  expected_result: >-
    One request yields the hilog, ui-dump, trace, index and summary set;
    a missing artifact is reported per item and never as overall success;
    cancellation collects completed artifacts at a safe boundary; budget
    overruns truncate or fail without exhausting disk; failed remote
    cleanup becomes reconcilable debt.
- acceptance_id: DHA-HAP-001
  test_id: TEST-DHA-HAP-001
  method: >-
    debug.hap@1 orchestration contract with readback-only success
    judgement, E1 capability scope negatives, compensation and
    unknown-outcome halting.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-hap-001
  minimum_evidence: contract
  expected_result: >-
    Install and start succeed only on package and process readback, never
    on exit code; missing or out-of-scope capabilities dispatch nothing;
    failures compensate per cleanup policy; an unknown outcome halts
    further mutation with zero automatic replay; the HAP comes only from
    an artifact lease.
- acceptance_id: DHA-HW-001
  test_id: TEST-DHA-HW-001
  method: >-
    Device Runtime Agent execution of the E0-only
    capture.diagnostics@1 plan against a real DAYU200, with human
    participation limited to structured physical assistance.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-hw-001--dha-hw-002
  minimum_evidence: realHardware
  expected_result: >-
    The Agent submission produces the expected read-only artifact set
    through the daemon surface and a durable executor=agent receipt;
    no human runs host Runtime commands and no remote trace mutation is
    admitted under the E0 policy.
- acceptance_id: DHA-HW-002
  test_id: TEST-DHA-HW-002
  method: >-
    Device Runtime Agent execution with a maintainer-issued E1
    capability: debug.hap@1 against a real DAYU200.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-hw-001--dha-hw-002
  minimum_evidence: realHardware
  expected_result: >-
    One Agent runtime request installs, starts, captures and stops the HAP
    with readback evidence at each mutating step; the capability is
    consumed once for the whole recipe; without it the run dispatches
    nothing; no human substitutes as the host executor.
- acceptance_id: DHA-RES-001
  test_id: TEST-DHA-RES-001
  method: >-
    Scripted-dispatcher contract tests over debug.hap@1 with an
    ineffective uninstall, on both the forward path and the
    compensation path, asserting a durable residue record carrying the
    exact persisted uninstall action, and asserting the existing
    remote-path debt behaviour is unchanged.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-res-001
  minimum_evidence: contract
  expected_result: >-
    A cleanup that ran and did not take effect is recorded as
    outstanding residue on both paths, keyed by what was left behind
    rather than by whether it happened to be a remote path.
- acceptance_id: DHA-RES-002
  test_id: TEST-DHA-RES-002
  method: >-
    Contract tests asserting the job stays succeeded while reporting a
    non-zero outstanding-residue count, a clean control run reports
    zero, and the job state machine's transitions and terminal set are
    unchanged.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-res-002
  minimum_evidence: contract
  expected_result: >-
    Succeeded keeps its meaning for the debug session while never
    reading as a clean device; no terminal state is added.
- acceptance_id: DHA-RES-003
  test_id: TEST-DHA-RES-003
  method: >-
    Contract tests over cleanupDebt.continue for a bundle residue:
    settle only when the readback says the package is gone, keep the
    record when it is still installed, and refuse an identity that is
    not in the ledger.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-res-003
  minimum_evidence: contract
  expected_result: >-
    Settlement is decided by the readback, and the continue surface
    cannot be used to name an arbitrary uninstall target.
- acceptance_id: DHA-MULTI-001
  test_id: TEST-DHA-MULTI-001
  method: >-
    Argv contract tests over debug.hap@1 with and without additional HAP
    leases, asserting the single-package argv is unchanged token for
    token, the multi-package legs lower to mkdir/send-N, a directory
    install and rm -f plus rmdir, and that no lowering anywhere emits
    rm -rf.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-multi-001
  minimum_evidence: contract
  expected_result: >-
    Multi-package is opt-in and the directory is cleaned by name and
    rmdir, never recursively.
- acceptance_id: DHA-MULTI-002
  test_id: TEST-DHA-MULTI-002
  method: >-
    Contract tests where one additional lease is bound to a different
    target identity or binding revision, asserting refusal before
    dispatch with zero provider dispatches and zero capability
    consumption, plus a positive case asserting send order follows lease
    order.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-multi-002
  minimum_evidence: contract
  expected_result: >-
    Every lease passes the existing binding validation individually, and
    one bad lease stops the whole job before anything reaches the device.
- acceptance_id: DHA-MULTI-003
  test_id: TEST-DHA-MULTI-003
  method: >-
    One real-device debug.hap@1 run whose inputs are an entry plus a
    feature signed HAP, asserting install readback, launch, and a
    cleanup that leaves neither the bundle nor the job-owned directory.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-multi-003
  minimum_evidence: realHardware
  expected_result: >-
    A multi-module app installs as one application from one directory;
    the earlier window's single-HAP directory install is not evidence
    for this.
- acceptance_id: DHA-SHOT-001
  test_id: TEST-DHA-SHOT-001
  method: >-
    Argv contract test pinning the screenshot lowering token for token,
    including the mandatory -t png and a provider-minted owned path that
    ends in .png, plus the fail-closed path without a connect key.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-shot-001
  minimum_evidence: contract
  expected_result: >-
    The device validates the file suffix against the type, so -t png and
    the .png suffix are both load-bearing rather than cosmetic.
- acceptance_id: DHA-SHOT-002
  test_id: TEST-DHA-SHOT-002
  method: >-
    Contract tests asserting a request without uiScreenshot keeps its
    selected steps, plan effect and authorization path unchanged and
    publishes no screenshot, while a request with it escalates to
    deviceMutation through the existing capability path.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-shot-002
  minimum_evidence: contract
  expected_result: >-
    The screenshot leg is opt-in and changes nothing for callers that do
    not ask for it.
- acceptance_id: DHA-SHOT-003
  test_id: TEST-DHA-SHOT-003
  method: >-
    Contract tests for the zero-byte device file, a landed file whose
    magic is not PNG, and the healthy path; plus one real-device agent
    run capturing a screenshot and cleaning up after itself.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-shot-003
  minimum_evidence: realHardware
  expected_result: >-
    A screenshot is published only when the device wrote bytes, the host
    measured them, and they begin with the PNG magic.
- acceptance_id: DHA-CRASH-001
  test_id: TEST-DHA-CRASH-001
  method: >-
    Argv contract tests pinning both Faultlogger invocations token for
    token, with the -p/-f payload as a single argv element, plus
    assertions that this leg leaves the plan effect readOnly and consumes
    no capability.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-crash-001
  minimum_evidence: contract
  expected_result: >-
    Crash capture is the one collection leg that reads without mutating,
    so it stays E0.
- acceptance_id: DHA-CRASH-002
  test_id: TEST-DHA-CRASH-002
  method: >-
    Negative tests for path-shaped, oversized, empty and wrongly-prefixed
    crash log names, asserting refusal at admission with zero dispatch,
    and a positive test with a real measured entry name.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-crash-002
  minimum_evidence: contract
  expected_result: >-
    The caller-supplied name can only ever be a Faultlogger entry name,
    never a path or a shell fragment.
- acceptance_id: DHA-CRASH-003
  test_id: TEST-DHA-CRASH-003
  method: >-
    Contract tests for the empty list, the invalid-parameters answer and
    a healthy single entry; plus a real-device agent run fetching the
    index when the shared device is free.
  expected_source: openspec/changes/chg-2026-049-diagnostics-and-hap/verification.md#dha-crash-003
  minimum_evidence: contract
  expected_result: >-
    An empty fault log list is a truthful result, while a refused fetch
    publishes nothing.
