---
schema_version: 1.0.0
change_id: CHG-2026-078-windows-hdc-registration
change_revision: 3
platform: windows
evidence_classes:
- contract
- platform
cases:
- acceptance_id: WHR-IDENTITY-001
  test_id: TEST-WHR-IDENTITY-001
  method: Registry, fixture, profile and lock hash closure for each registered Windows tuple.
  expected_source: openspec/changes/chg-2026-078-windows-hdc-registration/verification.md#WHR-IDENTITY-001
  minimum_evidence: platform
  expected_result: >-
    Each Windows entry names one hdc.exe by executable SHA-256 and the hdc -v bytes observed with
    it, and the exact endpoint the Windows listener was observed on. Every registered fixture is a
    redacted byte file of the maintainer's capture, listed with its SHA-256 in resources.json and
    the lock, and classifies as its family. A tool, endpoint or output outside the entry is
    unsupported or unknown.
- acceptance_id: WHR-SEPARATION-001
  test_id: TEST-WHR-SEPARATION-001
  method: macOS registry byte identity plus a cross-platform substitution matrix.
  expected_source: openspec/changes/chg-2026-078-windows-hdc-registration/verification.md#WHR-SEPARATION-001
  minimum_evidence: contract
  expected_result: >-
    The macOS 3.2.0d readonly, trace, 3.2.0f device-observation and supervisor-observation
    registries and their resources stay byte-identical. A macOS tuple offered to the Windows
    registry, and a Windows tuple offered to a macOS registry, are unsupported, and nothing falls
    back across them.
- acceptance_id: WHR-PRIVACY-001
  test_id: TEST-WHR-PRIVACY-001
  method: Leak scan of every sanitized output and a reviewer's own search for the board serial.
  expected_source: openspec/changes/chg-2026-078-windows-hdc-registration/verification.md#WHR-PRIVACY-001
  minimum_evidence: contract
  expected_result: >-
    No connect key, USB serial, user path, account or machine name, other USB device identity,
    or hash of key-bearing raw bytes appears in any committed file; keys and serials are
    same-length placeholders and every other output byte is unchanged.
- acceptance_id: WHR-OBSERVATION-001
  test_id: TEST-WHR-OBSERVATION-001
  method: Classification of the registered c2 list targets -v fixtures plus negative row vectors.
  expected_source: openspec/changes/chg-2026-078-windows-hdc-registration/verification.md#WHR-OBSERVATION-001
  minimum_evidence: contract
  expected_result: >-
    Only USB rows are device observations. The sampled UART rows (COM<n>, empty name, UART, Ready,
    unknown..., hdc) are excluded, so the UART-only fixture and the removed-board fixture are
    observedEmpty and the connected fixture is one device. A 5-column row, a sixth column other
    than hdc, any other UART form, an unknown literal, a residual CR, the [Empty] marker or
    zero-byte stdout make the snapshot unknown. checkserver is never dispatched.
- acceptance_id: WHR-STARTUP-001
  test_id: TEST-WHR-STARTUP-001
  method: Classification of the registered c2 server-startup fixture and near-miss vectors, and
    the managed-start settle over scripted listings (r3).
  expected_source: openspec/changes/chg-2026-078-windows-hdc-registration/verification.md#WHR-STARTUP-001
  minimum_evidence: contract
  expected_result: >-
    Exactly [Empty] CR TAB hdc CR LF with exit 0 and empty stderr is notYetObservable (unknown,
    retryable) and never observedEmpty, a device set or a disappearance. Every other [Empty] form
    is unknown. After a managed start the Runtime lists again for at most 3 s until a registered
    enumerated listing is read; past the bound every observation stays unknown.
- acceptance_id: WHR-CENSUS-001
  test_id: TEST-WHR-CENSUS-001
  method: TASK-XPA-004 Windows census tests over synthetic PnP nodes shaped like the sanitized
    2026-10-04 USB sample.
  expected_source: openspec/changes/chg-2026-078-windows-hdc-registration/verification.md#WHR-CENSUS-001
  minimum_evidence: contract
  expected_result: >-
    A present device-level node with an upper-case serial suffix relates to the lower-case HDC
    connect key after the registered ASCII-lowercase fold. A port-derived suffix and a phantom
    node yield no identity. An attachment is the pair (instance ID, LastArrivalDate), and a new
    arrival is a new attachment. Topology is compared only within one attachment and never
    enters the long-term identity.
