schema_version: 1.0.0
catalog: arkdeck-diagnostics

actions:
  - id: boundedHilog
    step_kind: captureRemoteStdout
    output_mode: stdout
    required_inputs: [durationSeconds, filters, byteBudget]
    limits:
      durationSeconds: { type: integer, minimum: 1, maximum: 600 }
      filters:
        { type: stringArray, maximum_items: 16, maximum_length: 200,
          token_pattern: "^[A-Za-z0-9:*./_-]+$" }
      byteBudget: { type: integer, minimum: 1024, maximum: 134217728 }
  - id: componentTree
    step_kind: captureRemoteStdout
    output_mode: stdout
    required_inputs: [byteBudget]
    limits:
      byteBudget: { type: integer, minimum: 1024, maximum: 67108864 }
  # windowInventory is the only window-family action with a device-validated
  # windowId-free invocation (CHG-2026-008 INV-1). componentTree stays
  # published but has no honest lowering until a windowId revision lands.
  - id: windowInventory
    step_kind: captureRemoteStdout
    output_mode: stdout
    required_inputs: [byteBudget]
    limits:
      byteBudget: { type: integer, minimum: 1024, maximum: 67108864 }

  # Faultlogger is the device's own crash ledger. Both invocations are
  # reads - measured 2026-07-31: `ls` before and after is identical - so
  # this pair is the only diagnostics family that never leaves readOnly.
  - id: crashIndex
    step_kind: captureRemoteStdout
    output_mode: stdout
    required_inputs: [byteBudget]
    limits:
      byteBudget: { type: integer, minimum: 1024, maximum: 67108864 }
  - id: crashLog
    step_kind: captureRemoteStdout
    output_mode: stdout
    required_inputs: [byteBudget, faultLogName]
    limits:
      byteBudget: { type: integer, minimum: 1024, maximum: 67108864 }
      # A Faultlogger entry name, never a path: no separator is admitted.
      faultLogName:
        { type: string, maximum_length: 200,
          token_pattern: "^[a-z]+-[A-Za-z0-9._-]{1,180}$" }

rules:
  unknown_action: reject
  executable_fields: forbidden
  caller_remote_path: forbidden
  lowering: exact-action-id-only
  parameters: reject-undeclared-or-out-of-bounds

behavior_specs:
  - openspec/specs/debug-workbench/spec.md
  - openspec/specs/ui-dump/spec.md
