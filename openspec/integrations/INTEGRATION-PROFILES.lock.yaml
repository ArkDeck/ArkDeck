adoption_boundary:
  previous_lock: INTEGRATION-PROFILES-0.5.0
  previous_openharmony_profile: OPENHARMONY-TOOLS@0.4.0
  device_observation_rule: >-
    The device-observation registry is observed on hdc 3.2.0f and is available only to a
    consumer that explicitly adopts OPENHARMONY-TOOLS@0.5.0 and the complete
    OPENHARMONY-HDC-DEVICE-OBSERVATION-PROBES@1.0.0 registry/resource hash closure through an
    independently approved task. It is not the same tool as the 3.2.0d read-only and trace
    registries; entries must never be merged across the two tool versions, and neither existing
    registry gains any authority from this one. CHG-2026-022 consumer wiring stays out of scope
    until its own readiness.
  historic_previous_lock: INTEGRATION-PROFILES-0.4.0
  historic_previous_openharmony_profile: OPENHARMONY-TOOLS@0.3.0
  rule: >-
    Existing consumers retain their pinned authority. The trace registry is available only to
    a consumer that explicitly adopts OPENHARMONY-TOOLS@0.4.0 and the complete
    OPENHARMONY-TRACE-PROBES@1.0.0 registry/resource hash closure through an independently
    approved task. The HDC read-only registry remains pinned to its 0.3.0 provenance tuple.

change_rule: >-
  Parser families, adapter mappings, catalogs and golden fixtures evolve through
  an approved integration change and a version bump here. They must not change
  Core Requirement/AC semantics.
