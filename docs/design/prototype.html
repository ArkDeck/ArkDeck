<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ArkDeck 交互原型 v1.6</title>
<style>
:root{
  color-scheme:light dark;
  --ground:#F5F5F7; --panel:#FFFFFF; --panel-solid:#FFFFFF; --panel2:rgba(242,242,247,.82);
  --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#8E8E93; --line:rgba(60,60,67,.18);
  --accent:#006EDB; --accent-fill:#0065CA; --accent-ink:#FFFFFF; --accent-weak:rgba(0,110,219,.12);
  --ok:#1F7A35; --warn:#8A4B00; --danger:#C10014; --danger-fill:#C10014; --danger-weak:rgba(193,0,20,.08);
  --planned:#7047B7; --sim:#8A4B00; --selection:rgba(0,110,219,.12);
  --shadow:0 1px 2px rgba(0,0,0,.08),0 18px 52px rgba(0,0,0,.14);
  --control-shadow:0 1px 1px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --chrome:rgba(246,246,248,.82); --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#1C1C1E; --panel:#242426; --panel-solid:#2C2C2E; --panel2:rgba(44,44,46,.78);
  --ink:#F5F5F7; --ink2:#AEAEB2; --ink3:#8E8E93; --line:rgba(235,235,245,.16);
  --accent:#58A6FF; --accent-fill:#0065CA; --accent-ink:#FFFFFF; --accent-weak:rgba(88,166,255,.18);
  --ok:#4CD964; --warn:#FFB340; --danger:#FF6961; --danger-fill:#C52828; --danger-weak:rgba(255,105,97,.12);
  --planned:#C3A6FF; --sim:#FFB340; --selection:rgba(88,166,255,.18);
  --shadow:0 1px 2px rgba(0,0,0,.38),0 20px 56px rgba(0,0,0,.45);
  --control-shadow:0 1px 1px rgba(0,0,0,.28); --chrome:rgba(36,36,38,.82);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#1C1C1E; --panel:#242426; --panel-solid:#2C2C2E; --panel2:rgba(44,44,46,.78);
  --ink:#F5F5F7; --ink2:#AEAEB2; --ink3:#8E8E93; --line:rgba(235,235,245,.16);
  --accent:#58A6FF; --accent-fill:#0065CA; --accent-ink:#FFFFFF; --accent-weak:rgba(88,166,255,.18);
  --ok:#4CD964; --warn:#FFB340; --danger:#FF6961; --danger-fill:#C52828; --danger-weak:rgba(255,105,97,.12);
  --planned:#C3A6FF; --sim:#FFB340; --selection:rgba(88,166,255,.18);
  --shadow:0 1px 2px rgba(0,0,0,.38),0 20px 56px rgba(0,0,0,.45);
  --control-shadow:0 1px 1px rgba(0,0,0,.28); --chrome:rgba(36,36,38,.82);
}
:root[data-theme="light"]{
  color-scheme:light; --ground:#F5F5F7; --panel:#FFFFFF; --panel-solid:#FFFFFF; --panel2:rgba(242,242,247,.82);
  --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#8E8E93; --line:rgba(60,60,67,.18);
  --accent:#006EDB; --accent-fill:#0065CA; --accent-ink:#FFFFFF; --accent-weak:rgba(0,110,219,.12);
  --ok:#1F7A35; --warn:#8A4B00; --danger:#C10014; --danger-fill:#C10014; --danger-weak:rgba(193,0,20,.08);
  --planned:#7047B7; --sim:#8A4B00; --selection:rgba(0,110,219,.12);
  --shadow:0 1px 2px rgba(0,0,0,.08),0 18px 52px rgba(0,0,0,.14);
  --control-shadow:0 1px 1px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04); --chrome:rgba(246,246,248,.82);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
button,input,select{font:inherit}
button{color:inherit}
.note{max-width:1240px;width:100%;color:var(--ink2);font-size:12px;text-wrap:pretty}
.note b{color:var(--ink)}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.window{width:min(1180px,100%);height:min(760px,calc(100vh - 96px));min-height:600px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
body.reference{padding:0;gap:0;justify-content:flex-start;min-width:1180px;min-height:760px}
body.reference .note{display:none}
body.reference .window{width:1180px;height:760px;min-height:760px;border-radius:0;border:none;box-shadow:none}
.titlebar{height:52px;display:grid;grid-template-columns:minmax(92px,1fr) minmax(0,auto) minmax(max-content,1fr);align-items:center;
  gap:10px;background:var(--chrome);border-bottom:1px solid var(--line);padding:0 12px;flex:none;
  -webkit-backdrop-filter:blur(28px) saturate(1.35);backdrop-filter:blur(28px) saturate(1.35)}
.titlebar .leading,.titlebar .trailing{display:flex;align-items:center;gap:8px;min-width:0}
.titlebar .trailing{justify-content:flex-end}
.lights{display:flex;gap:7px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.titlebar .t{text-align:center;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar-btn,.acbtn{min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;flex-shrink:0;
  font-size:11px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel-solid) 78%,transparent);
  color:var(--ink2);border-radius:7px;padding:0 9px;cursor:pointer;box-shadow:var(--control-shadow)}
.toolbar-btn.icon-only{width:28px;padding:0}
.acbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.symbol{width:16px;height:16px;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none}
.symbol.sm{width:14px;height:14px}
.prototype-disclosure{flex:none;padding:4px 16px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11px;color:var(--ink2);text-align:center}
.overview-record{display:flex;flex-direction:column;gap:20px}
.overview-record h2{font-size:13px;margin:0 0 10px}
.overview-record .overview-scope{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.overview-scope>div+div{border-left:1px solid var(--line);padding-left:24px}
.overview-run{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.overview-run>div{flex:1;min-width:0}.overview-run p{margin:4px 0 0}
.settings-workspace{max-width:850px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.settings-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.settings-tabs .on{background:var(--selection);color:var(--accent)}
.settings-workspace .kv{grid-template-columns:minmax(130px,1fr) minmax(180px,2fr)}
.history-filter-row{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0}
.history-filter-row label{font-size:11px;color:var(--ink2)}
.history-filter-row select{display:block;max-width:160px}
.history-page{container-type:inline-size;container-name:history}
.history-page .history-shell{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
.history-page .history-rail,.history-page .history-inspector{overflow-y:auto}
.history-page .history-list{overflow:hidden}
.history-list> :not(.history-records){flex-shrink:0}
.history-records{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.history-records>*{flex-shrink:0}
.history-expanded-filters{max-height:40%;overflow-y:auto}
.history-compact-controls{display:none;grid-column:1/-1;gap:10px;align-items:end}
.history-compact-activity{flex:1;min-width:0}.history-compact-activity select{width:100%}
.history-popover{position:fixed;inset:auto;margin:0;width:360px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;overscroll-behavior:contain;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel-solid);color:var(--ink);box-shadow:var(--control-shadow)}
.history-popover h3{margin:0 0 12px}.history-popover .history-filter-row{display:grid;gap:10px}
.history-popover .history-filter-row label{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:center;gap:8px}
.history-popover .history-filter-row select{width:100%;max-width:none;min-width:0}
.history-popover .device-actions{align-items:stretch;flex-direction:column}
.history-detail-section{margin-block:14px;min-width:0;overflow-wrap:anywhere}
.history-facts.kv{grid-template-columns:minmax(0,120px) minmax(0,1fr)}
.history-facts dt,.history-facts dd{min-width:0;overflow-wrap:anywhere}
.history-artifacts{display:grid;gap:12px;margin-block:12px}
.history-artifacts>.card,.history-linked-artifact{min-width:0;overflow-wrap:anywhere}
.history-linked-artifact{margin-block:12px}
.history-context{flex:none;padding:12px 16px;background:var(--accent-weak);border-radius:8px;overflow-wrap:anywhere}
.device-workspace-page:has(.history-context){overflow-y:auto}
body.standalone-design .sidebar,body.standalone-design #drawer,body.standalone-design #sidebarToggle,body.standalone-design #jobsToggle{display:none}
@media(max-width:980px){.overview-record .overview-scope{grid-template-columns:1fr}.overview-scope>div+div{border-left:0;border-top:1px solid var(--line);padding:12px 0 0}.overview-run{flex-wrap:wrap}.overview-run>div{flex-basis:65%}}
.main{flex:1;display:flex;min-height:0}
.sidebar{width:250px;flex:none;background:var(--panel2);border-right:1px solid var(--line);padding:12px 10px;
  overflow-y:auto;display:flex;flex-direction:column;gap:18px;-webkit-backdrop-filter:blur(28px) saturate(1.25);backdrop-filter:blur(28px) saturate(1.25)}
.sidebar.hidden{display:none}
.sec{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink2);padding:0 9px 5px}
.dev{width:100%;display:flex;align-items:center;gap:8px;padding:6px 8px;min-height:42px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;background:transparent;text-align:start}
.dev:hover{background:var(--selection)}
.dev.on{background:var(--selection)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.off{background:var(--ink2)}
.dev .dn{flex:1;min-width:0}.dev .dn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .dn span{font-size:11px;color:var(--ink2)}
.tag{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink2);flex:none}
.addlink{min-height:28px;font-size:12px;color:var(--accent);padding:3px 8px;cursor:pointer;background:none;border:none;
  text-align:start;display:flex;align-items:center;gap:7px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{min-height:32px;display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:8px;border:none;
  background:none;color:var(--ink);font-size:13px;cursor:pointer;text-align:start;width:100%}
.nav button:hover{background:var(--selection)}
.nav button.on{background:var(--selection);font-weight:600}
.nav button.on .ic{color:var(--accent)}
.nav .ic{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.nav .ic .symbol{width:18px;height:18px}
.nav .ic .symbol:has(use[href="#i-device"]){width:20px;height:20px;stroke-width:1.485}
.nav .preview{margin-inline-start:auto;font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);
  border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.page{flex:1;overflow-y:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:20px;scrollbar-gutter:stable}
.page>*{flex-shrink:0}
.page-lead{display:contents}
h2{font-size:13px;line-height:1.3;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;margin:0}
.card{background:color-mix(in srgb,var(--panel-solid) 92%,transparent);border:1px solid var(--line);border-radius:11px;
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;box-shadow:var(--control-shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--ink2)}.kv dd{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;
  border:1px solid;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok);background:transparent}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.danger{color:var(--danger);border-color:var(--danger)}
.chip.dim{color:var(--ink2);border-color:var(--line)}
.chip.planned{color:var(--planned);border-color:var(--planned)}
.chip.sim{color:var(--sim);border-color:var(--sim);border-style:dashed}
.btn{min-height:29px;border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);border-radius:7px;
  padding:4px 12px;font-size:13px;cursor:pointer;box-shadow:var(--control-shadow)}
.btn:hover{background:color-mix(in srgb,var(--panel-solid) 88%,var(--accent) 12%)}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.btn.pri:hover{opacity:.9}
.btn.danger{background:var(--danger-fill);border-color:var(--danger-fill);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn:focus-visible,.nav button:focus-visible,.dev:focus-visible,.addlink:focus-visible,.toolbar-btn:focus-visible,
.acbtn:focus-visible,.drawer .bar:focus-visible,.tabs button:focus-visible,.filters button:focus-visible,
.tagpick button:focus-visible,.flash-details summary:focus-visible,[tabindex="0"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .btn,.toolbar-btn,.acbtn,.nav button,.dev{transition-property:transform,background-color,border-color,opacity;transition-duration:120ms;transition-timing-function:cubic-bezier(.2,0,0,1)}
  .btn:active,.toolbar-btn:active,.acbtn:active{transform:scale(.96)}
}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:11px;color:var(--ink2);text-align:start;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.sel-row{background:var(--selection)}
.mono{font-family:var(--mono);font-size:11.5px}
.banner{background:color-mix(in srgb,var(--panel-solid) 92%,var(--warn) 8%);border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));border-radius:11px;padding:12px 14px;
  display:flex;flex-direction:column;gap:0}
.banner header{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--warn);padding:0 2px 7px}
.ritem{display:flex;align-items:flex-start;gap:10px;background:transparent;border-top:1px solid var(--line);padding:10px 2px}
.banner header+.ritem{border-top:none}
.ritem .ri{flex:1;min-width:0;overflow-wrap:anywhere}.ritem .ri b{font-size:13px}.ritem .ri p{font-size:12px;color:var(--ink2);margin-top:2px}
.ritem .ra{display:flex;gap:8px;flex:none;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#recoveryBanners:empty{display:none}
#recoveryBanners{flex:none;max-height:min(45%,max(96px,calc(100% - 400px)));overflow-y:auto;padding:16px 22px 0;display:grid;gap:8px;container-type:inline-size;container-name:recovery}
#recoveryBanners .ritem{border:0;padding:0}
#recoveryBanners header{color:var(--ink)}
#recoveryBanners header .symbol{color:var(--warn);flex:none}
#recoveryBanners .recovery-count{margin:0;color:var(--ink2);font-size:12px}
#recoveryBanners:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@container recovery (max-width:600px){#recoveryBanners .ritem{flex-wrap:wrap}#recoveryBanners .ri{flex-basis:100%}}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio .rd{color:var(--ink2);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel-solid);box-shadow:var(--control-shadow)}
.seg button{min-height:29px;border:none;border-inline-end:1px solid var(--line);background:transparent;padding:5px 15px;font-size:13px;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-inline-end:none}
.seg button.on{background:var(--selection);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.seg.mini button{min-height:25px;padding:3px 10px;font-size:11.5px}
.drawer{flex:none;border-top:1px solid var(--line);background:var(--chrome);-webkit-backdrop-filter:blur(24px) saturate(1.25);backdrop-filter:blur(24px) saturate(1.25)}
.drawer .bar{width:100%;min-height:36px;display:flex;align-items:center;gap:10px;padding:7px 16px;cursor:pointer;
  font-size:12.5px;background:transparent;border:none;text-align:start}
.drawer .bar .st{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer .body{max-height:0;overflow:hidden}
.drawer.open .body{max-height:300px;overflow-y:auto}
@media (prefers-reduced-motion:no-preference){.drawer .body{transition-property:max-height;transition-duration:180ms;transition-timing-function:cubic-bezier(.2,0,0,1)}}
@media (prefers-reduced-motion:reduce){.drawer .body{transition:none}.pulse{animation:none}
  .ibar::after{animation:none;left:0;width:100%;opacity:.35}}
.job{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel-solid) 76%,transparent)}
.job:first-child{border-top:none}
.job .jh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.job .jh b{font-size:13px}
.phases{display:flex;gap:4px;flex-wrap:wrap;font-size:11px}
.ph{padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--ink2)}
.ph.done{border-color:var(--ok);color:var(--ok)}
.ph.run{border-color:var(--accent);color:var(--accent);font-weight:600}
.pulse{animation:pu 1.2s ease-in-out infinite}
@keyframes pu{50%{opacity:.45}}
.ibar{height:3px;border-radius:2px;background:var(--accent-weak);overflow:hidden;position:relative;
  flex:1;min-width:60px;max-width:200px;align-self:center}
.ibar::after{content:"";position:absolute;left:-40%;width:40%;top:0;bottom:0;background:var(--accent);
  border-radius:2px;animation:ib 1.4s linear infinite}
@keyframes ib{to{left:100%}}
.logtail{font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--ink2);background:color-mix(in srgb,var(--ground) 82%,var(--panel-solid));
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-height:110px;overflow-y:auto;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.stream{max-height:220px;color:var(--ink)}
.rebind{border:1px solid var(--accent);background:var(--accent-weak);border-radius:8px;padding:8px 12px;
  font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative}
.inp{min-height:29px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel-solid);color:var(--ink);font:inherit;font-size:13px;box-shadow:var(--control-shadow)}
.inp.mono{font-family:var(--mono);font-size:12px}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select.inp{cursor:pointer}
.livetag{font-size:9.5px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 4px;vertical-align:middle}
.modal-bg{position:fixed;inset:0;background:rgba(15,18,22,.36);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:72px 20px 20px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal{background:var(--panel-solid);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);
  max-width:560px;width:100%;padding:20px 22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 96px);overflow-y:auto}
.modal [hidden]{display:none!important}
.modal h3{font-size:16px;line-height:1.25;margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-wrap:balance}
.modal h3[tabindex="-1"]:focus{outline:none}
.modal.dangerm h3{color:var(--danger)}
.impact{border:1px solid var(--danger);background:var(--danger-weak);border-radius:8px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.impact ul{margin-left:18px}
.checks label{display:flex;gap:8px;font-size:13px;align-items:flex-start;cursor:pointer;margin-bottom:6px}
.checks input{margin-top:3px;accent-color:var(--danger)}
.checks.safe input{accent-color:var(--accent)}
.mfoot{display:flex;justify-content:flex-end;gap:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters .fl{font-size:11px;color:var(--ink2);margin-right:2px}
.filters button{min-height:26px;font-size:11.5px;border:1px solid var(--line);background:var(--panel-solid);border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--ink2)}
.filters button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);font-weight:600}
.tagpick{display:flex;gap:6px;flex-wrap:wrap}
.tagpick button{min-height:26px;font-size:11.5px;font-family:var(--mono);border:1px solid var(--line);background:var(--panel-solid);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--ink2)}
.tagpick button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);font-weight:600}
.tagpick button:disabled{opacity:.4;cursor:not-allowed;border-style:dashed}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{min-height:32px;border:none;background:none;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.hint{font-size:12px;color:var(--ink2)}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;position:relative}
.okbox{border:1px solid var(--ok);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.effect{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:4px;padding:1px 6px;border:1px solid}
.effect.host{color:var(--ink2);border-color:var(--line)}
.effect.read{color:var(--ok);border-color:var(--ok)}
.effect.mut{color:var(--warn);border-color:var(--warn)}
.effect.destr{color:var(--danger);border-color:var(--danger)}
.ac{display:none;position:absolute;top:-8px;right:8px;background:var(--planned);color:#fff;font-size:9.5px;
  font-family:var(--mono);border-radius:4px;padding:1px 6px;z-index:5;box-shadow:var(--shadow)}
.acmode .ac{display:inline-block}
[data-acin]{position:relative}
.acin{display:none;font-size:9.5px;font-family:var(--mono);color:var(--planned);border:1px dashed var(--planned);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.acmode .acin{display:inline-block}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media(max-width:940px){.two{grid-template-columns:1fr}}
.debug-shell{width:min(920px,100%);display:flex;flex-direction:column;gap:16px}
.gsec{display:flex;flex-direction:column;gap:10px;min-width:0}
.gsec>.sechead{display:flex;align-items:baseline;gap:8px;margin:0;font-size:13px;font-weight:600;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.gsec>.sechead .acc{margin-left:auto;font-size:12px;font-weight:500;color:var(--ink2)}
.gsec>.sechead .acc.ok{color:var(--ok)}
.debug-cols{display:grid;grid-template-columns:minmax(260px,.82fr) minmax(300px,1.18fr);gap:20px;align-items:start}
.debug-stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.page:has([data-sync-id="diagnostics.hilog.summary"]){overflow:hidden}
[data-sync-id="diagnostics.hilog.workspace"]:has([data-sync-id="diagnostics.hilog.summary"]){flex:1;min-height:0}
[data-sync-id="diagnostics.hilog.workspace"]>.device-actions{flex:none}
[data-sync-id="diagnostics.hilog.summary"]{gap:16px;flex:1;min-height:0;overflow:auto}
[data-sync-id="diagnostics.hilog.summary"]>*{flex:none}
[data-sync-id="diagnostics.hilog.summary"] :is(h3,p,dl){margin:0}
[data-sync-id="diagnostics.hilog.summary"] .kv dd{margin:0}
[data-sync-id="diagnostics.hilog.summary"] .gsec>div,[data-sync-id="diagnostics.hilog.digests"]>div{display:flex;flex-direction:column;gap:3px}
.debug-packages{display:flex;flex-direction:column;gap:6px;min-width:0}
.debug-packages h3,.debug-packages p{margin:0}
.debug-disclose>summary{cursor:pointer;list-style:none;color:var(--ink2);font-size:11.5px;font-weight:600}
.debug-disclose>summary::-webkit-details-marker{display:none}
.debug-disclose>summary::before{content:"\25B8 "}
.debug-disclose[open]>summary::before{content:"\25BE "}
.debug-disclose[open]{display:flex;flex-direction:column;gap:6px}
.debug-entry{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 10px;
  border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.debug-entry:hover{background:var(--panel2)}
.debug-entry.on{background:var(--accent-weak);border-color:var(--accent)}
.debug-entry .nm{font-family:var(--mono);font-size:12px}
.debug-entry .sz{margin-left:auto;color:var(--ink2);font-size:11.5px}
.debug-list{border:1px solid var(--line);border-radius:9px;padding:5px;background:var(--panel-solid);max-height:300px;overflow:auto}
.hair-gap{height:1px;background:var(--line);margin:4px 0}
.modal.wide{max-width:720px}
.debug-scope{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink2);font-size:12px}
.debug-source{display:grid;grid-template-columns:minmax(210px,.8fr) minmax(300px,1.2fr);gap:12px}
.debug-field{display:flex;flex-direction:column;gap:5px;min-width:0;color:var(--ink2);font-size:11.5px}
.debug-field .inp{width:100%;color:var(--ink)}
.debug-selection{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:2px}
.debug-selection .summary{color:var(--ink2);font-size:12px;flex:1;min-width:180px}
.debug-result{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1px solid var(--ok);border-radius:11px;background:color-mix(in srgb,var(--panel-solid) 94%,var(--ok) 6%)}
.debug-result .copy{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.debug-result .copy p{margin:0;color:var(--ink2);font-size:12px}
.debug-result .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.debug-manager-list{display:flex;flex-direction:column;gap:8px}
.debug-manager-row{display:grid;grid-template-columns:minmax(140px,.9fr) minmax(180px,1.1fr) auto;gap:12px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel-solid)}
.debug-manager-row.on{border-color:var(--accent);background:var(--accent-weak)}
.debug-manager-row .meta{color:var(--ink2);font:11.5px/1.45 var(--mono);overflow-wrap:anywhere}
.debug-manager-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:940px){.debug-source{grid-template-columns:1fr}.debug-cols{grid-template-columns:1fr}}
@media(max-width:760px){
  .debug-manager-row{grid-template-columns:1fr}.debug-manager-actions{justify-content:flex-start}
  .debug-result{flex-direction:column}
}
/* ---------- Viewer ----------
   1. 页面回到全站语言:page 留白 + 一张 .card 容器,不再全屏裸拼。
   2. 颜色纪律:var(--accent-fill) = 选中填充;var(--accent) = 焦点 / 悬停 / 当前 tab。
   3. 字阶只用 20 / 13 / 12 / 11;左对齐轴统一 12px;间距只用 2 / 4 / 6 / 8 / 10 / 12 / 16。
   4. 设备 mock 与热区共用 VIEWER_NODES 的 1080x1920 bounds,mock 字号用 cqi 随缩放,
      所以任何宽度下框都框在它标注的那个节点上。 */
.viewer-page{padding:14px 16px 10px;gap:10px;overflow:hidden}
.viewer-page>.viewer-workspace{flex:1;min-height:0}
.viewer-lead{display:flex;align-items:center;gap:12px;min-width:0}
.viewer-toolbar{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.viewer-toolbar .spacer{flex:1;min-width:8px}
.viewer-toolbar select.inp{flex:0 1 auto;min-width:0}
.viewer-toolbar input.inp{flex:0 1 240px;min-width:120px}
.viewer-toolbar .btn{white-space:nowrap}
.viewer-status{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:11px;white-space:nowrap}
/* 中性点:"刚刚采集"是事实,不是"健康",不占用 --ok 绿。 */
.viewer-status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none}
.viewer-footer{display:flex;align-items:center;gap:6px;padding:0 2px;flex:none;color:var(--ink2);font:11px/1.4 var(--mono)}
.viewer-empty{flex:1;min-height:0;display:grid;place-items:center;text-align:center;padding:24px}
.viewer-empty>div{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:500px;color:var(--ink2)}
.viewer-empty .symbol{width:36px;height:36px;margin-bottom:2px}
.viewer-empty strong{font-size:14px;color:var(--ink)}
.viewer-empty p{margin:0;font-size:12.5px;text-wrap:pretty}
.viewer-search-nav{display:flex;align-items:center;gap:4px;color:var(--ink2);font:11px var(--mono)}
.viewer-search-nav .btn{min-width:28px;padding:3px 7px}

.viewer-workspace{display:grid;grid-template-columns:minmax(180px,.85fr) minmax(310px,1.35fr);min-width:0;min-height:0;
  background:var(--panel-solid);border:1px solid var(--line);border-radius:11px;box-shadow:var(--control-shadow);overflow:hidden}
.viewer-pane,.viewer-devtools{min-width:0;min-height:0}
.viewer-pane{display:flex;flex-direction:column;border-inline-end:1px solid var(--line)}
.viewer-pane-head{min-height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;flex:none;
  border-bottom:1px solid var(--line);background:var(--panel2)}
.viewer-pane-head h2{white-space:nowrap;font-size:12px}
.viewer-pane-head .trailing{margin-inline-start:auto;display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--ink2);white-space:nowrap}
.viewer-pane-head .trailing.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.viewer-devtools{--viewer-tree-size:60%;display:grid;grid-template-rows:minmax(150px,var(--viewer-tree-size)) 1px minmax(130px,1fr)}
.viewer-tree-pane,.viewer-inspector{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
/* macOS 分隔条是 1px hairline,拖拽热区靠伪元素撑到 9px,不画 7px 灰带。 */
.viewer-splitter{position:relative;z-index:2;border:0;padding:0;background:var(--line);cursor:row-resize;touch-action:none}
.viewer-splitter::before{content:"";position:absolute;inset-inline:0;inset-block:-4px}
.viewer-splitter:hover,.viewer-splitter:focus-visible{background:var(--accent)}
.viewer-splitter:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.viewer-screen-canvas{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;
  padding:16px;background:var(--ground);container-type:size}
.viewer-screen{position:relative;flex:none;container-type:size;aspect-ratio:1080/1920;inline-size:auto;
  block-size:min(100%,calc(100cqi * 1920 / 1080));overflow:hidden;border-radius:14px;
  background:#eef0f4;color:#1f2124;outline:1px solid rgba(0,0,0,.14);box-shadow:var(--shadow);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.viewer-screen [data-vs]{position:absolute;box-sizing:border-box}
.vs-card{background:#fff;border-radius:2.6cqi;box-shadow:0 .3cqi .9cqi rgba(20,24,32,.06)}
.vs-nav{display:flex;flex-direction:column;justify-content:space-between;padding:2.4cqi 4.2cqi 1.4cqi}
.vs-statusbar{display:flex;align-items:center;justify-content:space-between;font-size:2.4cqi;font-weight:600;letter-spacing:.02em}
.vs-statusbar span:last-child{display:flex;align-items:center;gap:1.2cqi}
.vs-si{height:2.2cqi;width:auto;display:block}
.vs-title{font-size:6cqi;font-weight:700;letter-spacing:-.02em}
.vs-search{display:flex;align-items:center;gap:1.8cqi;padding:0 3.2cqi;border-radius:4.8cqi;color:#8b8f95;font-size:2.8cqi}
.vs-search svg{width:3.2cqi;height:3.2cqi;stroke:currentColor;stroke-width:1.6;fill:none;flex:none}
.vs-avatar{border-radius:50%;background:linear-gradient(155deg,#d3d9e4,#a9b3c3)}
.vs-name{display:flex;align-items:center;font-size:3.2cqi;font-weight:600;white-space:nowrap}
.vs-sub{display:flex;align-items:center;font-size:2.2cqi;color:#83878d;white-space:nowrap}
.vs-icon{display:grid;place-items:center;border-radius:2.1cqi;color:#fff}
.vs-icon svg{width:62%;height:62%;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.vs-label{display:flex;align-items:center;font-size:3cqi;font-weight:500;white-space:nowrap}
.vs-value{display:flex;align-items:center;justify-content:flex-end;font-size:2.6cqi;color:#83878d;white-space:nowrap}
.vs-switch{border-radius:99cqi;background:#3478f6;display:flex;align-items:center;justify-content:flex-end;padding:.5cqi}
.vs-switch::after{content:"";aspect-ratio:1;height:100%;border-radius:50%;background:#fff;box-shadow:0 .3cqi .7cqi rgba(20,24,32,.24)}
.vs-chev{display:grid;place-items:center;color:#bcc0c6}
.vs-chev svg{width:2.8cqi;height:2.8cqi;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.vs-safe{display:grid;place-items:center}
.vs-safe i{width:32%;height:.9cqi;border-radius:99cqi;background:#c2c6cc}

/* 热区永远存在(任何有 bounds 的节点都可选),"显示组件边界"只控制描边。 */
.viewer-hit{position:absolute;margin:0;padding:0;-webkit-appearance:none;appearance:none;
  border:1px solid transparent;border-radius:1.2cqi;background:transparent;color:transparent;cursor:pointer}
.viewer-hit.show{border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
.viewer-hit:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
.viewer-hit.on{z-index:5;border:2px solid var(--accent-fill);background:color-mix(in srgb,var(--accent-fill) 12%,transparent);
  box-shadow:0 0 0 1px rgba(255,255,255,.72)}
.viewer-hit:focus-visible{outline:2px solid var(--accent);outline-offset:1px;z-index:6}
.viewer-hit.on::after{content:attr(data-label);position:absolute;inset-block-end:calc(100% + 4px);inset-inline-start:-2px;
  padding:0 6px;border-radius:6px;background:var(--accent-fill);color:var(--accent-ink);
  font:11px/16px var(--mono);white-space:nowrap;box-shadow:var(--control-shadow)}
.viewer-hit.on.label-end::after{inset-inline-start:auto;inset-inline-end:-2px}
.viewer-hit.on.label-inside::after{inset-block-end:auto;inset-block-start:2px}

.viewer-tree{overflow:auto;flex:1;min-height:0;padding:6px;scroll-padding-block:6px;scrollbar-gutter:stable}
/* 选中态是内缩胶囊,不是通栏色带;#id 靠 auto 列右对齐成一列,标签超长省略而不是硬切。 */
.viewer-tree-row{width:100%;min-height:26px;display:grid;grid-template-columns:16px 16px minmax(0,1fr) auto;
  align-items:center;gap:6px;border:0;border-radius:6px;background:transparent;color:var(--ink);
  padding-block:2px;padding-inline-end:8px;padding-inline-start:calc(6px + (var(--level,1) - 1) * 14px);
  font-size:12px;text-align:start;cursor:pointer}
.viewer-tree-row:hover{background:var(--selection)}
.viewer-tree-row.on{background:var(--accent-fill);color:var(--accent-ink)}
.viewer-tree-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.viewer-tree-row .label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-tree-row .sub{opacity:.66;margin-inline-start:6px}
.viewer-tree-row.on .sub{opacity:.84}
.viewer-tree-id{font:11px var(--mono);opacity:.55;font-variant-numeric:tabular-nums}
.viewer-tree-row.on .viewer-tree-id{opacity:.85}
.viewer-chevron{display:grid;place-items:center;width:16px;height:16px;color:var(--ink2)}
.viewer-tree-row.on .viewer-chevron{color:inherit}
.viewer-chevron svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.viewer-tree-row[aria-expanded="true"] .viewer-chevron svg{transform:rotate(90deg)}
/* 按节点类型分形,不是给每一行发一个同样的空方框。 */
.viewer-node-icon{width:16px;height:16px;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  fill:none;opacity:.6;flex:none}
.viewer-tree-row.on .viewer-node-icon{opacity:.92}

.viewer-inspector-head{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px 12px;
  border-bottom:1px solid var(--line);background:var(--panel2)}
.viewer-inspector-title{display:flex;align-items:center;gap:8px;min-width:0}
.viewer-inspector-title strong{font-size:13px;font-weight:650}
.viewer-inspector-title .viewer-node-icon{opacity:.8}
.viewer-breadcrumb{font:11px var(--mono);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer-inspector .tabs{flex:none;padding-inline:6px;gap:8px}
.viewer-inspector .tabs button{padding:6px;font-size:12px}
.viewer-inspector-body{overflow:auto;min-height:0;flex:1}
.viewer-group-title{position:sticky;inset-block-start:0;z-index:1;margin:0;padding:6px 12px;
  background:var(--chrome);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--ink2)}
.viewer-kv{display:grid;grid-template-columns:150px minmax(0,1fr);margin:0;font-size:12px}
.viewer-kv dt,.viewer-kv dd{margin:0;min-width:0;padding:6px 12px;border-bottom:1px solid var(--line)}
.viewer-kv dt{color:var(--ink2)}
.viewer-kv dd{font-family:var(--mono);overflow-wrap:anywhere}
.viewer-disclosure{margin:10px 12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewer-disclosure summary{padding:8px 10px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer}
.viewer-disclosure .viewer-raw{border-top:1px solid var(--line)}
.viewer-raw{margin:0;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;
  font:12px/1.55 var(--mono);color:var(--ink);background:var(--panel2)}

@media (prefers-reduced-motion:no-preference){
  .viewer-tree-row,.viewer-hit,.viewer-splitter,.viewer-inspector .tabs button{
    transition-property:background-color,border-color,color;transition-duration:120ms;
    transition-timing-function:cubic-bezier(.2,0,0,1)}
  .viewer-chevron svg{transition:transform 120ms cubic-bezier(.2,0,0,1)}
}
@media(max-width:1050px){
  .viewer-workspace{grid-template-columns:minmax(160px,.75fr) minmax(280px,1.25fr)}
  .viewer-toolbar{flex-wrap:wrap}
}
@media(max-width:760px){
  .viewer-page{overflow-y:auto;gap:12px}
  .viewer-lead{flex-direction:column;align-items:flex-start}
  .viewer-toolbar{width:100%}
  .viewer-workspace{grid-template-columns:1fr;flex:none;min-height:auto}
  .viewer-pane{min-height:460px;border-inline-end:0;border-bottom:1px solid var(--line)}
  .viewer-devtools{min-height:640px}
}
/* ---------- Diagnostic Session ----------
   Trace event 是会话内的主选择身份；画面和日志是共享时间光标的投影，不是三个并排文件查看器。 */
.diagnostic-page{padding:10px 12px;gap:10px;overflow:hidden}
.diagnostic-page>.diag-shell{flex:1;min-height:0}
.diag-shell{width:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.diag-toolbar{display:flex;align-items:center;gap:8px;min-height:34px;flex-wrap:wrap}
.diag-toolbar .spacer{flex:1;min-width:10px}
.diag-target{display:inline-flex;align-items:center;gap:7px;min-width:0;color:var(--ink2);font-size:11.5px}
.diag-target b{color:var(--ink);font-weight:600}
.diag-align{min-height:27px;display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--warn);
  border-radius:999px;background:transparent;color:var(--warn);font-size:11px;font-weight:600;cursor:pointer}
.diag-align:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.diag-overview{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(420px,1.2fr);gap:1px;min-height:0;flex:0 1 285px;

function advanceJob(j){

  if(j.cancelled&&j.phaseIdx>=j.safeBoundary){finishJob(j,"cancelled",lc('演示：已在安全边界取消；未提供补偿或参数读回证据。','Demo: cancelled at a safe boundary; no compensation or parameter readback evidence was supplied.'));return;}

  j.log.push("→ "+ph);
  if(j.pauseAt===ph){j.awaiting=true;j.log.push("检测到断连后回连:等待用户 rebind 确认(不静默续刷)。");

function continuationReason(h){
  if(!h||h.st==='interrupted'||h.outcomeUnknown)return 'continuation_source_not_repeatable';

  if(h.target!=='TGT-958780b2ffb7'||h.binding!==3)return 'continuation_target_or_binding_changed';
  if(h.inputs.uiScreenshot||h.inputs.traceCategories?.length||h.inputs.markers?.length)return 'continuation_inputs_not_read_only_or_invalid';
  return null;

function diagFramePaneHTML(){
  const s=activeDiagSession(),cursor=S.diagnostics.cursor;
  let stage="",meta="";
  if(s.video){
    const frame=diagFrameAt(cursor);
    if(frame){
      const delta=frame.time-cursor;
      stage=diagDeviceFrameHTML("录屏帧",diagTime(frame.time),null);
      meta=`<b>Frame #${frame.index}</b><div class="diag-frame-time">${diagTime(frame.time)} · 画面 ${diagDelta(delta)}</div>
        <span class="chip warn">${esc(s.alignChip)}</span><p>按视频 PTS 解码；画面时间不等同于 Trace event start。</p>`;
    }else{
      stage=diagDeviceFrameHTML(null,null,`<b>这一时刻没有可证明对应的画面</b><br>录屏在 00:15.450–00:16.000 断流。`);
      meta=`<b>录屏缺口</b><span class="chip warn">无法关联画面</span><p>Trace 与日志仍可查看，但这里不会保留上一帧制造连续假象。</p>`;
    }
  }else{
    const hit=diagShotAt(cursor);
    if(hit){
      const m=hit.marker,delta=m.shot.time-cursor;
      stage=diagDeviceFrameHTML("Marker 截图",diagTime(m.shot.time),null);
      meta=`<b>Marker ${hit.index} 截图</b><div class="diag-frame-time">${diagTime(m.shot.time)} · 画面 ${diagDelta(delta)}</div>
        <span class="chip warn">拍摄于 Marker 后 +${m.shot.afterMs} ms</span><p>截图只代表拍摄时刻，不代表 Marker 时刻的画面；问题瞬间可能已经过去。</p>`;
    }else{
      const failed=s.markers.find(m=>m.shotFailed);
      const shots=s.markers.filter(m=>m.shot).map(m=>diagTime(m.shot.time)).join("、");
      stage=diagDeviceFrameHTML(null,null,failed?`<b>Marker 截图失败</b><br>${esc(failed.shotFailed)}。`:`<b>这一时刻没有画面证据</b><br>本次会话未持续录屏。`);
      meta=failed?`<b>截图缺失</b><span class="chip danger">失败</span><p>Marker 时间点保留；失败原因随 Session 保存，不用旧画面或占位图补齐。</p>`
        :`<b>未持续录屏</b><span class="chip dim">Marker 截图</span><p>${shots?`截图仅在拍摄时刻可见：${shots}。`:"本次会话没有保存任何截图。"}画面证据缺失时如实显示，不做连续假象。</p>`;
    }
  }

    <div class="diag-pane-head"><h2 id="diagFrameTitle">当前画面</h2><span class="trailing">Screen track</span></div>

function diagTimelineHTML(){

  const range=S.diagnostics.rangeStart==null?"":`<span class="diag-range" style="left:${Math.min(cursor,diagPercent(S.diagnostics.rangeStart))}%;width:${Math.abs(cursor-diagPercent(S.diagnostics.rangeStart))}%" aria-hidden="true"></span>`;
  let screen="",screenExtra="";

    screen=DIAG_FRAMES.map(f=>`<button class="diag-thumb ${frame?.index===f.index?"on":""}" style="left:${diagPercent(f.time)}%" onclick="setDiagCursor(${f.time})" aria-label="选择录屏 Frame ${f.index}，${diagTime(f.time)}"></button>`).join("");

      :m.shotFailed?`<span class="diag-shot failed" style="left:${diagPercent(m.time)}%" title="截图失败：${esc(m.shotFailed)}" aria-hidden="true"></span>`:"").join("");
    screenExtra=`<span class="hint" style="position:absolute;inset-inline-end:8px;inset-block-start:8px;font-size:9.5px">未持续录屏 · 仅 Marker 截图</span>`;

  const markers=s.markers.map((m,i)=>`<button class="diag-marker ${m.kind==="auto"?"auto":""}" style="left:${diagPercent(m.time)}%" onclick="setDiagCursor(${m.time})" aria-label="选择 Marker ${i+1}（${m.kind==="auto"?"自动":"手动"}），${esc(m.label)}，${diagTime(m.time)}" title="${m.kind==="auto"?"自动":"手动"} · ${esc(m.label)}"></button>`).join("");
  const body=(content,extra="")=>`<div class="diag-track-body">${range}${cursorLine}${content}${extra}</div>`;
  return `<section class="diag-timeline" aria-labelledby="diagTimelineTitle"><div class="diag-timeline-head"><h2 id="diagTimelineTitle">Trace 时间轴</h2>

function addDiagMarker(kind="manual"){
  if(!S.diagnostics.running)return;const time=DIAG_START+Math.min(7.8,S.diagnostics.elapsed/Math.max(1,S.diagnostics.dur)*8);
  const n=S.diagnostics.markers.length+1;
  if(kind==="auto"){
    S.diagnostics.markers.push({time,label:"自动 · frame deadline missed（演示）",kind:"auto",shotState:"none",shotAfterMs:0});
    S.diagnostics.job?.log.push(`Auto marker ${n} @ ${diagTime(time)} · frame deadline missed`);renderDrawer();renderPageIf(["diagnostics"]);return;
  }
  const m={time,label:"问题出现",kind:"manual",shotState:"pending",shotAfterMs:0};
  S.diagnostics.markers.push(m);S.diagnostics.job?.log.push(`Marker ${n} @ ${diagTime(time)} · 截图拍摄中（事后）`);renderDrawer();renderPage();
  setTimeout(()=>{if(m.shotState!=="pending")return;m.shotState="saved";m.shotAfterMs=512;
    S.diagnostics.job?.log.push(`Marker ${n} screenshot captured @ +512 ms`);renderDrawer();renderPageIf(["diagnostics"]);},900);

function stopDiagnostic(result="succeeded"){

      shot:m.kind==="manual"&&m.shotState==="saved"?{time:Math.min(DIAG_END,m.time+.512),afterMs:512}:null,shotFailed:null}));

      alignNote:"演示 Session：时间数据复用演示 trace。生产实现中，环形缓冲的回溯窗口与各来源映射均以 Runtime 事实为准。"};
    DIAG_SESSIONS.unshift(sess);S.diagnostics.session=0;
    S.diagnostics.cursor=captured[0]?.time||13.242;S.diagnostics.rangeStart=null;S.diagnostics.selectedEvent=null;S.diagnostics.selectedLog=nearestDiagLogID(S.diagnostics.cursor);

  }

function saveDebugServer(id){

  }
  const name=$("dbgName").value.trim(),host=$("dbgHost").value.trim(),port=$("dbgPort").value.trim();
  const username=$("dbgUser").value.trim(),auth=$("dbgAuth").value,root=$("dbgRoot").value.trim();
  if(!name){debugServerEditorError(lc("输入用于识别这台服务器的显示名称。","Enter a display name for this server."),"dbgName");return;}
  if(!host){debugServerEditorError(lc("输入 SSH 主机名或 IP。","Enter an SSH hostname or IP address."),"dbgHost");return;}
  if(!/^\d+$/.test(port)||Number(port)<1||Number(port)>65535){debugServerEditorError(lc("端口必须是 1 到 65535 的十进制数字。","Enter a decimal port from 1 to 65535."),"dbgPort");return;}
  if(!username){debugServerEditorError(lc("输入 SSH 登录用户名。","Enter the SSH username."),"dbgUser");return;}
  if(!root.startsWith("/")){debugServerEditorError(lc("编译根目录必须是绝对路径。","Enter an absolute build-root path."),"dbgRoot");return;}
  const old=DEBUG_SERVERS.find(x=>x.id===id);
  const next={id:id||("srv-"+(DEBUG_SERVERS.length+1)),name,host,port,username,auth,

const LOGPOOL=[
  {lv:"I",tag:"ArkUI",m:"[list_layout] measure ok, node 104"},
  {lv:"W",tag:"ArkUI",m:"[render] flush delayed 19ms"},
  {lv:"W",tag:"Graphic",m:"buffer queue starved, dropping 1 frame"},
  {lv:"E",tag:"AbilityMS",m:"connect timeout, bundle=com.example.settings"},
  {lv:"I",tag:"AppSpawn",m:"loaded app-owned libfeature_debug.so"},
  {lv:"W",tag:"Net",m:"reverse rule tcp:9229 already bound, reusing"},
  {lv:"E",tag:"Ability",m:"onForeground took 118ms"},
  {lv:"W",tag:"ArkUI",m:"image decode fell back to software path"}
];
const LVORD={D:0,I:1,W:2,E:3};
function logText(){
  const g=S.lg;
  if(!g.lines.length)return lc("尚未连接实时日志流\nRuntime 采集可发布有界分片与 manifest；暂停此视图绝不会停止 host 采集。","No live stream is attached\nA Runtime capture can publish bounded shards and a manifest. Pausing this viewport would never stop host capture.");
  return g.lines.filter(l=>LVORD[l.lv]>=LVORD[g.lvl]&&(!g.tag||l.tag.toLowerCase().includes(g.tag.toLowerCase())))
    .map(l=>`${l.t}  ${l.lv}  ${l.tag}: ${l.m}`).join("\n");
}
function updateLogDom(){
  const stream=$("logstream");if(stream)stream.textContent=logText();
  const chip=$("shardchip");if(chip)chip.textContent=lc("已发布输出预算：512 MiB","Published output budget: 512 MiB");
}
function logRequestValid(){
  return /^[0-9]+$/.test(S.lg.seconds)&&Number(S.lg.seconds)>=1&&Number(S.lg.seconds)<=600&&
    ['domain','tag','pid','keyword','marker'].every(name=>!S.lg[name]||
      (Array.from(S.lg[name]).length<=200&&/^[\p{L}\p{N}._:-]+$/u.test(S.lg[name])));
}
function setLogInput(input,key){
  if(!['seconds','domain','tag','pid','keyword','marker'].includes(key))return;
  S.lg[key]=input.value;
  const start=document.querySelector('[data-sync-id="debug.logs.start"]');if(start)start.disabled=!logRequestValid();
  const seconds=document.querySelector('[data-log-duration]');if(seconds)seconds.textContent=S.lg.seconds;
  const filters=document.querySelector('[data-log-filters]');if(filters)filters.textContent=logFilterTokens();
  const error=document.querySelector('[data-log-invalid]');if(error)error.hidden=logRequestValid();
  updateLogDom();
}
function setLogTag(el){setLogInput(el,'tag');}
function startLogs(){
  if(S.lg.on||!logRequestValid())return;
  S.lg.on=true;S.lg.paused=false;S.lg.pend=0;
  S.lg.deadline=Date.now()+Number(S.lg.seconds)*1000;
  S.lg.timer=setInterval(()=>{
    if(Date.now()>=S.lg.deadline){stopLogs();return;}
    const seed=LOGPOOL[S.lg.lines.length%LOGPOOL.length];
    const t=new Date(Date.now()).toISOString().slice(11,23);
    S.lg.lines.push({t,lv:seed.lv,tag:seed.tag,m:seed.m});
    if(S.lg.lines.length>60)S.lg.lines.shift();
    if(S.lg.paused)S.lg.pend++;else updateLogDom();
  },700);
  renderPage();
}
function stopLogs(){if(!S.lg.on)return;clearInterval(S.lg.timer);S.lg.on=false;S.lg.paused=false;S.lg.pend=0;renderPage();}
function togglePauseLogs(){S.lg.paused=!S.lg.paused;if(!S.lg.paused)S.lg.pend=0;renderPage();}
function logFilterTokens(){
  const parts=[];
  for(const name of ['domain','tag','pid','keyword','marker']){
    const value=S.lg[name];
    if(value&&Array.from(value).length<=200&&/^[\p{L}\p{N}._:-]+$/u.test(value))parts.push(name+':'+value);
  }
  parts.push("level:"+({I:"info",W:"warn",E:"error"}[S.lg.lvl]||"warn"));
  return "["+parts.join(", ")+"]";
}

function flashActivityJobs(){
  const rows=HIST.filter(h=>['flash.full-restore@1','flash.dayu200','flash.dayu200@1'].includes(h.op));
  if(S.flashJob){const index=rows.findIndex(h=>h.id===S.flashJob.id),record=flashHistoryRecord(S.flashJob);if(index<0)rows.push(record);else rows[index]=record;}
  const date=h=>{const value=Date.parse(h.finishedAtUTC||h.startedAtUTC||h.createdAtUTC);return Number.isFinite(value)?value:-Infinity;};
  return rows.sort((a,b)=>date(a)===date(b)?(a.id<b.id?-1:a.id>b.id?1:0):date(b)-date(a));

function flashEpochEstablished(h){return !!(h?.supersededByRecoveryEpochID||h?.resolvedByTargetAliasResolutionID);}

function advanceFlash(j){
  if(j.state!=="running")return;
  const p=S.flashProgress,previous=p.stage;p.tick++;
  if(j.cancelled&&p.stage!=="write"){finishFlash(j,"cancelled","已在安全边界停止，未显示成功结果。");return;}
  if(p.tick<=2){p.stage="prepare";j.phaseIdx=0;}
  else if(p.tick<=4){p.stage="loader";j.phaseIdx=1;}
  else if(p.tick<=17){p.stage="write";j.phaseIdx=2;p.bytesDone=Math.min(p.totalBytes,p.totalBytes*(p.tick-4)/13);}
  else if(j.cancelled){finishFlash(j,"cancelled","当前分区写入完成后，剩余步骤已停止。");return;}
  else if(p.tick<=20){p.stage="verify";j.phaseIdx=3;p.bytesDone=p.totalBytes;}
  else {finishFlash(j,"succeeded","完成：设备回报 build 与所选镜像一致。");return;}
  if(previous!==p.stage)j.log.push("→ "+j.phases[j.phaseIdx]);
  renderDrawer();renderPageIf(["flash"]);j.timer=setTimeout(()=>advanceFlash(j),j.tick);

const HISTORY_ACTIVE_STATES=['queued','preflight','running','waitingForDevice','awaitingRebindConfirmation','planning','cancelRequested','cancellingAtSafeBoundary','waitingForRecovery','reconciling','recoveringByCompleteOverwrite','resumeAtConfirmedSafeBoundary','userAbandonRequested','finalizing'];

function historyDate(h){return Date.parse(h.finishedAtUTC??h.startedAtUTC??h.createdAtUTC);}
function historyMatchesStatus(h,status){return status==='all'||(status==='attention'?historyNeedsAttention(h):status==='active'?HISTORY_ACTIVE_STATES.includes(h.st):h.st===status);}
function historyMatchesMode(h,mode){return mode==='all'||(mode==='unknown'?h.mode==null:mode==='planOnly'?['planOnly','planned'].includes(h.mode):h.mode===mode);}
function historyMatchesTime(h,time,now){return time==='all'||historyDate(h)>=now-({lastHour:3600,lastDay:86400,lastWeek:604800}[time]||0)*1000;}
function resetHistoryFilters(){S.hf={kind:'all',query:'',status:'all',mode:'all',target:'all',session:'all',time:'all'};S.historyLimit=6;}

function filteredHistory(now=Date.now()){
  const f=S.hf,q=(f.query||'').trim().toLowerCase();
  return HIST.filter(h=>(f.kind==='all'||h.kind===f.kind)&&
    (!q||[h.id,h.sessionID,h.op,h.target,h.st,h.mode].some(value=>String(value||'').toLowerCase().includes(q)))&&
    historyMatchesStatus(h,f.status)&&historyMatchesMode(h,f.mode)&&
    (f.target==='all'||h.target===f.target)&&(f.session==='all'||h.sessionID===f.session)&&historyMatchesTime(h,f.time,now))
    .sort((a,b)=>{const left=historyDate(a),right=historyDate(b);return (Number.isFinite(right)?right:-Infinity)-(Number.isFinite(left)?left:-Infinity)||b.id.localeCompare(a.id);});

function traceViewerStepMatch(direction){

function traceViewerRange(startInput,endInput){

function traceViewerAddMark(kept=false){

function traceViewerAddFlag(time){
