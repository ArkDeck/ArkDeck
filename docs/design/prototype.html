<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ArkDeck 交互原型 v0.4</title>
<style>
:root{
  color-scheme:light dark;
  --ground:#F5F5F7; --panel:#FFFFFF; --panel-solid:#FFFFFF; --panel2:rgba(242,242,247,.82);
  --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#8E8E93; --line:rgba(60,60,67,.18);
  --accent:#006EDB; --accent-fill:#0065CA; --accent-ink:#FFFFFF; --accent-weak:rgba(0,110,219,.12);
  --ok:#1F7A35; --warn:#8A4B00; --danger:#C10014; --danger-fill:#C10014; --danger-weak:rgba(193,0,20,.08);
  --planned:#7047B7; --sim:#8A4B00; --selection:rgba(0,110,219,.12);
  --shadow:0 1px 2px rgba(0,0,0,.08),0 18px 52px rgba(0,0,0,.14);
  --control-shadow:0 1px 1px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --chrome:rgba(246,246,248,.82); --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#1C1C1E; --panel:#242426; --panel-solid:#2C2C2E; --panel2:rgba(44,44,46,.78);
  --ink:#F5F5F7; --ink2:#AEAEB2; --ink3:#8E8E93; --line:rgba(235,235,245,.16);
  --accent:#58A6FF; --accent-fill:#0065CA; --accent-ink:#FFFFFF; --accent-weak:rgba(88,166,255,.18);
  --ok:#4CD964; --warn:#FFB340; --danger:#FF6961; --danger-fill:#C52828; --danger-weak:rgba(255,105,97,.12);
  --planned:#C3A6FF; --sim:#FFB340; --selection:rgba(88,166,255,.18);
  --shadow:0 1px 2px rgba(0,0,0,.38),0 20px 56px rgba(0,0,0,.45);
  --control-shadow:0 1px 1px rgba(0,0,0,.28); --chrome:rgba(36,36,38,.82);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#1C1C1E; --panel:#242426; --panel-solid:#2C2C2E; --panel2:rgba(44,44,46,.78);
  --ink:#F5F5F7; --ink2:#AEAEB2; --ink3:#8E8E93; --line:rgba(235,235,245,.16);
  --accent:#58A6FF; --accent-fill:#0065CA; --accent-ink:#FFFFFF; --accent-weak:rgba(88,166,255,.18);
  --ok:#4CD964; --warn:#FFB340; --danger:#FF6961; --danger-fill:#C52828; --danger-weak:rgba(255,105,97,.12);
  --planned:#C3A6FF; --sim:#FFB340; --selection:rgba(88,166,255,.18);
  --shadow:0 1px 2px rgba(0,0,0,.38),0 20px 56px rgba(0,0,0,.45);
  --control-shadow:0 1px 1px rgba(0,0,0,.28); --chrome:rgba(36,36,38,.82);
}
:root[data-theme="light"]{
  color-scheme:light; --ground:#F5F5F7; --panel:#FFFFFF; --panel-solid:#FFFFFF; --panel2:rgba(242,242,247,.82);
  --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#8E8E93; --line:rgba(60,60,67,.18);
  --accent:#006EDB; --accent-fill:#0065CA; --accent-ink:#FFFFFF; --accent-weak:rgba(0,110,219,.12);
  --ok:#1F7A35; --warn:#8A4B00; --danger:#C10014; --danger-fill:#C10014; --danger-weak:rgba(193,0,20,.08);
  --planned:#7047B7; --sim:#8A4B00; --selection:rgba(0,110,219,.12);
  --shadow:0 1px 2px rgba(0,0,0,.08),0 18px 52px rgba(0,0,0,.14);
  --control-shadow:0 1px 1px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04); --chrome:rgba(246,246,248,.82);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
button,input,select{font:inherit}
button{color:inherit}
.note{max-width:1240px;width:100%;color:var(--ink2);font-size:12px;text-wrap:pretty}
.note b{color:var(--ink)}
.window{width:100%;max-width:1240px;height:min(800px,calc(100vh - 96px));min-height:600px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.titlebar{height:52px;display:grid;grid-template-columns:minmax(210px,1fr) auto minmax(210px,1fr);align-items:center;
  gap:10px;background:var(--chrome);border-bottom:1px solid var(--line);padding:0 12px;flex:none;
  -webkit-backdrop-filter:blur(28px) saturate(1.35);backdrop-filter:blur(28px) saturate(1.35)}
.titlebar .leading,.titlebar .trailing{display:flex;align-items:center;gap:8px;min-width:0}
.titlebar .trailing{justify-content:flex-end}
.lights{display:flex;gap:7px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.titlebar .t{text-align:center;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar-btn,.acbtn{min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-size:11px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel-solid) 78%,transparent);
  color:var(--ink2);border-radius:7px;padding:0 9px;cursor:pointer;box-shadow:var(--control-shadow)}
.toolbar-btn.icon-only{width:28px;padding:0}
.acbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.symbol{width:16px;height:16px;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none}
.symbol.sm{width:14px;height:14px}
.main{flex:1;display:flex;min-height:0}
.sidebar{width:250px;flex:none;background:var(--panel2);border-right:1px solid var(--line);padding:12px 10px;
  overflow-y:auto;display:flex;flex-direction:column;gap:18px;-webkit-backdrop-filter:blur(28px) saturate(1.25);backdrop-filter:blur(28px) saturate(1.25)}
.sidebar.hidden{display:none}
.sec{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink2);padding:0 9px 5px}
.dev{width:100%;display:flex;align-items:center;gap:8px;padding:6px 8px;min-height:42px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;background:transparent;text-align:start}
.dev:hover{background:var(--selection)}
.dev.on{background:var(--selection)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.off{background:var(--ink2)}
.dev .dn{flex:1;min-width:0}.dev .dn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .dn span{font-size:11px;color:var(--ink2)}
.tag{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink2);flex:none}
.addlink{min-height:28px;font-size:12px;color:var(--accent);padding:3px 8px;cursor:pointer;background:none;border:none;
  text-align:start;display:flex;align-items:center;gap:7px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{min-height:32px;display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:8px;border:none;
  background:none;color:var(--ink);font-size:13px;cursor:pointer;text-align:start;width:100%}
.nav button:hover{background:var(--selection)}
.nav button.on{background:var(--selection);font-weight:600}
.nav button.on .ic{color:var(--accent)}
.nav .ic{width:18px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.nav .preview{margin-inline-start:auto;font-size:9px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);
  border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.content{flex:1;display:flex;flex-direction:column;min-width:0}
.page{flex:1;overflow-y:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:20px;scrollbar-gutter:stable}
.page>*{flex-shrink:0}
h1{font-size:20px;line-height:1.15;font-weight:650;letter-spacing:-.018em;margin:0;text-wrap:balance}
h2{font-size:13px;line-height:1.3;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:8px;margin:0}
.card{background:color-mix(in srgb,var(--panel-solid) 92%,transparent);border:1px solid var(--line);border-radius:11px;
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;box-shadow:var(--control-shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--ink2)}.kv dd{font-family:var(--mono);font-size:11.5px;word-break:break-all}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;
  border:1px solid;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:var(--ok);background:transparent}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.danger{color:var(--danger);border-color:var(--danger)}
.chip.dim{color:var(--ink2);border-color:var(--line)}
.chip.planned{color:var(--planned);border-color:var(--planned)}
.chip.sim{color:var(--sim);border-color:var(--sim);border-style:dashed}
.btn{min-height:29px;border:1px solid var(--line);background:var(--panel-solid);color:var(--ink);border-radius:7px;
  padding:4px 12px;font-size:13px;cursor:pointer;box-shadow:var(--control-shadow)}
.btn:hover{background:color-mix(in srgb,var(--panel-solid) 88%,var(--accent) 12%)}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink)}
.btn.pri:hover{opacity:.9}
.btn.danger{background:var(--danger-fill);border-color:var(--danger-fill);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn:focus-visible,.nav button:focus-visible,.dev:focus-visible,.addlink:focus-visible,.toolbar-btn:focus-visible,
.acbtn:focus-visible,.drawer .bar:focus-visible,.tabs button:focus-visible,.filters button:focus-visible,
.tagpick button:focus-visible,[tabindex="0"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .btn,.toolbar-btn,.acbtn,.nav button,.dev{transition-property:transform,background-color,border-color,opacity;transition-duration:120ms;transition-timing-function:cubic-bezier(.2,0,0,1)}
  .btn:active,.toolbar-btn:active,.acbtn:active{transform:scale(.96)}
}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:11px;color:var(--ink2);text-align:start;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.sel-row{background:var(--selection)}
.mono{font-family:var(--mono);font-size:11.5px}
.banner{background:color-mix(in srgb,var(--panel-solid) 92%,var(--warn) 8%);border:1px solid color-mix(in srgb,var(--warn) 55%,var(--line));border-radius:11px;padding:12px 14px;
  display:flex;flex-direction:column;gap:0}
.banner header{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--warn);padding:0 2px 7px}
.ritem{display:flex;align-items:flex-start;gap:10px;background:transparent;border-top:1px solid var(--line);padding:10px 2px}
.banner header+.ritem{border-top:none}
.ritem .ri{flex:1}.ritem .ri b{font-size:13px}.ritem .ri p{font-size:12px;color:var(--ink2);margin-top:2px}
.ritem .ra{display:flex;gap:8px;flex-none;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.radio input{margin-top:3px;accent-color:var(--accent)}
.radio .rd{color:var(--ink2);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel-solid);box-shadow:var(--control-shadow)}
.seg button{min-height:29px;border:none;border-inline-end:1px solid var(--line);background:transparent;padding:5px 15px;font-size:13px;cursor:pointer;color:var(--ink)}
.seg button:last-child{border-inline-end:none}
.seg button.on{background:var(--selection);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent)}
.seg.mini button{min-height:25px;padding:3px 10px;font-size:11.5px}
.drawer{flex:none;border-top:1px solid var(--line);background:var(--chrome);-webkit-backdrop-filter:blur(24px) saturate(1.25);backdrop-filter:blur(24px) saturate(1.25)}
.drawer .bar{width:100%;min-height:36px;display:flex;align-items:center;gap:10px;padding:7px 16px;cursor:pointer;
  font-size:12.5px;background:transparent;border:none;text-align:start}
.drawer .bar .st{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer .body{max-height:0;overflow:hidden}
.drawer.open .body{max-height:300px;overflow-y:auto}
@media (prefers-reduced-motion:no-preference){.drawer .body{transition-property:max-height;transition-duration:180ms;transition-timing-function:cubic-bezier(.2,0,0,1)}}
@media (prefers-reduced-motion:reduce){.drawer .body{transition:none}.pulse{animation:none}
  .ibar::after{animation:none;left:0;width:100%;opacity:.35}}
.job{display:flex;flex-direction:column;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel-solid) 76%,transparent)}
.job:first-child{border-top:none}
.job .jh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.job .jh b{font-size:13px}
.phases{display:flex;gap:4px;flex-wrap:wrap;font-size:11px}
.ph{padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--ink2)}
.ph.done{border-color:var(--ok);color:var(--ok)}
.ph.run{border-color:var(--accent);color:var(--accent);font-weight:600}
.pulse{animation:pu 1.2s ease-in-out infinite}
@keyframes pu{50%{opacity:.45}}
.ibar{height:3px;border-radius:2px;background:var(--accent-weak);overflow:hidden;position:relative;
  flex:1;min-width:60px;max-width:200px;align-self:center}
.ibar::after{content:"";position:absolute;left:-40%;width:40%;top:0;bottom:0;background:var(--accent);
  border-radius:2px;animation:ib 1.4s linear infinite}
@keyframes ib{to{left:100%}}
.logtail{font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--ink2);background:color-mix(in srgb,var(--ground) 82%,var(--panel-solid));
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;max-height:110px;overflow-y:auto;white-space:pre-wrap;font-variant-numeric:tabular-nums}
.stream{max-height:220px;color:var(--ink)}
.rebind{border:1px solid var(--accent);background:var(--accent-weak);border-radius:8px;padding:8px 12px;
  font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative}
.inp{min-height:29px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel-solid);color:var(--ink);font:inherit;font-size:13px;box-shadow:var(--control-shadow)}
.inp.mono{font-family:var(--mono);font-size:12px}
.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select.inp{cursor:pointer}
.livetag{font-size:9.5px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 4px;vertical-align:middle}
.modal-bg{position:fixed;inset:0;background:rgba(15,18,22,.36);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:72px 20px 20px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.modal{background:var(--panel-solid);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);
  max-width:560px;width:100%;padding:20px 22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 96px);overflow-y:auto}
.modal h3{font-size:16px;line-height:1.25;margin:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;text-wrap:balance}
.modal.dangerm h3{color:var(--danger)}
.impact{border:1px solid var(--danger);background:var(--danger-weak);border-radius:8px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.impact ul{margin-left:18px}
.checks label{display:flex;gap:8px;font-size:13px;align-items:flex-start;cursor:pointer;margin-bottom:6px}
.checks input{margin-top:3px;accent-color:var(--danger)}
.checks.safe input{accent-color:var(--accent)}
.mfoot{display:flex;justify-content:flex-end;gap:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters .fl{font-size:11px;color:var(--ink2);margin-right:2px}
.filters button{min-height:26px;font-size:11.5px;border:1px solid var(--line);background:var(--panel-solid);border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--ink2)}
.filters button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);font-weight:600}
.tagpick{display:flex;gap:6px;flex-wrap:wrap}
.tagpick button{min-height:26px;font-size:11.5px;font-family:var(--mono);border:1px solid var(--line);background:var(--panel-solid);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--ink2)}
.tagpick button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);font-weight:600}
.tagpick button:disabled{opacity:.4;cursor:not-allowed;border-style:dashed}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{min-height:32px;border:none;background:none;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.hint{font-size:12px;color:var(--ink2)}
.warnbox{border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start;position:relative}
.okbox{border:1px solid var(--ok);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.effect{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:4px;padding:1px 6px;border:1px solid}
.effect.host{color:var(--ink2);border-color:var(--line)}
.effect.read{color:var(--ok);border-color:var(--ok)}
.effect.mut{color:var(--warn);border-color:var(--warn)}
.effect.destr{color:var(--danger);border-color:var(--danger)}
.ac{display:none;position:absolute;top:-8px;right:8px;background:var(--planned);color:#fff;font-size:9.5px;
  font-family:var(--mono);border-radius:4px;padding:1px 6px;z-index:5;box-shadow:var(--shadow)}
.acmode .ac{display:inline-block}
[data-acin]{position:relative}
.acin{display:none;font-size:9.5px;font-family:var(--mono);color:var(--planned);border:1px dashed var(--planned);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.acmode .acin{display:inline-block}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media(max-width:940px){.two{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto}
.empty{color:var(--ink2);font-size:12.5px;font-style:italic}
.summary-strip{display:grid;grid-template-columns:minmax(180px,1.6fr) repeat(3,minmax(100px,.7fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:var(--control-shadow)}
.summary-cell{background:var(--panel-solid);padding:11px 13px;min-width:0}
.summary-cell small{display:block;color:var(--ink2);font-size:10.5px;margin-bottom:2px}
.summary-cell b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.budget-grid{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr));gap:12px}
.metric{display:flex;flex-direction:column;gap:5px;min-width:0}
.metric .mv{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.meter{height:5px;border-radius:999px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.stage-line{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:5px 0 2px}
.stage-node{min-width:88px;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink2);font-size:10.5px;text-align:center}
.stage-node::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--panel-solid);z-index:1}
.stage-node::after{content:"";position:absolute;top:5px;left:50%;right:-50%;height:2px;background:var(--line)}
.stage-node:last-child::after{display:none}.stage-node.done::before{background:var(--ok);border-color:var(--ok)}
.stage-node.now{color:var(--ink);font-weight:600}.stage-node.now::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-weak)}
.op-list{display:flex;gap:6px;flex-wrap:wrap}.op-list .chip{font-family:var(--mono);font-weight:500}
@media(max-width:980px){.summary-strip{grid-template-columns:1fr 1fr}.budget-grid{grid-template-columns:repeat(2,minmax(110px,1fr))}}

<script>
"use strict";
/* ---------- state ---------- */
const S = {
  nav:"overview", device:"dayu200", acMode:false, drawerOpen:false, sidebarOpen:true, appearance:"system",
  recovery:{archived:false},
  auth:{phase:"idle", left:0, t:null},        // idle|polling|timedOut|ready
  permDemo:false,
  dump:{policy:"none", ran:false, running:false, recipe:"elementTree", win:12, comp:"33"},
  trace:{running:false, done:false, mode:"preset", preset:0, dur:15,
         tags:new Set(["ace","app","ability","graphic","ohos","sched","freq","sync"])},
  lg:{on:false, paused:false, pend:0, shard:11.8, piece:3, lvl:"W", tag:"", timer:null, ms:12400,
      lines:[
        {t:"11:02:11.482",lv:"W",tag:"ArkUI",m:"[list_layout] measure retry, node 88"},
        {t:"11:02:11.490",lv:"W",tag:"ArkUI",m:"[render] flush delayed 22ms"},
        {t:"11:02:12.013",lv:"E",tag:"AbilityMS",m:"connect timeout, bundle=com.example.settings"},
        {t:"11:02:12.400",lv:"W",tag:"ArkUI",m:"[list_layout] measure retry, node 91"}
      ]},
  apps:[
    {pkg:"com.example.settings", ver:"1.2.0", running:true,  pid:2841},
    {pkg:"com.demo.gallery",     ver:"0.9.1", running:false, pid:0}
  ],
  fwd:[{l:"tcp:9222", r:"tcp:9222"}],
  cmd:{val:"device.packageInventory", hist:[]},
  flashMode:"execute", flashPrerequisitesReady:true, loaderBound:false, flashJob:null, planSaved:false, lastFlash:null,
  debugTab:"logs", hf:{st:"all", mode:"all", dev:"all"}, histSel:null, histSeq:1,
  hdcSel:"deveco",
  jobs:[], jobSeq:1
};
const DEVICES=[
  {id:"dayu200", name:"DAYU200", tp:"USB", state:"ready", build:"由 Runtime observation 提供", key:"TGT-…"},
  {id:"tab01", name:"待授权设备", tp:"USB", state:"unauthorized", build:"—", key:"connect key 已脱敏"}
];
const NAV=[["overview","overview","Overview"],["flash","flash","Flash"],["debug","debug","Debug"],
  ["dump","dump","UI Dump"],["trace","trace","Trace"],["history","history","History"],
  ["automation","automation","Automation"]];
const HIST=[
  {id:"S-0713-06", st:"cancelled",   mode:"execute",   dev:"DAYU200", what:"Trace · 渲染/动画 30s(用户取消)", when:"07-13 10:21"},
  {id:"S-0712-01", st:"succeeded",   mode:"execute",   dev:"DAYU200", what:"Trace · ArkUI 深度 15s", when:"07-12 14:02"},
  {id:"S-0712-02", st:"planned",     mode:"planOnly",  dev:"DAYU200", what:"Flash · flash.dayu200@1", when:"07-12 15:40"},
  {id:"S-0712-03", st:"succeeded",   mode:"simulated", dev:"SIM-fixture-a3", what:"Flash · 断连注入场景(reconcile 一致)", when:"07-12 16:11"},
  {id:"S-0711-04", st:"interrupted", mode:"execute",   dev:"DAYU200", what:"Flash · flash-partitions(outcomeUnknown)", when:"07-11 23:47"},
  {id:"S-0711-05", st:"failed",      mode:"execute",   dev:"DAYU200", what:"UI Dump · elementTree(设备离线)", when:"07-11 20:15"}
];
const STCHIP={succeeded:'<span class="chip ok">✓ 成功</span>',failed:'<span class="chip danger">✕ 失败</span>',
  planned:'<span class="chip planned">◇ PLANNED</span>',cancelled:'<span class="chip dim">⊘ 已取消</span>',
  interrupted:'<span class="chip warn">⚠ 已中断 · 结果未知</span>'};
function modeBadge(m,fx){return m==="planOnly"?'<span class="chip planned">◇ PLANNED</span>'
  :m==="simulated"?'<span class="chip sim">▤ SIMULATED'+(fx?" · "+fx:"")+'</span>':"";}

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
// Spec §4.4: effect reads as symbol + text, colour only assisting.
const EFFECT_ICON={host:"host",read:"eye",mut:"pencil",destr:"warning"};
function effectBadge(cls,label){return `<span class="effect ${cls}">${icon(EFFECT_ICON[cls],true)}${label}</span>`;}
function icon(name,small=false){return `<svg class="symbol${small?" sm":""}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;}
function toggleAC(){S.acMode=!S.acMode;$("win").classList.toggle("acmode",S.acMode);$("acToggle").classList.toggle("on",S.acMode);}
function toggleDrawer(){
  S.drawerOpen=!S.drawerOpen;$("drawer").classList.toggle("open",S.drawerOpen);$("drawerArrow").textContent=S.drawerOpen?"▾":"▸";
  $("drawerToggle").setAttribute("aria-expanded",String(S.drawerOpen));$("drawerBody").setAttribute("aria-hidden",String(!S.drawerOpen));$("drawerBody").inert=!S.drawerOpen;
}
function toggleSidebar(){S.sidebarOpen=!S.sidebarOpen;$("sidebar").classList.toggle("hidden",!S.sidebarOpen);}
function toggleTheme(){
  S.appearance=S.appearance==="system"?"light":S.appearance==="light"?"dark":"system";
  if(S.appearance==="system")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.dataset.theme=S.appearance;
  $("themeToggle").textContent=S.appearance==="system"?"系统外观":S.appearance==="light"?"浅色外观":"深色外观";
}
function openDrawer(){if(!S.drawerOpen)toggleDrawer();}
function go(nav){S.nav=nav;render();}
function pickDevice(id){S.device=id;S.nav=(DEVICES.find(d=>d.id===id).state==="unauthorized")?"auth":S.nav==="auth"?"overview":S.nav;render();}
function ckGate(btnId,need){const c=document.querySelectorAll("#modalHost .checks input:checked").length;const b=$(btnId);if(b)b.disabled=c<need;}
function doneBtn(el,label){el.textContent=label;el.disabled=true;}

/* ---------- modals ---------- */
let modalReturnFocus=null;
function closeModal(){
  if(!$("modalHost").firstElementChild)return;
  $("modalHost").innerHTML="";
  if(modalReturnFocus&&document.contains(modalReturnFocus))modalReturnFocus.focus();
  modalReturnFocus=null;
}
function modal(html){
  modalReturnFocus=document.activeElement;
  $("modalHost").innerHTML='<div class="modal-bg">'+html+'</div>';
  const dialog=$("modalHost").querySelector(".modal"),heading=dialog?.querySelector("h3");
  if(dialog){dialog.setAttribute("role","dialog");dialog.setAttribute("aria-modal","true");}
  if(heading&&dialog){heading.id="modalTitle";dialog.setAttribute("aria-labelledby","modalTitle");}
  const cancel=$("modalHost").querySelector(".mfoot .btn");
  (cancel||heading||dialog)?.focus();
}
document.addEventListener("keydown",e=>{
  const host=$("modalHost");
  if(e.key==="Escape"&&host.firstElementChild){e.preventDefault();closeModal();return;}
  if(e.key!=="Tab"||!host.firstElementChild)return;
  const focusable=[...host.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex="0"]')];
  if(!focusable.length)return;
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});

/* ---------- jobs ---------- */
function addJob(j){j.id="J"+(S.jobSeq++);j.cancelled=false;S.jobs.push(j);openDrawer();renderDrawer();return j;}
function startJob(j){j.timer=setTimeout(()=>advanceJob(j),j.tick);return j;}
function advanceJob(j){
  if(j.state!=="running")return;
  if(j.cancelled&&j.phaseIdx<j.safeBoundary){j.log.push("— 已请求取消:等待安全边界 —");}
  if(j.cancelled&&j.phaseIdx>=j.safeBoundary){finishJob(j,"cancelled","在安全边界停止;补偿动作已执行,参数已恢复。");return;}
  j.phaseIdx++;
  if(j.phaseIdx>=j.phases.length){finishJob(j,"succeeded",j.doneMsg||"完成:raw 产物 hash 已写入 manifest。");return;}
  const ph=j.phases[j.phaseIdx];
  j.log.push("→ "+ph);
  if(j.pauseAt===ph){j.awaiting=true;j.log.push("检测到断连后回连:等待用户 rebind 确认(不静默续刷)。");
    renderDrawer();renderPageIf(j.pages||[]);return;}
  renderDrawer();renderPageIf(j.pages||[]);
  j.timer=setTimeout(()=>advanceJob(j),j.tick);
}
function finishJob(j,state,msg){
  j.state=state;j.log.push(msg);
  histFromJob(j);
  if(j.onDone)j.onDone(state);
  renderDrawer();renderPage();
}
function cancelJob(id){const j=S.jobs.find(x=>x.id===id);if(!j||j.state!=="running"||j.awaiting)return;
  j.cancelled=true;j.log.push("用户请求取消(策略:atSafeBoundary)");renderDrawer();}
function rebindOk(id){const j=S.jobs.find(x=>x.id===id);if(!j||!j.awaiting)return;j.awaiting=false;
  j.log.push("用户确认 rebind:同一 serial · binding revision 3→4;继续执行。");
  j.timer=setTimeout(()=>advanceJob(j),j.tick);renderDrawer();}
function rebindAbort(id){const j=S.jobs.find(x=>x.id===id);if(!j||!j.awaiting)return;j.awaiting=false;
  finishJob(j,"cancelled","用户中止 rebind:剩余步骤不执行;该结论写入审计。");}
function histFromJob(j){
  HIST.unshift({id:"S-live-0"+(S.histSeq++),
    st:j.mode==="planOnly"?"planned":j.state,
    mode:j.mode,dev:j.dev||"DAYU200",what:j.title,when:"刚刚",live:true});
}
function renderDrawer(){
  const running=S.jobs.filter(j=>j.state==="running");
  let st;
  if(running.length){
    const top=running.slice().sort((a,b)=>(b.risk||1)-(a.risk||1))[0];
    st=running.length+" 个运行中 — "+top.title+":"+(top.awaiting?"等待 rebind 确认":top.phases[top.phaseIdx])
      +"("+Math.min(top.phaseIdx+1,top.phases.length)+"/"+top.phases.length+")";
  } else st=S.jobs.length?S.jobs.length+" 个任务(无运行中)":"没有运行中的任务";
  $("drawerSt").textContent=st;
  $("drawerIbar").style.display=running.length?"block":"none";
  $("drawerBody").innerHTML=S.jobs.slice().reverse().map(j=>{
    const chips={succeeded:'<span class="chip ok">✓ 成功</span>',cancelled:'<span class="chip dim">⊘ 已取消</span>',
      planned:'<span class="chip planned">◇ PLANNED</span>'}[j.state]||"";
    const badge=modeBadge(j.mode,j.mode==="simulated"?"fixture-a3":"");
    const run=j.state==="running";
    return `<div class="job">
      <div class="jh"><b>${esc(j.title)}</b>${badge}${run?'<span class="chip warn pulse">运行中</span>':chips}
        <span style="flex:1"></span>
        ${run&&!j.awaiting?`<button class="btn" onclick="cancelJob('${j.id}')" ${j.cancelled?"disabled":""}>${j.cancelled?"等待安全边界…":"取消(在安全边界)"}</button>`:""}
      </div>
      <div class="phases">${j.phases.map((p,i)=>`<span class="ph ${i<j.phaseIdx?"done":i===j.phaseIdx&&run?"run pulse":""}">${p}</span>`).join("")}</div>
      ${j.awaiting?`<div class="rebind" data-acin><span class="ac">AC-FLASH-010-01</span>
        <b>设备回连,需确认后继续</b><span class="mono">同一 serial · binding revision 3→4 · updater 阶段与 plan 一致</span>
        <span style="flex:1"></span>
        <button class="btn pri" onclick="rebindOk('${j.id}')">确认同一设备,继续</button>
        <button class="btn" onclick="rebindAbort('${j.id}')">中止</button></div>`:""}
      <div class="logtail">${j.log.slice(-200).map(esc).join("\n")}</div>
    </div>`;}).join("")||'<div class="job empty">本次会话尚无任务。</div>';
  $("drawerBody").querySelectorAll(".logtail").forEach(b=>{b.scrollTop=b.scrollHeight;});
}
function renderPageIf(navs){if(navs.includes(S.nav))renderPage();}

/* ---------- sidebar: add target ---------- */
function addTargetModal(){
  modal(`<div class="modal" role="dialog" aria-modal="true">
    <h3>添加 TCP / UART 目标 <span class="acin">REQ-DEV-004/005</span></h3>
    <p class="hint">ArkDeck 不扫描网络,目标只能由你显式添加;断线后需按规格 §5.1 重新确认身份,不做静默重绑。</p>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="inp" id="tgtType"><option>TCP</option><option>UART</option></select>
      <input class="inp mono" id="tgtAddr" placeholder="192.168.1.30:8710 或 /dev/tty.usbserial-1420" style="flex:1">
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">取消</button>
      <button class="btn pri" onclick="addTarget()">添加目标</button></div>
  </div>`);
}
function addTarget(){
  const v=$("tgtAddr").value.trim()||"192.168.1.30:8710";
  const tp=$("tgtType").value;
  DEVICES.push({id:"t"+(S.jobSeq++)+""+DEVICES.length,name:v,tp,state:"off",build:"未连接 — 等待首次确认",key:"—"});
  closeModal();renderDevs();
}

/* ---------- recovery banner ---------- */
function recoveryHTML(){
  if(S.recovery.archived)return "";
  return `<div class="banner" data-acin>
    <header>⚠ 存在未完成的恢复项<span class="ac">REQ-UX-003</span></header>
    <div class="ritem">
      <div class="ri"><b>Flash · flash.dayu200@1 · flash-partitions</b> <span class="chip warn">outcomeUnknown</span>
        <p>原 Job 的设备影响保持未知。Runtime 只有在 durable facts、同一目标、不可变 Artifact 与 Provider complete-overwrite coverage 全部匹配时，才会建立独立恢复 epoch；证据缺失或漂移时零新 dispatch，用户确认不能绕过。</p></div>
      <div class="ra">
        <button class="btn" onclick="go('history')">在 History 查看证据</button>
      </div>
    </div>
  </div>`;
}

/* ---------- Overview ---------- */
function pOverview(){
  return recoveryHTML()+`
  <h1>Overview <span class="acin">REQ-UX-002</span></h1>
  <div class="grid2">
    <div class="card" data-acin><span class="ac">AC-UX-002-01</span>
      <h2>HDC 工具链</h2>
      <dl class="kv">
        <dt>来源</dt><dd>用户选择的 security-scoped HDC</dd>
        <dt>路径</dt><dd>由 Runtime 脱敏投影</dd>
        <dt>平台信任</dt><dd>来自 descriptor-bound probe</dd>
        <dt>client / server / daemon</dt><dd>来自同一 refresh snapshot</dd>
        <dt>server</dt><dd><span class="chip ok">healthy</span> · generation / ownership 由 Runtime 提供</dd>
        <dt>endpoint</dt><dd>来源与保护状态分别展示</dd>
        <dt>SHA-256</dt><dd>完整值可选择查看，不在原型硬编码</dd>

function fmtLeft(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function startAuthPoll(){
  S.auth.phase="polling";S.auth.left=180;
  clearInterval(S.auth.t);
  S.auth.t=setInterval(()=>{S.auth.left--;const el=$("authcd");if(el)el.textContent=fmtLeft(S.auth.left);
    if(S.auth.left<=0){clearInterval(S.auth.t);S.auth.phase="timedOut";renderPage();}},1000);
  setTimeout(()=>{if(S.auth.phase==="polling"){clearInterval(S.auth.t);
    S.auth.phase="ready";DEVICES[1].state="ready";DEVICES[1].name="ohos-tablet";DEVICES[1].build="OpenHarmony 5.0.0.46";
    renderDevs();renderPage();}},2600);
  renderPage();
}
function simTimeout(){clearInterval(S.auth.t);S.auth.phase="timedOut";renderPage();}

/* ---------- Debug ---------- */
const LOGPOOL=[
  ["I","ArkUI","[pipeline] vsync frame scheduled"],
  ["W","ArkUI","[list_layout] measure retry, node 94"],
  ["I","RenderService","flush composition, 1 surface dirty"],
  ["W","ArkUI","[render] flush delayed 18ms"],
  ["E","AbilityMS","connect timeout, bundle=com.example.settings"],
  ["I","Hiview","cpu usage snapshot written"],
  ["W","Multimodal","touch dispatch queue depth 3"],
  ["I","WindowManager","focus window unchanged (12)"]
];
const LVORD={D:0,I:1,W:2,E:3};
function logText(){
  const q=S.lg.tag.trim().toLowerCase();
  const rows=S.lg.lines.filter(l=>LVORD[l.lv]>=LVORD[S.lg.lvl]&&(!q||l.tag.toLowerCase().includes(q)))
    .slice(-200).map(l=>"07-13 "+l.t+" "+l.lv+" "+l.tag+": "+l.m);
  return rows.join("\n")||"(当前过滤条件下没有日志)";
}
function updateLogDom(){
  const el=$("logstream");if(el){el.textContent=logText();el.scrollTop=el.scrollHeight;}
  const sc=$("shardchip");if(sc)sc.textContent="host 轮转: 片 #"+S.lg.piece+" · "+S.lg.shard.toFixed(1)+"MB/64MB · 配额 1GB";
}
function setLogTag(el){S.lg.tag=el.value;updateLogDom();}
function startLogs(){
  if(S.lg.on)return;S.lg.on=true;
  S.lg.timer=setInterval(()=>{
    const p=LOGPOOL[Math.floor(Math.random()*LOGPOOL.length)];
    S.lg.ms+=137+Math.floor(Math.random()*420);
    const sec=Math.floor(S.lg.ms/1000);
    const t="11:"+String(2+Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")+"."+String(S.lg.ms%1000).padStart(3,"0");
    S.lg.lines.push({t,lv:p[0],tag:p[1],m:p[2]});
    if(S.lg.lines.length>400)S.lg.lines.shift();
    S.lg.shard+=0.05;if(S.lg.shard>=64){S.lg.shard=0;S.lg.piece++;}
    if(S.lg.paused){S.lg.pend++;const pc=$("pendchip");if(pc)pc.textContent="界面已暂停 · "+S.lg.pend+" 行待补";}
    else if(S.nav==="debug"&&S.debugTab==="logs")updateLogDom();
  },650);

/* ---------- History ---------- */
function histDetail(h){
  const isTrace=h.what.startsWith("Trace"),isDump=h.what.includes("Dump"),isFlash=h.what.startsWith("Flash")||h.what.startsWith("安装");
  let art="";
  if(isTrace)art=`<tr><td class="mono">raw.ftrace</td><td>raw / device · size / sensitive / published</td><td class="mono">artifact.list → SHA-256</td></tr>
    <tr><td class="mono">filtered.ftrace</td><td>derived / host · size / private / published</td><td class="mono">artifact.list → SHA-256</td></tr>
    <tr><td class="mono">capture.log</td><td>log / host · size / private / published</td><td class="mono">artifact.list → SHA-256</td></tr>`;
  else if(isDump)art=`<tr><td class="mono">stdout.elementtree.txt</td><td>raw / stdout · size / sensitive / published</td><td class="mono">artifact.list → SHA-256</td></tr>
    <tr><td class="mono">sidecar.arkui.dump</td><td>raw / device · size / sensitive / published</td><td class="mono">artifact.list → SHA-256</td></tr>
    <tr><td class="mono">merged.elementtree.json</td><td>derived / host · size / private / published</td><td class="mono">artifact.list → SHA-256</td></tr>`;
  else if(isFlash)art=h.mode==="planOnly"
    ?'<tr><td class="mono">plan.json</td><td>plan / host · size / private / published</td><td class="mono">artifact.list → SHA-256</td></tr>'
    :`<tr><td class="mono">plan.json</td><td>plan / host · size / private / published</td><td class="mono">artifact.list → SHA-256</td></tr>
      <tr><td class="mono">flash.log</td><td>log / host · size / private / published</td><td class="mono">artifact.list → SHA-256</td></tr>`;
  const params=(isTrace||isDump)?`
    <h2 style="margin-top:4px">参数 before / after</h2>
    <div class="tablewrap"><table>
      <tr><th>参数</th><th>before</th><th>after</th><th></th></tr>
      <tr><td class="mono">persist.ace.trace.build.enabled</td><td class="mono">false</td><td class="mono">false</td><td><span class="chip ok">已恢复</span></td></tr>
      <tr><td class="mono">persist.rosen.animationtrace.enabled</td><td class="mono">missing</td><td class="mono">missing</td><td><span class="chip dim">未改变</span></td></tr>
    </table></div>`:"";
  return `<dl class="kv">
      <dt>状态</dt><dd>${STCHIP[h.st]||""} ${modeBadge(h.mode,h.mode==="simulated"?"fixture-a3":"")}</dd>
      <dt>executionMode</dt><dd>${h.mode}</dd>
      <dt>设备</dt><dd>${esc(h.dev)} · binding rev 3</dd>
      <dt>manifest</dt><dd class="mono">schema 1.0 · 9 steps · SHA e0a1…88f2</dd>
      ${h.st==="interrupted"?'<dt>审计</dt><dd>outcomeUnknown @ flashPartition(system) · needsAttention · 未执行补偿:restoreParam×2</dd>':""}
      ${h.st==="cancelled"?'<dt>审计</dt><dd>用户取消 @ 安全边界;补偿动作已执行,参数已恢复</dd>':""}
    </dl>
    ${params}
    <h2 style="margin-top:4px">Artifact</h2>
    <div class="tablewrap"><table><tr><th>文件</th><th>role / origin · size · privacy · status</th><th>SHA-256</th></tr>${art||'<tr><td colspan="3" class="empty">无产物(planned 会话仅含 plan artifact)</td></tr>'}</table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="doneBtn(this,'已在访达中显示(演示)')">在访达中显示</button>
      <button class="btn" onclick="exportModal('${h.id}')">导出 Artifact…</button>
    </div>`;
}
function exportModal(id){
  const h=HIST.find(x=>x.id===id);
  const artifact=h&&h.what.startsWith("Trace")?"raw.ftrace":h&&h.what.includes("Dump")?"stdout.elementtree.txt":"plan.json";
  modal(`<div class="modal" role="dialog" aria-modal="true">
    <h3>导出 Artifact</h3>
    <dl class="kv"><dt>文件</dt><dd class="mono">${artifact}</dd><dt>大小</dt><dd>选中行的 byteCount</dd><dt>privacy</dt><dd>选中行的 privacy</dd><dt>SHA-256</dt><dd class="mono">选中行的完整 SHA-256</dd></dl>
    <div class="warnbox">⚠ 这是显式敏感数据导出。确认后由 App 分块读取、复算 byteCount / SHA-256，再写入你选择的位置；目标路径不会发送给 daemon。</div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">取消</button>
      <button class="btn pri" onclick="doneBtn(this,'✓ 已导出并校验(演示)')">导出敏感 Artifact…</button></div>
  </div>`);
}
function pHistory(){
  const f=S.hf;
  const devs=["all"].concat([...new Set(HIST.map(h=>h.dev))]);
  const rows=HIST.filter(h=>(f.st==="all"||h.st===f.st)&&(f.mode==="all"||h.mode===f.mode)&&(f.dev==="all"||h.dev===f.dev));
  const sel=HIST.find(h=>h.id===S.histSel);
  return recoveryHTML()+`
  <h1>History <span class="acin">REQ-UX-004</span></h1>
  <div class="card" data-acin style="gap:8px"><span class="ac">AC-UX-004-01</span>
    <div class="filters"><span class="fl">状态</span>
      ${[["all","全部"],["succeeded","成功"],["failed","失败"],["cancelled","已取消"],["planned","planned"],["interrupted","已中断"]]
        .map(([k,l])=>`<button class="${f.st===k?"on":""}" onclick="S.hf.st='${k}';renderPage()">${l}</button>`).join("")}
    </div>
    <div class="filters"><span class="fl">模式</span>
      ${[["all","全部"],["execute","execute"],["planOnly","plan-only"],["simulated","simulated"]]
        .map(([k,l])=>`<button class="${f.mode===k?"on":""}" onclick="S.hf.mode='${k}';renderPage()">${l}</button>`).join("")}
      <span class="fl" style="margin-left:10px">设备</span>
      ${devs.map(d=>`<button class="${f.dev===d?"on":""}" onclick="S.hf.dev='${d}';renderPage()">${d==="all"?"全部":esc(d)}</button>`).join("")}
    </div>
  </div>
  <div class="two">
    <div class="card"><div class="tablewrap"><table>
      <tr><th>Session</th><th>状态</th><th>设备</th><th>内容</th><th>时间</th></tr>
      ${rows.map(h=>`<tr class="${S.histSel===h.id?"sel-row":""}" tabindex="0" role="button" style="cursor:pointer" onclick="S.histSel='${h.id}';renderPage()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();S.histSel='${h.id}';renderPage()}">
        <td class="mono">${h.id}${h.live?' <span class="livetag">本会话</span>':""}</td>
        <td>${STCHIP[h.st]||""}${h.mode!=="execute"&&h.st!=="planned"?" "+modeBadge(h.mode,""):""}</td>
        <td class="mono">${esc(h.dev)}</td><td>${esc(h.what)}</td><td class="mono">${h.when}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">无匹配项</td></tr>'}
    </table></div></div>
    <div class="card" data-acin><span class="ac">AC-UX-006-01</span>
      <h2>Session 详情</h2>
      ${sel?histDetail(sel):'<p class="empty">选择左侧 Session 查看 manifest、参数 before/after、Artifact 与审计详情。planned/simulated 标识在历史与导出中永久保留。</p>'}
    </div>
  </div>`;
}

/* ---------- Automation / bounded AI loop ---------- */
function pAutomation(){
  return recoveryHTML()+`
  <div class="two">
    <div class="card">
      <h2>Runtime tasks</h2>
      <div class="tablewrap"><table>
        <tr><th>Lifecycle</th><th>Task / goal</th><th>Round</th></tr>
        <tr class="sel-row"><td><span class="chip warn">● running</span></td><td><b class="mono">HTASK-DEMO-001</b><br><span class="hint">复现并修复设置页启动后闪退</span></td><td class="mono">#4</td></tr>
      </table></div>
      <p class="hint">列表来自 task.list；HTASK 与 Git TASK 不是同一种对象。</p>
    </div>
    <div class="card">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip warn">● running</span><b class="mono">patching</b><span class="hint">debugCrash</span></div>
      <h2>复现并修复设置页启动后闪退</h2>
      <dl class="kv">
        <dt>Task</dt><dd class="mono">HTASK-DEMO-001</dd>
        <dt>Target</dt><dd class="mono">target-dayu200</dd>
        <dt>Round / version</dt><dd class="mono">4 / 12</dd>
        <dt>Updated</dt><dd class="mono">2026-08-08T08:02:00Z</dd>
        <dt>Active Job</dt><dd class="mono">job-demo-42</dd>
      </dl>
      <h2>Allowed operations</h2>
      <div class="op-list">
        <span class="chip dim">capture.diagnostics@1</span>
        <span class="chip dim">debug.hap@1</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn pri" onclick="doneBtn(this,'已请求 Reconcile')">Reconcile</button>
        <button class="btn" onclick="doneBtn(this,'已请求 Pause')">Pause</button>
        <button class="btn danger" onclick="doneBtn(this,'已请求 Cancel')">Cancel</button>
      </div>
      <div class="warnbox">${icon("warning",true)} App 只能 list / reconcile / pause / cancel 既有 task；不能 submit、resume、提供 human resolution、修改 allowed operations 或管理 capability。</div>
    </div>
  </div>`;
}

/* ---------- Settings ---------- */
function pSettings(){
  const runningJobs=S.jobs.some(j=>j.state==="running");
  return `
  <h1>Settings</h1>
  <div class="grid2">
    <div class="card"><h2>HDC 工具</h2>
      <div class="radio">
        <label><input type="radio" name="hdc" ${S.hdcSel==="deveco"?"checked":""} onchange="S.hdcSel='deveco';renderPage()"> DevEco SDK — <span class="mono">…/toolchains/hdc · 3.1.0e</span></label>
        <label><input type="radio" name="hdc" ${S.hdcSel==="manual"?"checked":""} onchange="S.hdcSel='manual';renderPage()"> 手动选择 — <span class="mono">/usr/local/bin/hdc · 3.0.0b</span><span class="rd">(SHA-256 已计算 · 能力需重新探测)</span></label>
      </div>
      ${runningJobs?'<div class="warnbox">⚠ 有任务正在运行:切换不影响运行中的 Job——工具在 Job 创建时固化,仅新任务使用新选择。</div>'
                   :'<p class="hint">切换不影响运行中的 Job:工具在 Job 创建时固化。</p>'}
    </div>
    <div class="card"><h2>输出与保留</h2>
      <dl class="kv"><dt>输出根目录</dt><dd>~/Library/Application Support/ArkDeck</dd>
      <dt>历史配额</dt><dd>20GB · 保留 90 天 · pinned 除外</dd>
      <dt>当前占用</dt><dd>6.4GB · 42 个 Session · 3 pinned</dd></dl></div>
    <div class="card" data-acin><span class="ac">AC-DIAG-002-01</span><h2>诊断</h2>
      <p class="hint">诊断包由你主动导出,默认<b>不含</b>设备 raw 产物,导出前可预览勾选;无自动上传。</p>
      <button class="btn" style="align-self:flex-start" onclick="diagModal()">导出诊断包…</button></div>
    <div class="card"><h2>更新</h2>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" checked> 自动检查已签名更新</label>
      <p class="hint">只获取签名 feed；下载后先校验身份与完整性，明确同意后才在 Finder 中显示安装包。</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip ok">✓ 当前已是最新版本</span>
        <button class="btn" onclick="doneBtn(this,'已检查 · 当前版本')">立即检查</button></div></div>
  </div>`;
}
function diagModal(){
  modal(`<div class="modal" role="dialog" aria-modal="true">
    <h3>导出诊断包 <span class="acin">AC-DIAG-002-01</span></h3>
    <p class="hint">逐项勾选导出内容;默认不含设备 raw 产物。该包只保存到本机,无自动上传。</p>
    <div class="checks safe">
      <label><input type="checkbox" checked> ArkDeck 应用日志(近 7 天)</label>
      <label><input type="checkbox" checked> 工具链探测记录(hdc 版本/hash/endpoint)</label>
      <label><input type="checkbox" checked> 设备清单(connectKey 已脱敏)</label>
      <label><input type="checkbox"> 设备 raw 产物(默认不含,可能包含敏感内容)</label>
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">取消</button>
      <button class="btn pri" onclick="doneBtn(this,'✓ 已导出(演示):~/Downloads/arkdeck-diag-0713.zip')">导出诊断包</button></div>
  </div>`);
}

/* ---------- render ---------- */
const PAGES={overview:pOverview,auth:pAuth,dump:pDump,trace:pTrace,debug:pDebug,flash:pFlash,history:pHistory,automation:pAutomation,settings:pSettings};
function renderDevs(){
  $("devlist").innerHTML=DEVICES.map(d=>`
    <button class="dev ${S.device===d.id?"on":""}" onclick="pickDevice('${d.id}')" aria-pressed="${S.device===d.id}">
      <span class="dot ${d.state==="ready"?"ok":d.state==="unauthorized"?"warn":"off"}"></span>
      <span class="dn"><b>${esc(d.name)}</b><span>${d.state==="unauthorized"?"未授权 — 点击处理":esc(d.build)}</span></span>
      <span class="tag">${d.tp}</span>
    </button>`).join("");
}
function renderNav(){
  $("nav").innerHTML=NAV.map(([k,ic,l,badge])=>`<button class="${S.nav===k?"on":""}" onclick="go('${k}')" ${S.nav===k?'aria-current="page"':""}><span class="ic">${icon(ic)}</span>${l}${badge?`<span class="preview">${badge}</span>`:""}</button>`).join("");
}
function renderPage(){
  $("page").innerHTML=PAGES[S.nav]();
  const title=$("page").querySelector("h1");
  if(title){title.id="pageTitle";$("page").setAttribute("aria-labelledby","pageTitle");document.querySelector(".titlebar .t").textContent="ArkDeck — "+title.childNodes[0].textContent.trim();}
  const ls=$("logstream");if(ls)ls.scrollTop=ls.scrollHeight;
}
function render(){renderDevs();renderNav();renderPage();renderDrawer();}
render();
</script>
</body>
