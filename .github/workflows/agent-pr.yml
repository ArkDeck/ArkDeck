name: Agent PR

# Independent PR authorship for AI-drafted work (enforcement.md, bootstrap
# state): an agent pushes an agent/** branch with the maintainer's
# credentials, and this workflow opens the pull request as
# github-actions[bot]. GitHub forbids only the PR *author* from approving,
# so the human CODEOWNER (@lvye) can then review and approve the change.
#
# Required head checks are produced by push workflows. GitHub places
# pull_request runs caused by a GITHUB_TOKEN-created/updated PR behind a
# manual approval gate, so routine create/synchronize validation stays in
# this exact-head push run.
#
# This workflow reads no diff and no Task definition. The PR allowed-paths
# guard that used to preflight every push here was retired by CHG-2026-077:
# scope is reviewed on the real diff by the maintainer, and the `Task:` line
# below is traceability copied from the final commit subject, not a lookup.

on:
  push:
    branches:
      - "agent/**"
      - "!agent/host-loop/**"

permissions: {}

# Serialize only the short metadata writes, retaining every pending push.
concurrency:
  group: agent-pr-stacks
  queue: max
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr-number: ${{ steps.validate.outputs.pr-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0

      - name: Create or find and validate github-actions bot PR
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci/agent_pr.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$BRANCH" \
            --head-sha "$HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"
