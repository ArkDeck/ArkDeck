name: Swift CI

# CHG-2026-028 TASK-MECH-001(readiness #323 pins)。
# 授权语义不变:CI 红 = 不能合并;CI 绿 ≠ 批准(enforcement"CI 校验"节)。
# 零 secret;只读权限。覆盖边界:仅 Packages/ArkDeckKit 全量 swift test;
# ArkDeckApp 与 XCUITest 面不在本 job(见 job summary,不伪装覆盖)。
# 路径感知:diff 同时未触碰 Swift 面(Packages/**、Package.*)和本 workflow 时秒级 success;
# workflow 自身变更必须跑全量,确保新的编译/测试参数经过同一 exact-head 验证;
# diff 基准不可得时 fail closed = 跑全量(宁多跑不漏跑)。

on:
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Do not make the required Swift gate depend on marketplace action
      # metadata being available. A full fetch of the pushed ref preserves the
      # before-SHA path decision, and the read-back pins the exact tested head.
      - name: Checkout exact revision with runner Git
        env:
          ARKDECK_CI_REF: ${{ github.ref }}
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+${ARKDECK_CI_REF}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Determine Swift-relevant diff
        id: paths
        run: |
          set -eu
          BASE=""
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ]; then
            # 无可靠 diff 基准(分支新建/force 场景)→ fail closed:跑全量
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-diff-base-fail-closed" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "${{ github.sha }}" \
            | grep -qE '^(Packages/|Package\.|\.github/workflows/swift-ci\.yml$)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "reason=swift-surface-or-workflow-touched" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-swift-surface" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26.6 (repo Swift baseline)
        if: steps.paths.outputs.swift == 'true'
        run: |
          set -eu
          # readiness r2(#333)钉定:macos-26 镜像 + Xcode_26.6.app(= 仓库
          # 基线 Xcode 26.6/Swift 6.3.3;macos-15 最高 26.3/6.2.4 编译不过,
          # 两 run 实证)。fail closed:该 app 不存在即失败并列出可用项,
          # 不静默降级/升级。
          XCODE=/Applications/Xcode_26.6.app
          if [ ! -d "${XCODE}" ]; then
            echo "::error::${XCODE} not on this runner image; available Xcodes:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "${XCODE}/Contents/Developer"
          echo "Selected: ${XCODE}"

      - name: Toolchain versions
        if: steps.paths.outputs.swift == 'true'
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: swift test (ArkDeckKit full suite, 4 workers)
        if: steps.paths.outputs.swift == 'true'
        run: >-
          swift test
          --package-path Packages/ArkDeckKit
          --parallel
          --num-workers 4

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Swift CI"
            echo "- Path decision: \`${{ steps.paths.outputs.reason }}\`"
            if [ "${{ steps.paths.outputs.swift }}" = "true" ]; then
              echo "- Ran the full ArkDeckKit test suite with 4 test workers."
            else
              echo "- Skipped swift test: diff touches neither Swift surface (Packages/**, Package.*) nor this workflow."
            fi
            echo "- Coverage boundary: Packages/ArkDeckKit only. ArkDeckApp and XCUITest surfaces are NOT covered by this job."
            echo "- CI green is not approval; authorization stays with maintainer PR review (governance/enforcement.md)."
          } >> "$GITHUB_STEP_SUMMARY"
