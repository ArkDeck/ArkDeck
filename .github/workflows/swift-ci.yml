name: Swift CI

# Path-aware merge gate for the two compiled macOS surfaces.
#
# The always-present `swift` aggregator is the stable status check.  A small
# Linux planner computes the exact diff first, so docs/design-only pushes do
# not allocate a macOS runner.  Agent branches compare their cumulative head
# with the current origin/main merge base; this handles an all-zero first-push
# `before` OID without conservatively compiling unrelated docs.  Missing base
# facts fail closed by selecting both compiled lanes.
#
# ArkDeckKit keeps its full test suite as the merge gate.  SwiftPM's stable
# mirrored workspace makes a restored cache genuinely incremental across
# ephemeral checkout paths.  The App lane compiles the app and UI-test bundle
# with build-for-testing, but never launches a simulator or device.

on:
  push:
    branches: [main, "agent/**"]

permissions:
  contents: read

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.paths.outputs.swift }}
      app: ${{ steps.paths.outputs.app }}
      base: ${{ steps.paths.outputs.base }}
      reason: ${{ steps.paths.outputs.reason }}
      changed-count: ${{ steps.paths.outputs.changed-count }}
    steps:
      - name: Checkout exact revision and current main with runner Git
        env:
          ARKDECK_CI_REF: ${{ github.ref }}
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+${ARKDECK_CI_REF}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: CI planner contract tests
        run: python3 scripts/ci/test_plan.py

      - name: CI workflow contract tests
        run: python3 scripts/test_agent_pr_workflow.py

      - name: Determine compiled lanes
        id: paths
        run: >-
          python3 scripts/ci/plan.py
          --repo-root "$GITHUB_WORKSPACE"
          --event "$GITHUB_EVENT_PATH"
          --github-output "$GITHUB_OUTPUT"

      - name: Plan summary
        run: |
          {
            echo "### Compiled CI plan"
            echo "- Base: \`${{ steps.paths.outputs.base }}\`"
            echo "- Decision: \`${{ steps.paths.outputs.reason }}\`"
            echo "- Changed files: \`${{ steps.paths.outputs.changed-count }}\`"
            echo "- ArkDeckKit full tests: \`${{ steps.paths.outputs.swift }}\`"
            echo "- ArkDeck App build-for-testing: \`${{ steps.paths.outputs.app }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  swift-tests:
    needs: plan
    if: needs.plan.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI: "true"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout exact revision with runner Git
        env:
          ARKDECK_CI_REF: ${{ github.ref }}
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+${ARKDECK_CI_REF}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Exact Xcode 26.6 preflight
        run: |
          set -eu
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: SwiftPM stable-workspace contract tests
        run: python3 Packages/ArkDeckKit/Scripts/test_run_swiftpm.py

      - name: Restore trusted stable SwiftPM cache
        id: swift-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-swiftpm
          key: arkdeck-swiftpm-v2-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            arkdeck-swiftpm-v2-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-

      - name: ArkDeckKit full test suite (8 workers)
        env:
          ARKDECK_SWIFTPM_CACHE_ROOT: ${{ runner.temp }}/arkdeck-swiftpm
        run: >-
          sh Packages/ArkDeckKit/Scripts/run-swiftpm.sh
          test
          --parallel
          --num-workers 8

      - name: Save trusted stable SwiftPM cache
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.swift-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-swiftpm
          key: arkdeck-swiftpm-v2-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-${{ github.sha }}

  app-build:
    needs: plan
    if: needs.plan.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI: "true"
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout exact revision with runner Git
        env:
          ARKDECK_CI_REF: ${{ github.ref }}
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+${ARKDECK_CI_REF}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Exact Xcode 26.6 preflight
        run: |
          set -eu
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Restore trusted Xcode build cache
        id: app-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-xcode
          key: arkdeck-xcode-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('ArkDeck.xcodeproj/project.pbxproj', 'Packages/ArkDeckKit/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            arkdeck-xcode-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('ArkDeck.xcodeproj/project.pbxproj', 'Packages/ArkDeckKit/Package.swift') }}-

      - name: Build ArkDeck app and UI-test bundle
        env:
          ARKDECK_XCODE_CACHE_ROOT: ${{ runner.temp }}/arkdeck-xcode
          CLANG_MODULE_CACHE_PATH: ${{ runner.temp }}/arkdeck-xcode/ModuleCache
          SWIFTPM_MODULECACHE_OVERRIDE: ${{ runner.temp }}/arkdeck-xcode/ModuleCache
        run: >-
          xcodebuild
          -project ArkDeck.xcodeproj
          -scheme ArkDeck
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath "$ARKDECK_XCODE_CACHE_ROOT/DerivedData"
          -clonedSourcePackagesDirPath "$ARKDECK_XCODE_CACHE_ROOT/SourcePackages"
          -packageCachePath "$ARKDECK_XCODE_CACHE_ROOT/PackageCache"
          CODE_SIGNING_ALLOWED=NO
          ROCKCHIP_COMPONENT_INPUT=/usr/bin/false
          build-for-testing

      - name: Save trusted Xcode build cache
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.app-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-xcode
          key: arkdeck-xcode-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('ArkDeck.xcodeproj/project.pbxproj', 'Packages/ArkDeckKit/Package.swift') }}-${{ github.sha }}

  # Stable required-check name.  A job-level skip is a successful no-op;
  # workflow-level paths filters are intentionally absent because GitHub can
  # leave a required workflow that never started pending indefinitely.
  swift:
    if: always()
    needs: [plan, swift-tests, app-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected compiled lane
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SWIFT_SELECTED: ${{ needs.plan.outputs.swift }}
          SWIFT_RESULT: ${{ needs.swift-tests.result }}
          APP_SELECTED: ${{ needs.plan.outputs.app }}
          APP_RESULT: ${{ needs.app-build.result }}
        run: |
          set -eu
          test "$PLAN_RESULT" = success
          if [ "$SWIFT_SELECTED" = true ]; then
            test "$SWIFT_RESULT" = success
          else
            test "$SWIFT_RESULT" = skipped
          fi
          if [ "$APP_SELECTED" = true ]; then
            test "$APP_RESULT" = success
          else
            test "$APP_RESULT" = skipped
          fi

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Swift CI"
            echo "- ArkDeckKit lane selected: \`${{ needs.plan.outputs.swift }}\`; result: \`${{ needs.swift-tests.result }}\`."
            echo "- ArkDeck App lane selected: \`${{ needs.plan.outputs.app }}\`; result: \`${{ needs.app-build.result }}\`."
            echo "- ArkDeckKit changes retain the full test suite; test-only changes do not rebuild the App."
            echo "- App/UI-test/project changes compile with build-for-testing; no simulator or device test is claimed."
            echo "- Restored build caches are best-effort and only protected main writes new entries."
            echo "- A green CI result is validation evidence, not maintainer approval."
          } >> "$GITHUB_STEP_SUMMARY"
