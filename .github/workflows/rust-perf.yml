name: Performance lanes

# ArkDeckRuntimeSoakFixture carries hard gates — resident growth <= 32 MiB,
# descriptor growth <= 16, no torn journal tail, no outstanding cleanup debt —
# and design section I.1 of the cross-platform architecture already records it
# as "硬门但零调用方". This workflow is that caller.
#
# The understatement mattered. As committed the fixture never reached any of
# its gates: it aborted on its first cancelled Job, and had done so for 23 days,
# because nothing ran it. A gate with no caller is not a gate.
#
# Semantics: scheduled regression detection, NOT a merge gate, in the same
# shape as swift-slow-lanes.yml. A red run here is a signal to file a product
# defect.
#
# The measurement jobs below drive `scripts/bench`, which starts its own daemon
# on a private state directory. Nothing here contacts a device, and a host
# result is never platform or hardware evidence (POL-VERIFY-001, POL-MODE-001).

on:
  schedule:
    # 17:00 UTC nightly, an hour ahead of swift-slow-lanes.yml, so the two
    # load-sensitive lanes never share a runner.
    - cron: "0 17 * * *"
    # 03:00 UTC Sunday for the long soak.
    - cron: "0 3 * * 0"
  push:
    # Push-triggered like swift-ci.yml, not pull_request-triggered. The Agent PR
    # workflow opens pull requests with GITHUB_TOKEN, and a pull_request run on
    # such a PR sits in action_required until a maintainer approves it by hand
    # (#1716: the opening run waited 55 minutes for that click; #1723 waited the
    # same way). A push to agent/** arrives through the deploy key, is
    # attributed to its owner, and runs at once.
    branches:
      - main
      - "agent/**"
    # The executables measured below are the Swift daemon and the soak fixture,
    # so their sources and build inputs must open this lane too. A filter that
    # watched only the harness let a Runtime, Storage or Workflows change skip
    # its own performance check.
    paths:
      - "scripts/bench/**"
      - "rust/**"
      - ".github/workflows/rust-perf.yml"
      - "Packages/ArkDeckKit/Sources/**"
      - "Packages/ArkDeckKit/Package.swift"
      - "Packages/ArkDeckKit/Package.resolved"
      - "Packages/ArkDeckKit/Scripts/run-swiftpm.sh"
      - "Packages/ArkDeckKit/Tests/ArkDeckRuntimeSoakFixture/**"
  workflow_dispatch:
    inputs:
      soak-hours:
        description: >-
          Soak duration in hours. A GitHub-hosted job is capped at six hours, so
          the design's 24-hour weekly soak needs a long-lived runner; the hosted
          lane runs a bounded soak instead.
        required: false
        default: "4"

permissions:
  contents: read

concurrency:
  group: rust-perf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-tests:
    # Percentile maths, the stability verdict, the resident-set split, the
    # threshold comparison and the redaction gate: no build, no daemon.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout default branch with runner Git
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Baseline harness unit tests
        working-directory: scripts
        run: python3 -m unittest discover -s bench -t .

  microbenchmarks:
    # The pre-merge lane, run on every push to an agent branch and on main.
    # Ratio mode against the calibration workload measured in the same run,
    # +20% per design section I.2: a runner that is uniformly slower moves both
    # numbers and reads as no change.
    if: github.event_name == 'push'
    needs: harness-tests
    runs-on: macos-26
    # Measured locally (warm build, release): three runs at the reduced PR
    # sample counts take about two minutes. 40 minutes covers a cold build.
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout default branch with runner Git
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Configure read-only ArkForge package access
        env:
          ARKFORGE_DEPLOY_KEY: ${{ secrets.ARKFORGE_DEPLOY_KEY }}
        run: sh scripts/ci/arkforge-package-auth.sh setup
      - name: Restore the release SwiftPM cache
        # Same shape as swift-ci.yml's trusted stable cache, under its own key:
        # this lane builds release objects, the test lane builds debug ones,
        # and neither should carry the other's. Restore-only off main; a cold
        # build here was 9 to 11 of the job's 11 to 13 minutes.
        id: perf-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-swiftpm
          key: arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-
            arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Build the measured executables
        # Every run-swiftpm.sh call, the --show-bin-path lookup included, must
        # see the cache root the restore populated. Step level, because the
        # runner context is not available in a job-level env.
        env:
          ARKDECK_SWIFTPM_CACHE_ROOT: ${{ runner.temp }}/arkdeck-swiftpm
        run: |
          set -eu
          sh Packages/ArkDeckKit/Scripts/run-swiftpm.sh build -c release \
            --product arkdeck-agentd
          sh Packages/ArkDeckKit/Scripts/run-swiftpm.sh build -c release \
            --product ArkDeckRuntimeSoakFixture
      - name: Remove ArkForge package credential
        if: always()
        run: sh scripts/ci/arkforge-package-auth.sh cleanup
      - name: Save the release SwiftPM cache
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.perf-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-swiftpm
          key: arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-${{ github.sha }}
      - name: Capture a candidate baseline
        # Every run-swiftpm.sh call, the --show-bin-path lookup included, must
        # see the cache root the restore populated. Step level, because the
        # runner context is not available in a job-level env.
        env:
          ARKDECK_SWIFTPM_CACHE_ROOT: ${{ runner.temp }}/arkdeck-swiftpm
        run: |
          set -eu
          BIN="$(sh Packages/ArkDeckKit/Scripts/run-swiftpm.sh build -c release \
            --show-bin-path | tail -1)"
          cd scripts
          # A shared CI runner is never provably quiet, so the document records
          # itself as advisory rather than claiming baseline eligibility.
          # Sample counts are reduced; the seed parameters are not. They are
          # the workload scale the committed baseline was taken at, and
          # `compare` refuses a candidate measured at another scale.
          python3 -m bench capture \
            --daemon "$BIN/arkdeck-agentd" \
            --soak "$BIN/ArkDeckRuntimeSoakFixture" \
            --build-configuration release \
            --out-dir "$RUNNER_TEMP/perf" \
            --runs 3 --cold-start-samples 10 --ipc-samples 200 \
            --idle-seconds 20 --calibration-samples 100 \
            --allow-loaded-host
      - name: Compare against the committed baseline (ratio, +20%)
        # `pipefail` matters here: without it the exit status of the pipeline is
        # `tee`'s, and a reported regression would leave the step green. The
        # first run of this lane did exactly that.
        run: |
          set -euo pipefail
          cd scripts
          CANDIDATE="$(ls "$RUNNER_TEMP"/perf/perf-baseline-*.json | tail -1)"
          COMMITTED="$(ls bench/baselines/perf-baseline-*.json | tail -1)"
          python3 -m bench compare \
            --committed "$COMMITTED" --candidate "$CANDIDATE" \
            --mode ratio --threshold 0.20 \
            --on-host-mismatch skip \
            | tee -a "$GITHUB_STEP_SUMMARY"

  nightly:
    # The nightly lane: the first archived percentile measurement this
    # repository has had, plus a tighter +10% ratio comparison on its own
    # runner.
    #
    # Neither this lane nor the PR lane compares across machines. Design
    # section I.2 pins the budgets to a named reference host, and a
    # GitHub-hosted runner is not that host: absolute values obviously do not
    # transfer, and a ratio against a CPU-bound calibration does not either,
    # because IPC latency is dominated by scheduling rather than CPU. So
    # `bench compare` refuses a cross-host comparison, and these lanes pass
    # `--on-host-mismatch skip`, which archives the measurement and reports
    # that it did not gate. They start gating as soon as a baseline for the
    # runner's own host is committed; that is an open gap in the SPK-1 report.
    if: github.event_name == 'schedule' && github.event.schedule == '0 17 * * *'
    needs: harness-tests
    runs-on: macos-26
    # Measured locally (warm build, release): three runs at full sample counts
    # take about nine minutes, most of it the 120 s resource window per run.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout default branch with runner Git
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Configure read-only ArkForge package access
        env:
          ARKFORGE_DEPLOY_KEY: ${{ secrets.ARKFORGE_DEPLOY_KEY }}
        run: sh scripts/ci/arkforge-package-auth.sh setup
      - name: Restore the release SwiftPM cache
        # Same shape as swift-ci.yml's trusted stable cache, under its own key:
        # this lane builds release objects, the test lane builds debug ones,
        # and neither should carry the other's. Restore-only off main; a cold
        # build here was 9 to 11 of the job's 11 to 13 minutes.
        id: perf-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-swiftpm
          key: arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-
            arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Build the measured executables
        # Every run-swiftpm.sh call, the --show-bin-path lookup included, must
        # see the cache root the restore populated. Step level, because the
        # runner context is not available in a job-level env.
        env:
          ARKDECK_SWIFTPM_CACHE_ROOT: ${{ runner.temp }}/arkdeck-swiftpm
        run: |
          set -eu
          sh Packages/ArkDeckKit/Scripts/run-swiftpm.sh build -c release \
            --product arkdeck-agentd
          sh Packages/ArkDeckKit/Scripts/run-swiftpm.sh build -c release \
            --product ArkDeckRuntimeSoakFixture
      - name: Remove ArkForge package credential
        if: always()
        run: sh scripts/ci/arkforge-package-auth.sh cleanup
      - name: Save the release SwiftPM cache
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.perf-build-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-swiftpm
          key: arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-${{ github.sha }}
      - name: Capture a candidate baseline
        # Every run-swiftpm.sh call, the --show-bin-path lookup included, must
        # see the cache root the restore populated. Step level, because the
        # runner context is not available in a job-level env.
        env:
          ARKDECK_SWIFTPM_CACHE_ROOT: ${{ runner.temp }}/arkdeck-swiftpm
        run: |
          set -eu
          BIN="$(sh Packages/ArkDeckKit/Scripts/run-swiftpm.sh build -c release \
            --show-bin-path | tail -1)"
          cd scripts
          # A shared CI runner is never provably quiet, so the document records
          # itself as advisory rather than claiming baseline eligibility.
          python3 -m bench capture \
            --daemon "$BIN/arkdeck-agentd" \
            --soak "$BIN/ArkDeckRuntimeSoakFixture" \
            --build-configuration release \
            --out-dir "$RUNNER_TEMP/perf" \
            --allow-loaded-host
      - name: Archive the measurement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: perf-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/perf/perf-baseline-*.json
          if-no-files-found: error
          retention-days: 90
      - name: Compare against the committed baseline (ratio, +10%)
        # See the PR lane: `pipefail` is what makes a reported regression fail
        # the step rather than being swallowed by `tee`.
        run: |
          set -euo pipefail
          cd scripts
          CANDIDATE="$(ls "$RUNNER_TEMP"/perf/perf-baseline-*.json | tail -1)"
          COMMITTED="$(ls bench/baselines/perf-baseline-*.json | tail -1)"
          python3 -m bench compare \
            --committed "$COMMITTED" --candidate "$CANDIDATE" \
            --mode ratio --threshold 0.10 \
            --on-host-mismatch skip \
            | tee -a "$GITHUB_STEP_SUMMARY"

  soak:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
      || github.event_name == 'workflow_dispatch'
    needs: harness-tests
    runs-on: macos-26
    # A GitHub-hosted job is capped at six hours, so the design's 24-hour
    # weekly soak cannot run here. Four hours plus a cold build fits with the
    # margin the slow lanes use; the full 24-hour figure is recorded as an open
    # gap in the SPK-1 report.
    timeout-minutes: 330
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout default branch with runner Git
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Configure read-only ArkForge package access
        env:
          ARKFORGE_DEPLOY_KEY: ${{ secrets.ARKFORGE_DEPLOY_KEY }}
        run: sh scripts/ci/arkforge-package-auth.sh setup
      - name: Restore the release SwiftPM cache
        # Restore only: this job builds one product and must not publish a
        # partial cache the other lanes would then prefer as the newest.
        id: perf-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-swiftpm
          key: arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('Packages/ArkDeckKit/Package.swift') }}-
            arkdeck-swiftpm-perf-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-
      - name: Build the soak fixture
        # Every run-swiftpm.sh call, the --show-bin-path lookup included, must
        # see the cache root the restore populated. Step level, because the
        # runner context is not available in a job-level env.
        env:
          ARKDECK_SWIFTPM_CACHE_ROOT: ${{ runner.temp }}/arkdeck-swiftpm
        run: |
          set -eu
          sh Packages/ArkDeckKit/Scripts/run-swiftpm.sh build -c release \
            --product ArkDeckRuntimeSoakFixture
      - name: Remove ArkForge package credential
        if: always()
        run: sh scripts/ci/arkforge-package-auth.sh cleanup
      # The state directory is chosen in its own step so that the archive below
      # can address it without depending on anything in the soak step having
      # run to completion. The fixture persists its metrics after every cycle
      # and only then enforces its resident-set and descriptor gates
      # (`main.swift` persistMetrics -> verifySteadyStateResources), so the
      # document exists precisely when a gate fails — and, on a four-hour soak,
      # also when the job's own timeout kills the step mid-run. Copying the file
      # at the end of the soak step would lose it on both of those paths.
      - name: Prepare the soak state directory
        run: |
          set -eu
          # <state-dir>/d/agentd.sock must fit Darwin's 104-byte sun_path, so
          # the directory has to be short; the fixture says so in its own
          # start-up error.
          echo "SOAK_STATE=$(mktemp -d /tmp/adksoak.XXXX)" >> "$GITHUB_ENV"
      - name: Run the Runtime soak
        env:
          SOAK_HOURS: ${{ github.event.inputs.soak-hours || '4' }}
          # The --show-bin-path lookup must see the cache root the restore
          # populated; the runner context is step-level only.
          ARKDECK_SWIFTPM_CACHE_ROOT: ${{ runner.temp }}/arkdeck-swiftpm
        run: |
          set -eu
          BIN="$(sh Packages/ArkDeckKit/Scripts/run-swiftpm.sh build -c release \
            --show-bin-path | tail -1)"
          echo "soak hours: $SOAK_HOURS"
          "$BIN/ArkDeckRuntimeSoakFixture" \
            --state-directory "$SOAK_STATE" \
            --duration-seconds "$((SOAK_HOURS * 3600))" \
            --restart-interval-seconds 300 \
            --jobs-per-cycle 10
      - name: Archive the soak metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: runtime-soak-${{ github.run_id }}
          path: ${{ env.SOAK_STATE }}/runtime-soak-metrics.json
          if-no-files-found: warn
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          {
            echo "Runtime soak: production engine, SQLite repository, durable"
            echo "journals and Artifact store driven through a simulated"
            echo "provider that opens no device transport and spawns no child"
            echo "process. Not hardware evidence (POL-MODE-001)."
            echo ""
            echo "Gates enforced by the fixture: resident growth <= 32 MiB,"
            echo "open-descriptor growth <= 16, no torn journal tail, no"
            echo "outstanding cleanup debt, every Job terminal."
            echo ""
            echo "Red here = file a product defect; this job is not a merge gate."
          } >> "$GITHUB_STEP_SUMMARY"
