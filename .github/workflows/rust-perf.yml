name: Performance lanes

# arkdeck-soak carries hard gates — resident growth <= 32 MiB,
# descriptor growth <= 16, no torn journal tail, no outstanding cleanup debt —
# and design section I.1 of the cross-platform architecture already records it
# as "硬门但零调用方". This workflow is that caller.
#
# The understatement mattered. As committed the fixture never reached any of
# its gates: it aborted on its first cancelled Job, and had done so for 23 days,
# because nothing ran it. A gate with no caller is not a gate.
#
# Semantics: scheduled regression detection, NOT a merge gate, in the same
# shape as swift-slow-lanes.yml. A red run here is a signal to file a product
# defect.
#
# The measurement jobs below drive `scripts/bench`, which starts its own daemon
# on a private state directory. Nothing here contacts a device, and a host
# result is never platform or hardware evidence (POL-VERIFY-001, POL-MODE-001).
#
# Nothing here measures a push. The `microbenchmarks` job did, on every push to
# main (and to agent branches before #1877), and compared the result with the
# committed reference-host baseline under `--on-host-mismatch skip`. A hosted
# runner is never that host, so the job could not gate: 202 of its 205 runs,
# 2026-09-04 to 2026-09-14, printed "skipped: no committed baseline for this
# host" (cpuCount 8 against the runner's 3), the other three were its first
# pull_request runs before the comparator repair of #1723, and it uploaded
# nothing. It still held one of the five macOS jobs a Free plan runs at once
# for about three minutes per merge. The nightly job takes the same measurement
# at full sample counts and archives it; a per-merge lane belongs on a runner
# whose own baseline is committed.

on:
  schedule:
    # 17:00 UTC nightly, an hour ahead of swift-slow-lanes.yml, so the two
    # load-sensitive lanes never share a runner.
    - cron: "0 17 * * *"
    # 03:00 UTC Sunday for the long soak.
    - cron: "0 3 * * 0"
  push:
    # Push-triggered like swift-ci.yml, not pull_request-triggered. The Agent PR
    # workflow opens pull requests with GITHUB_TOKEN, and a pull_request run on
    # such a PR sits in action_required until a maintainer approves it by hand
    # (#1716: the opening run waited 55 minutes for that click; #1723 waited the
    # same way). A push to agent/** arrives through the deploy key, is
    # attributed to its owner, and runs at once.
    branches:
      - main
      - "agent/**"
    # A push runs only the harness unit tests, so only the harness and this
    # workflow open the lane. The measured executables are measured nightly.
    paths:
      - "scripts/bench/**"
      - ".github/workflows/rust-perf.yml"
  workflow_dispatch:
    inputs:
      soak-hours:
        description: >-
          Soak duration in hours. A GitHub-hosted job is capped at six hours, so
          the design's 24-hour weekly soak needs a long-lived runner; the hosted
          lane runs a bounded soak instead.
        required: false
        default: "4"

permissions:
  contents: read

concurrency:
  group: rust-perf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harness-tests:
    # Percentile maths, the stability verdict, the resident-set split, the
    # threshold comparison and the redaction gate: no build, no daemon. Pure
    # Python with the one Darwin clock assertion skipping itself elsewhere,
    # so it runs on Linux and leaves the five concurrent macOS slots a Free
    # plan has to the lanes that need Xcode.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch with runner Git
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Baseline harness unit tests
        working-directory: scripts
        run: python3 -m unittest discover -s bench -t .

  nightly:
    # The first archived percentile measurement this repository has had, plus
    # a +10% ratio comparison on its own runner.
    #
    # It does not compare across machines. Design section I.2 pins the budgets
    # to a named reference host, and a GitHub-hosted runner is not that host:
    # absolute values obviously do not transfer, and a ratio against a
    # CPU-bound calibration does not either, because IPC latency is dominated
    # by scheduling rather than CPU. So `bench compare` refuses a cross-host
    # comparison, and this lane passes `--on-host-mismatch skip`, which
    # archives the measurement and reports that it did not gate. It starts
    # gating as soon as a baseline for the runner's own host is committed;
    # that is an open gap in the SPK-1 report.
    if: github.event_name == 'schedule' && github.event.schedule == '0 17 * * *'
    needs: harness-tests
    runs-on: macos-26
    # Measured locally (warm build, release): three runs at full sample counts
    # take about nine minutes, most of it the 120 s resource window per run.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout default branch with runner Git
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Activate the workspace Rust toolchain
        working-directory: rust
        run: |
          set -eu
          rustup toolchain install --profile minimal --no-self-update
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Build the Rust measurement executables
        working-directory: rust
        run: cargo build --locked --release -p arkdeck-agentd -p arkdeck-soak
      - name: Capture a candidate baseline
        run: |
          set -eu
          BIN="$GITHUB_WORKSPACE/rust/target/release"
          cd scripts
          # A shared CI runner is never provably quiet, so the document records
          # itself as advisory rather than claiming baseline eligibility.
          python3 -m bench capture \
            --daemon "$BIN/arkdeck-agentd" \
            --soak "$BIN/arkdeck-soak" \
            --runtime-kind rust \
            --build-configuration release \
            --out-dir "$RUNNER_TEMP/perf" \
            --allow-loaded-host
      - name: Archive the measurement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: perf-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/perf/perf-baseline-*.json
          if-no-files-found: error
          retention-days: 90
      - name: Compare against the committed baseline (ratio, +10%)
        # `pipefail` matters here: without it the exit status of the pipeline
        # is `tee`'s, and a reported regression would leave the step green. The
        # first run of the retired per-push lane did exactly that.
        run: |
          set -euo pipefail
          cd scripts
          CANDIDATE="$(ls "$RUNNER_TEMP"/perf/perf-baseline-*.json | tail -1)"
          COMMITTED="$(ls bench/baselines/perf-baseline-*.json | tail -1)"
          python3 -m bench compare \
            --committed "$COMMITTED" --candidate "$CANDIDATE" \
            --mode ratio --threshold 0.10 \
            --on-host-mismatch skip \
            | tee -a "$GITHUB_STEP_SUMMARY"

  soak:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
      || github.event_name == 'workflow_dispatch'
    needs: harness-tests
    runs-on: macos-26
    # A GitHub-hosted job is capped at six hours, so the design's 24-hour
    # weekly soak cannot run here. Four hours plus a cold build fits with the
    # margin the slow lanes use; the full 24-hour figure is recorded as an open
    # gap in the SPK-1 report.
    timeout-minutes: 330
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout default branch with runner Git
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Activate the workspace Rust toolchain
        working-directory: rust
        run: |
          set -eu
          rustup toolchain install --profile minimal --no-self-update
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Build the Rust measurement executables
        working-directory: rust
        run: cargo build --locked --release -p arkdeck-agentd -p arkdeck-soak
      # The state directory is chosen in its own step so that the archive below
      # can address it without depending on anything in the soak step having
      # run to completion. The fixture persists its metrics after every cycle
      # and only then enforces its resident-set and descriptor gates
      # (persist_metrics -> verify_resources), so the
      # document exists precisely when a gate fails — and, on a four-hour soak,
      # also when the job's own timeout kills the step mid-run. Copying the file
      # at the end of the soak step would lose it on both of those paths.
      - name: Prepare the soak state directory
        run: |
          set -eu
          # Use a fresh private root, independent of the installed Runtime.
          echo "SOAK_STATE=$(mktemp -d /tmp/adksoak.XXXX)" >> "$GITHUB_ENV"
      - name: Run the Runtime soak
        env:
          SOAK_HOURS: ${{ github.event.inputs.soak-hours || '4' }}
        run: |
          set -eu
          BIN="$GITHUB_WORKSPACE/rust/target/release"
          echo "soak hours: $SOAK_HOURS"
          "$BIN/arkdeck-soak" \
            --state-directory "$SOAK_STATE" \
            --duration-seconds "$((SOAK_HOURS * 3600))" \
            --restart-interval-seconds 300 \
            --jobs-per-cycle 10
      - name: Archive the soak metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: runtime-soak-${{ github.run_id }}
          path: ${{ env.SOAK_STATE }}/runtime-soak-metrics.json
          if-no-files-found: warn
          retention-days: 90
      - name: Summary
        if: always()
        run: |
          {
            echo "Runtime soak: production engine, SQLite repository, durable"
            echo "journals and Artifact store driven through a simulated"
            echo "provider that opens no device transport and spawns no child"
            echo "process. Not hardware evidence (POL-MODE-001)."
            echo ""
            echo "Gates enforced by the fixture: resident growth <= 32 MiB,"
            echo "open-descriptor growth <= 16, no torn journal tail, no"
            echo "outstanding cleanup debt, every Job terminal."
            echo ""
            echo "Red here = file a product defect; this job is not a merge gate."
          } >> "$GITHUB_STEP_SUMMARY"
