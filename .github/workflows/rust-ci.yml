name: Rust CI

# Called only by the shared planner. Its result is required by the existing
# swift aggregate, so a Rust failure cannot leave branch protection green.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  workspace:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact revision with runner Git
        working-directory: .
        env:
          ARKDECK_CI_REF: ${{ github.ref }}
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          # Contract/corpus digests are over repository bytes on every host.
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+${ARKDECK_CI_REF}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Set up Python for contract validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.14"

      - name: Install pinned contract validation dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0

      - name: Activate workspace toolchain and required components
        run: |
          set -eu
          rustup toolchain install --profile minimal --component rustfmt,clippy --no-self-update
          rustup show active-toolchain
          rustc --version
          cargo --version

      # The manifest and bindings describe this checkout; a regeneration must
      # reproduce them byte for byte. No other commit is consulted.
      - name: Verify generated contract inputs match the checkout
        working-directory: .
        run: python rust/scripts/generate-contract.py --check

      - name: Format check
        run: cargo fmt --all --check

      - name: Fetch the locked dependency graph for all host platforms
        run: cargo fetch --locked

      # The contract steps around these regenerate from the checkout or build
      # their own source views under rust/target. These two steps are the only
      # ones that compile and run the checkout itself, so without them a red
      # workspace reaches main behind a green lane.
      - name: Lint the workspace, its tests and its examples
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Wrapped: two `corpus_parity` cases assert the checkout equals its
      # committed manifest. The wrapper names an edited-but-not-regenerated
      # input with the regenerate command before the tests run; it never
      # compares the checkout with origin/main, so a merge elsewhere cannot
      # turn this branch red. Published-versus-candidate parity is
      # check-contracts.py below, whose published inputs come from the
      # merge-base with main.
      - name: Workspace tests
        working-directory: .
        run: python rust/scripts/workspace-tests.py

      - name: Contract isolation and provenance regression tests
        working-directory: .
        run: python rust/scripts/test_contract_checks.py

      - name: Published consumer and candidate contract parity
        working-directory: .
        run: python rust/scripts/check-contracts.py

      # cargo-deny and cargo-vet are the policy checkers, not the workspace,
      # and compiling them from source on every run was the Swift CI critical
      # path from the day this lane arrived (#1768): medians over the hosted
      # runs of #1827..#1846 were 7.5 of the Windows job's 11.7 minutes, 4.8
      # of macOS's 7.4 and 3.7 of Linux's 5.3. The cache below memoizes the
      # output of the two `--locked` installs and nothing else: the key names
      # both pinned versions and the pinned toolchain, there is no prefix
      # fallback, only protected main writes entries (the Swift caches' trust
      # rule), and the version read-back fails closed before either policy
      # check can run against a binary that is not the pinned one.
      - name: Restore pinned dependency policy tools
        id: policy-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: |
            ~/.cargo/bin/cargo-deny*
            ~/.cargo/bin/cargo-vet*
          key: arkdeck-cargo-policy-tools-v1-${{ runner.os }}-${{ runner.arch }}-cargo-deny-0.20.2-cargo-vet-0.10.2-${{ hashFiles('rust/rust-toolchain.toml') }}

      - name: Install pinned dependency policy tools
        if: steps.policy-tools.outputs.cache-hit != 'true'
        run: |
          set -eu
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.10.2 cargo-vet

      - name: Require the pinned dependency policy tool versions
        run: |
          set -eu
          cargo deny --version
          cargo vet --version
          test "$(cargo deny --version | tr -d '\r')" = "cargo-deny 0.20.2"
          test "$(cargo vet --version | tr -d '\r')" = "cargo-vet 0.10.2"

      - name: Save pinned dependency policy tools
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.policy-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: |
            ~/.cargo/bin/cargo-deny*
            ~/.cargo/bin/cargo-vet*
          key: arkdeck-cargo-policy-tools-v1-${{ runner.os }}-${{ runner.arch }}-cargo-deny-0.20.2-cargo-vet-0.10.2-${{ hashFiles('rust/rust-toolchain.toml') }}

      - name: Dependency source, license, ban and advisory policy
        run: cargo deny --locked check

      - name: Require the committed dependency audits
        run: cargo vet --locked --no-registry-suggestions

      - name: Verify checks left locked inputs unchanged
        run: git diff --exit-code -- Cargo.lock supply-chain

      - name: Preserve actual read-only recordings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: rust-readonly-recordings-${{ matrix.os }}
          path: rust/target/readonly-check/
          if-no-files-found: warn
          retention-days: 7
