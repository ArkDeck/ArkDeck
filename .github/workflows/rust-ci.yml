name: Rust CI

# Called only by the shared planner. Its result is required by the existing
# swift aggregate, so a Rust failure cannot leave branch protection green.
#
# ArkForge's crates come from its private repository at the revision
# rust/Cargo.toml pins, so each job's locked fetch needs the read-only deploy
# key. The caller passes that one secret and nothing else; it
# reaches only the fetch steps, which build and run nothing, and the key is
# removed before any later step runs checked-out code
# (scripts/ci/arkforge-cargo-fetch.sh).
on:
  workflow_call:
    secrets:
      ARKFORGE_DEPLOY_KEY:
        required: true

permissions:
  contents: read
  actions: read

# Three jobs, all required through this workflow's result. `policy` runs once
# the checks whose answer cannot depend on the host: the generated-input and
# format checks compare repository bytes (autocrlf is off everywhere), the
# checker's regression tests mock every native stage, cargo-deny resolves the
# graph for every target (deny.toml names none) and cargo-vet audits the whole
# lockfile. Over the 1,000 Swift CI runs of 2026-08-22..09-14 none of them
# failed on one host alone (the generated inputs failed on all three hosts at
# once in 2 runs, the audits in 2), while repeating them cost the Windows job
# 1.4 and the macOS job 0.6 of their minutes, and the macOS job is the critical
# path of Swift CI. `workspace` and `contracts` keep on every host what can
# differ between hosts: `workspace` lints and tests the checkout, `contracts`
# builds and checks the published/candidate contract views, both of which
# re-verify the generated inputs before they build. The two used to be
# consecutive steps of one job; the views never read the workspace job's
# products (each builds an isolated source view in its own Cargo target), so
# they run side by side and the macOS critical path is the longer of the two,
# not their sum. On #2311 (run 36440456252), which changed the contract
# inputs, the macOS job spent 12.2 minutes in the workspace tests and then
# 27.6 in the parity step, 43.6 of its 50 minutes.
jobs:
  policy:
    name: Rust host-independent checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact revision with runner Git
        working-directory: .
        env:
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          # Contract/corpus digests are over repository bytes on every host.
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+${ARKDECK_CI_SHA}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Set up Python for contract validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.14"

      - name: Install pinned contract validation dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0

      - name: Activate workspace toolchain and required components
        run: |
          set -eu
          rustup toolchain install --profile minimal --component rustfmt,clippy --no-self-update
          rustup show active-toolchain
          rustc --version
          cargo --version

      # The manifest and bindings describe this checkout; a regeneration must
      # reproduce them byte for byte. No other commit is consulted.
      - name: Verify generated contract inputs match the checkout
        working-directory: .
        run: python rust/scripts/generate-contract.py --check

      - name: Format check
        run: cargo fmt --all --check

      - name: Fetch the locked dependency graph for all host platforms
        env:
          ARKFORGE_DEPLOY_KEY: ${{ secrets.ARKFORGE_DEPLOY_KEY }}
        run: sh ../scripts/ci/arkforge-cargo-fetch.sh

      - name: Contract isolation and provenance regression tests
        working-directory: .
        run: python rust/scripts/test_contract_checks.py

      - name: Rust CI cache and test scheduling regression tests
        working-directory: .
        run: python rust/scripts/test_ci_execution.py

      # One ArkForge revision: every ArkForge crate, locked, at the one
      # revision rust/Cargo.toml pins (the Swift SDK pin was deleted with the
      # Swift Runtime), and ArkForge's own wire and StepPermit vectors must
      # still hold at it (from the checkout the fetch above cached).
      - name: One ArkForge revision, and its published vectors
        working-directory: .
        run: python rust/scripts/check-arkforge-pin.py --run-vectors

      # The small exact-version cache is the fast path. A pinned upstream
      # cargo-deny binary and a successful-main cargo-vet artifact avoid
      # recompiling the tools when large workspace caches evict that entry.
      - name: Restore pinned dependency policy tools
        id: policy-tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: |
            ~/.cargo/bin/cargo-deny*
            ~/.cargo/bin/cargo-vet*
          key: arkdeck-cargo-policy-tools-v1-${{ runner.os }}-${{ runner.arch }}-cargo-deny-0.20.2-cargo-vet-0.10.2-${{ hashFiles('rust/rust-toolchain.toml') }}

      - name: Install pinned dependency policy tools
        id: policy-install
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          ARKDECK_POLICY_ARTIFACT_DIR: ${{ runner.temp }}/rust-policy-tools
        run: python rust/scripts/ci-policy-tools.py

      - name: Require the pinned dependency policy tool versions
        run: |
          set -eu
          cargo deny --version
          cargo vet --version
          test "$(cargo deny --version | tr -d '\r')" = "cargo-deny 0.20.2"
          test "$(cargo vet --version | tr -d '\r')" = "cargo-vet 0.10.2"

      - name: Save pinned dependency policy tools
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.policy-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: |
            ~/.cargo/bin/cargo-deny*
            ~/.cargo/bin/cargo-vet*
          key: arkdeck-cargo-policy-tools-v1-${{ runner.os }}-${{ runner.arch }}-cargo-deny-0.20.2-cargo-vet-0.10.2-${{ hashFiles('rust/rust-toolchain.toml') }}

      - name: Dependency source, license, ban and advisory policy
        run: cargo deny --locked check

      - name: Require the committed dependency audits
        run: cargo vet --locked --no-registry-suggestions

      - name: Verify checks left locked inputs unchanged
        run: git diff --exit-code -- Cargo.lock supply-chain

      - name: Preserve trusted cargo-vet binary independently of cache eviction
        if: success() && github.ref == 'refs/heads/main' && steps.policy-install.outputs.publish-vet == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: cargo-vet-linux-x64-0.10.2-v1
          path: ${{ runner.temp }}/rust-policy-tools/
          if-no-files-found: error
          retention-days: 30

  workspace:
    name: Rust workspace (${{ matrix.os }})
    # Reject inexpensive policy failures before allocating three native hosts.
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    runs-on: ${{ matrix.os }}
    # On macOS the workspace tests take about 8 to 12 minutes, against 1 to
    # 1.6 on the other hosts (#2311, run 36440456252: 12.2 on macOS). The
    # 50-minute bound predates moving the contract views to their own job and
    # stays until cold-cache runs of this job alone have been measured; the
    # other hosts keep 30, which still stops a hung job early. GitHub names
    # its macOS images after the Xcode major they carry (xcode-27 runs macOS
    # 27), so the check is on that prefix and a newer image keeps the longer
    # bound.
    timeout-minutes: ${{ startsWith(matrix.os, 'xcode') && 50 || 30 }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      # Compiler incremental state is scratch in CI: each target is compiled
      # once per job and `compact` deletes debug/incremental before a save, so
      # no job ever reads another's. Writing it cost 1.4 to 1.6 GB per Windows
      # workspace job (4.0 GB on macOS) on 2026-09-30. Same sources, profile
      # and tests; the value is part of the cache key (ci-workspace.py).
      CARGO_INCREMENTAL: "0"
      ARKDECK_RUST_TEST_WORKERS: ${{ startsWith(matrix.os, 'xcode') && '2' || '1' }}
    steps:
      - name: Checkout exact revision with runner Git
        working-directory: .
        env:
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          # Contract/corpus digests are over repository bytes on every host.
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+${ARKDECK_CI_SHA}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Set up Python for contract validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.14"

      - name: Install pinned contract validation dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0

      - name: Activate workspace toolchain and required components
        run: |
          set -eu
          rustup toolchain install --profile minimal --component rustfmt,clippy --no-self-update
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Fetch the locked dependency graph for all host platforms
        env:
          ARKFORGE_DEPLOY_KEY: ${{ secrets.ARKFORGE_DEPLOY_KEY }}
        run: sh ../scripts/ci/arkforge-cargo-fetch.sh

      # Cargo fingerprints include source mtimes and absolute paths. Restore
      # both the stable source mirror and its products, then synchronize exact
      # checkout bytes without retimestamping unchanged files. Protected main
      # restores only an entry whose toolchain, image, build flags and
      # dependency manifests all match, so what it saves never carries another
      # manifest set's products. A run off main, which never saves, may then
      # fall back to main's newest entry for the same host, image, toolchain,
      # flags and cache root whatever the manifests; Cargo's fingerprints
      # rebuild what differs. On 2026-09-30, 30 of 34 Windows workspace misses
      # were manifest sets main had never saved, and a miss cost the macOS
      # workspace job, the Swift CI critical path, about 4 minutes (TASK-XPA-002
      # windows-ci-speed-analysis-20260930.md).
      # The cache root is part of the key, so this job's products and the
      # contract views' (under the `contracts` job's own root) are separate
      # entries; neither job restores, carries or saves the other's.
      - name: Configure task-owned Rust CI paths
        run: |
          echo "ARKDECK_RUST_CACHE_ROOT=$RUNNER_TEMP/arkdeck-rust-workspace" >> "$GITHUB_ENV"
          echo "ARKDECK_RUST_TEST_REPORT_DIR=$RUNNER_TEMP/rust-test-timings" >> "$GITHUB_ENV"

      - name: Identify compatible Rust build products
        id: rust-cache-key
        working-directory: .
        run: python rust/scripts/ci-workspace.py key

      - name: Restore trusted Rust build products
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ env.ARKDECK_RUST_CACHE_ROOT }}
          key: ${{ steps.rust-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.rust-cache-key.outputs.prefix }}
            ${{ github.ref != 'refs/heads/main' && steps.rust-cache-key.outputs.fallback || '' }}

      - name: Synchronize exact sources and fresh Git references
        working-directory: .
        run: python rust/scripts/ci-workspace.py prepare

      # The policy job's contract checks regenerate from the checkout and the
      # contracts job builds its own source views. These two steps are the only
      # ones that compile and run the checkout itself, so without them a red
      # workspace reaches main behind a green lane.
      - name: Lint the workspace, its tests and its examples
        working-directory: .
        run: python rust/scripts/ci-workspace.py --cwd rust exec -- cargo clippy --workspace --all-targets -- -D warnings

      # Maintainer ruling 17 (TASK-XPA-002): the WinVerifyTrust-integrated daemon
      # signer unit test uses the same runner-only development signer as the
      # contracts job; without it that test reports its signed path as skipped.
      - name: Temporary development daemon signer (Windows runner only)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $identity = ./rust/scripts/windows-dev-identity.ps1 create -Machine | ConvertFrom-Json
          "ARKDECK_DEV_SIGNER_THUMBPRINT=$($identity.thumbprint)" >> $env:GITHUB_ENV

      # Wrapped: two `corpus_parity` cases assert the checkout equals its
      # committed manifest. The wrapper names an edited-but-not-regenerated
      # input with the regenerate command before the tests run; it never
      # compares the checkout with origin/main, so a merge elsewhere cannot
      # turn this branch red. Published-versus-candidate parity is
      # check-contracts.py in the contracts job, whose published inputs come
      # from the merge-base with main.
      - name: Workspace tests
        working-directory: .
        run: python rust/scripts/ci-workspace.py exec -- python rust/scripts/workspace-tests.py

      # The Rust helper pair's release layout (G5 slice 20a,
      # Packages/ArkDeckKit/Distribution/macOS/package-rust-helpers.sh), laid
      # out from the binaries the tests above built, signed ad hoc and checked
      # without any signing identity: the file tree, Info.plist and its App
      # version parity, entitlements, signing parameters, arm64, and the two
      # answers `runtime service update` asks of a Rust daemon. It compiles
      # nothing and takes seconds; macOS only.
      - name: Rust helper package structure (unsigned)
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          set -eu
          output="$RUNNER_TEMP/arkdeck-unsigned-rust-helpers"
          ARKDECK_RUST_HELPER_BINARIES="$ARKDECK_RUST_CACHE_ROOT/workspace/rust/target/debug" \
          ARKDECK_UNSIGNED_HELPER_OUTPUT="$output" \
            bash Packages/ArkDeckKit/Distribution/macOS/build-unsigned-rust-helpers.sh
          python Packages/ArkDeckKit/Distribution/macOS/check-rust-helpers.py "$output"

      # The release DMG entry (scripts/release/build_macos_release.py, TASK-XPA-017
      # S5) driven end to end with recording signing, notary and build tools
      # through the real build-helpers.sh Rust mode, plus one unsigned DMG built
      # and mounted with the real hdiutil. No identity, nothing sent to Apple;
      # it compiles nothing and takes about half a minute. macOS only.
      - name: Release DMG pipeline (fixtures, unsigned)
        if: runner.os == 'macOS'
        working-directory: .
        run: python3 scripts/release/test_build_macos_release.py

      # Retain linked/debug products, but remove compiler scratch state before
      # it consumes archive/transfer capacity.
      - name: Compact Rust compiler scratch state and report cache sizes
        working-directory: .
        run: python rust/scripts/ci-workspace.py compact

      # PRs may read main's cache, but only a successful protected-main run
      # publishes executable products.
      - name: Save trusted Rust build products
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.rust-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ env.ARKDECK_RUST_CACHE_ROOT }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Preserve Rust test timing and queue logs
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: rust-test-timings-${{ matrix.os }}
          path: ${{ env.ARKDECK_RUST_TEST_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7

  contracts:
    name: Rust contract parity (${{ matrix.os }})
    # Same policy gate and hosts as `workspace`, beside it rather than after
    # it. check-contracts.py builds the published and candidate views from
    # isolated copies of the sources in their own Cargo targets and reads
    # none of the workspace job's products. When the inputs equal the
    # published base it runs only the candidate view and skips the lint and
    # workspace tests that the `workspace` job runs on the same revision in
    # the same Rust CI run; this workflow's result, which the swift aggregate
    # requires, needs both jobs. On macOS the candidate view also runs the
    # Rust owner checks (darwin only in check-contracts.py), so every host
    # keeps its own job.
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, xcode-27, windows-latest]
    runs-on: ${{ matrix.os }}
    # A change to the contract inputs builds, lints and tests both views, each
    # in its own target: 27.6 minutes on macOS from main's cache on #2311
    # (run 36440456252), against 3.2 on Linux and 4.6 on Windows. So macOS
    # gets 50 minutes and the other hosts 30, as the workspace job does.
    timeout-minutes: ${{ startsWith(matrix.os, 'xcode') && 50 || 30 }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      # As in `workspace`: incremental state is never reused across jobs, and
      # compact deletes it from each view's target before a save.
      CARGO_INCREMENTAL: "0"
      ARKDECK_RUST_TEST_WORKERS: ${{ startsWith(matrix.os, 'xcode') && '2' || '1' }}
    steps:
      - name: Checkout exact revision with runner Git
        working-directory: .
        env:
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          # Contract/corpus digests are over repository bytes on every host.
          git config core.autocrlf false
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+${ARKDECK_CI_SHA}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Set up Python for contract validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (Node 24)
        with:
          python-version: "3.14"

      - name: Install pinned contract validation dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0

      - name: Activate workspace toolchain and required components
        run: |
          set -eu
          rustup toolchain install --profile minimal --component rustfmt,clippy --no-self-update
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Fetch the locked dependency graph for all host platforms
        env:
          ARKFORGE_DEPLOY_KEY: ${{ secrets.ARKFORGE_DEPLOY_KEY }}
        run: sh ../scripts/ci/arkforge-cargo-fetch.sh

      # The views' Cargo targets live under this job's own cache root, keyed
      # apart from the workspace job's; the restore order is the workspace
      # job's (see there).
      - name: Configure task-owned Rust CI paths
        run: |
          echo "ARKDECK_RUST_CACHE_ROOT=$RUNNER_TEMP/arkdeck-rust-contracts" >> "$GITHUB_ENV"
          echo "ARKDECK_RUST_TEST_REPORT_DIR=$RUNNER_TEMP/rust-contract-test-timings" >> "$GITHUB_ENV"

      - name: Identify compatible Rust build products
        id: rust-cache-key
        working-directory: .
        run: python rust/scripts/ci-workspace.py key

      - name: Restore trusted Rust build products
        id: rust-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ env.ARKDECK_RUST_CACHE_ROOT }}
          key: ${{ steps.rust-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.rust-cache-key.outputs.prefix }}
            ${{ github.ref != 'refs/heads/main' && steps.rust-cache-key.outputs.fallback || '' }}

      - name: Synchronize exact sources and fresh Git references
        working-directory: .
        run: python rust/scripts/ci-workspace.py prepare

      # CHG-2026-074 r12 item 22: the positive Windows identity path is tested with a
      # temporary self-signed certificate trusted only on this runner. The CLI still checks
      # the pinned image path and signer; nothing skips the identity check. The unsigned
      # refusal is checked as before.
      - name: Temporary development daemon signer (Windows runner only)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $identity = ./rust/scripts/windows-dev-identity.ps1 create -Machine | ConvertFrom-Json
          "ARKDECK_DEV_SIGNER_THUMBPRINT=$($identity.thumbprint)" >> $env:GITHUB_ENV

      - name: Published consumer and candidate contract parity
        working-directory: .
        run: python rust/scripts/ci-workspace.py exec -- python rust/scripts/check-contracts.py --output-dir "$GITHUB_WORKSPACE/rust/target/readonly-check"

      # Retain the isolated contract targets, but remove compiler scratch state
      # before it consumes archive/transfer capacity.
      - name: Compact Rust compiler scratch state and report cache sizes
        working-directory: .
        run: python rust/scripts/ci-workspace.py compact

      # PRs may read main's cache, but only a successful protected-main run
      # publishes executable products. Each contract view retains its own target.
      - name: Save trusted Rust build products
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.rust-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ env.ARKDECK_RUST_CACHE_ROOT }}
          key: ${{ steps.rust-cache-key.outputs.key }}

      - name: Preserve Rust contract test timing and queue logs
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: rust-contract-test-timings-${{ matrix.os }}
          path: ${{ env.ARKDECK_RUST_TEST_REPORT_DIR }}
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve actual read-only recordings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: rust-readonly-recordings-${{ matrix.os }}
          path: rust/target/readonly-check/
          if-no-files-found: warn
          retention-days: 7
