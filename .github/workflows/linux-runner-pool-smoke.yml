name: Linux runner pool smoke

# Explicit deployment validation before production routing is enabled. These
# names do not substitute for the required guard/swift checks on normal CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Linux pool smoke (${{ matrix.suite }})
    runs-on: [self-hosted, Linux, X64, arkdeck-linux-light]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [plan, guard]
    steps:
      - name: Checkout exact revision and current main with runner Git
        env:
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+${ARKDECK_CI_SHA}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Validate the actual lightweight suites
        env:
          ARKDECK_SMOKE_SUITE: ${{ matrix.suite }}
        run: python3 scripts/ci/linux_runner_pool.py check-suite "$ARKDECK_SMOKE_SUITE"
