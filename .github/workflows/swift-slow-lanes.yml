name: Swift slow lanes
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Swift slow lanes ({0})', inputs.job) || 'Swift slow lanes' }}

# The Swift Runtime's durability lanes (run-test-lane.sh slow) and the
# Swift/Rust host-store shadow lived here until the Swift Runtime was deleted
# (CHG-2026-074); the Rust Runtime's scale and soak lanes run in rust-perf.yml.
#
# The App's XCUITest target is why this workflow remains: the
# required gate builds it and never runs it, so a failing assertion is
# invisible while a compile break is not. Five of its tests had been broken
# for weeks by unrelated merges — a stale expectation, a list-order
# assumption, and shared scene state leaking between launches — because
# nothing executed them. This workflow is that caller.
#
# Semantics: scheduled regression detection, NOT a merge gate. A red run
# here never blocks a PR; it is a signal to file a product defect. The
# required gate remains swift-ci.yml's full `swift test`.
# Zero secrets; read-only permissions; same marketplace-independent checkout
# as swift-ci.yml.
#
# A manual run names its lane, for example
# `gh workflow run swift-slow-lanes.yml --ref <branch> -f job=ui-tests`, and
# `all` repeats the nightly run. Each lane holds a macOS runner for 3 to 40
# minutes and the organisation gets five at once. Before the choice existed a
# dispatch ran every lane: seven of the eight manual runs up to 2026-09-14
# were for the UI lane and still ran slow-lanes, and the last one
# host-store-shadow as well, 56 macOS minutes nobody asked for; on 2026-09-14
# a main run's Rust job waited two minutes for a runner those extra lanes held.

on:
  schedule:
    # 18:00 UTC nightly (02:00 UTC+8), off the interactive working day.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: >-
          Lane to run. Each holds a macOS runner for 3 to 40 minutes; `all`
          repeats the nightly run.
        type: choice
        required: true
        options:
          - ui-tests
          - all

permissions:
  contents: read

concurrency:
  group: swift-slow-lanes
  cancel-in-progress: false

jobs:
  ui-tests:
    if: github.event_name == 'schedule' || inputs.job == 'all' || inputs.job == 'ui-tests'
    runs-on: macos-26
    concurrency:
      group: arkdeck-macos-background
      cancel-in-progress: false
      queue: max
    # Its own runner, deliberately: XCUITest drives a real window server and
    # these tests are load-sensitive. Sharing a machine with another lane
    # produces batches of wait timeouts that look like product failures and
    # are not.
    #
    # Measured locally (warm build): 35 tests in ~500s. 45 minutes covers a
    # cold CI build with the margin the slow lanes use.
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout default branch with runner Git
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth 1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Select the pinned toolchain
        run: |
          set -eu
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Widen the runner display
        run: |
          set -euo pipefail
          # Hosted runners come up at 1024x768. The App declares a 1180x760
          # window, so on that display the window is clamped and everything
          # below roughly y=700 is off-screen and unhittable — which surfaces
          # as twenty-odd assertion failures that say nothing about the
          # product. Measured on macos-26: ten of the Viewer's tests fail on
          # "Not hittable" alone.
          #
          # This fails closed rather than running anyway: a red lane whose
          # cause is the screen size teaches people to ignore the lane.
          brew install displayplacer >/dev/null
          screen=$(displayplacer list | awk '/^Persistent screen id:/ { print $4; exit }')
          test -n "$screen"
          displayplacer \
            "id:$screen res:1920x1080 hz:60 color_depth:7 enabled:true scaling:off origin:(0,0) degree:0"
          resolution=$(displayplacer list | awk '/^Resolution:/ { print $2; exit }')
          echo "runner display: $resolution"
          test "$resolution" = "1920x1080"
      - name: Run the App UI tests
        run: |
          # pipefail matters here: the run is piped through tee for live
          # output, and without it the step would read tee's status instead of
          # the test run's and never retry — or never fail.
          set -euo pipefail
          # One bounded retry, and only for the runner failing to bootstrap.
          # A UI-test runner that never establishes its connection has told us
          # nothing about the product, and on a fresh machine it is the first
          # launch that pays for enabling automation. Assertion failures are
          # never retried: a test that fails twice as often as it passes is a
          # defect, and hiding it here would recreate the gap this lane exists
          # to close.
          # Two cases are skipped here and nowhere else: they assert things a
          # hosted runner cannot supply, and both pass locally.
          #
          #   testProductionSandboxRejectsRepositoryFakeBeforeAnyHDCProbe reads
          #   a real HDC toolchain identity through the App's sandbox. The
          #   runner has no such toolchain, so the test would report the
          #   runner's emptiness as a product failure.
          #
          #   testSelectingADeepWideRowCentersItInBothTreeAxes asserts a
          #   selected row lands within 32pt of the tree's centre. That
          #   tolerance is written against a real display; it is a statement
          #   about scroll behaviour, not about the runner's geometry.
          #
          # They stay in the target and run under scripts/ci/run-ui-tests.sh
          # locally, which is where their claims are meaningful.
          # Named once: a retry that ran a different set than the first
          # attempt would report on tests nobody chose.
          set -- \
            -skip-testing:ArkDeckHDCUITests/HDCStatusUITests/testProductionSandboxRejectsRepositoryFakeBeforeAnyHDCProbe \
            -skip-testing:ArkDeckHDCUITests/ViewerUITests/testSelectingADeepWideRowCentersItInBothTreeAxes
          log="$RUNNER_TEMP/ui-tests.log"
          if sh scripts/ci/run-ui-tests.sh "$@" 2>&1 | tee "$log"; then
            exit 0
          fi
          if grep -qE 'failed to initialize for UI testing|before establishing connection' "$log"
          then
            echo "::warning::UI-test runner did not bootstrap; retrying once"
            sh scripts/ci/run-ui-tests.sh "$@"
          else
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          echo "UI tests cover the App shell, HDC diagnostics, the Overview" >> "$GITHUB_STEP_SUMMARY"
          echo "record and the Viewer against a launched window. The required" >> "$GITHUB_STEP_SUMMARY"
          echo "gate only builds this target, so this is the only place its" >> "$GITHUB_STEP_SUMMARY"
          echo "assertions run — minus two cases that need a real display and" >> "$GITHUB_STEP_SUMMARY"
          echo "a real HDC toolchain, which stay local. Red here = file a" >> "$GITHUB_STEP_SUMMARY"
          echo "assertions run. Red here = file a product defect; this job is" >> "$GITHUB_STEP_SUMMARY"
          echo "not a merge gate. Reproduce with scripts/ci/run-ui-tests.sh." >> "$GITHUB_STEP_SUMMARY"
