name: SDD Guard

# V2 git-native 治理:CI 只做只读一致性校验(specs/AC 索引/changes/locks)。
# 授权语义由受保护 main + CODEOWNER PR review 承担;本 workflow 不持有任何 secret。

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    # Routine bot opened/synchronize checks run in the exact-head Agent PR
    # push workflow. reopened/edited re-run guard on the merge ref; the host
    # loop's check dispatch (an edited body) relies on that run existing.
    types: [reopened, edited]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Keep the required guard runnable when the Actions service cannot
      # resolve marketplace action metadata. The repository is public, the ref
      # and SHA arrive as data through the environment, and the read-back keeps
      # the checkout exact without granting another permission.
      - name: Checkout exact revision with runner Git
        env:
          ARKDECK_CI_REF: ${{ github.ref }}
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin \
            "+${ARKDECK_CI_REF}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Install dependencies
        run: |
          set -eu
          python3 -m pip install \
            --disable-pip-version-check \
            --target "$RUNNER_TEMP/arkdeck-sdd-deps" \
            -r scripts/requirements-sdd.txt
          printf 'PYTHONPATH=%s\n' \
            "$RUNNER_TEMP/arkdeck-sdd-deps" >> "$GITHUB_ENV"

      - name: SDD consistency check
        env:
          ARKDECK_PYTHON: python3
        run: ./scripts/check-sdd.sh

      # These two suites had no workflow running them at all, so the properties
      # they pin held only when someone remembered to run them by hand.
      # `unittest discover` specifically: executing a suite file directly runs
      # whatever its module-level `unittest.main()` has collected so far, which
      # has twice been less than the whole file.
      - name: SDD checker contract tests
        run: python3 scripts/test_check_sdd.py

      # The Agent PR workflow runs scripts/agent_pr_identity.py without an
      # install step; its contract suite is stdlib-only and runs here so a
      # regression in the identity checks turns the required check red.
      - name: Agent PR identity helper contract tests
        run: python3 scripts/test_agent_pr_identity.py

      - name: host-loop contract suite
        working-directory: scripts
        run: python3 -m unittest discover -s host_loop -t .

  # @arkdeck/ds encodes the design language defined by docs/design/*. Nothing
  # generates it, so the two drift by hand — and once already did, silently: the
  # library shipped v0.2's palette while main had moved to v0.3, and it surfaced
  # only because a rebase happened to pull the newer docs in. The check also
  # runs first in that package's `npm run build`, but a build is not something a
  # commit has to pass through, so it belongs here too.
  #
  # No install step on purpose: the script imports only node: builtins, which
  # keeps this job dependency-free and a couple of seconds long.
  ds-tokens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision with runner Git
        env:
          ARKDECK_CI_REF: ${{ github.ref }}
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune --depth=1 origin \
            "+${ARKDECK_CI_REF}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Runner Node version
        run: node --version

      - name: "@arkdeck/ds tokens match docs/design"
        run: node docs/design/arkdeck-ds/scripts/check-tokens.mjs
