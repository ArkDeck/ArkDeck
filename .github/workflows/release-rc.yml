name: Release candidate

# Builds the Developer ID signed, notarized and stapled macOS release
# candidate (TASK-XPA-017) with scripts/release/build_macos_release.py, the
# same entry a maintainer runs locally, and keeps its DMG, release receipt and
# notary logs as the workflow artifact arkdeck-rc-<version>-<build>.
#
# Credentials are secrets of the `release` environment, which the maintainer
# restricts to the protected main branch; they reach only this job, and in it
# only the step that installs them and the build step. There is no
# pull_request trigger: code that has not merged into main never runs with
# them. The signing identity goes into a temporary keychain with a random
# password generated here, and every credential file lives under one
# directory in RUNNER_TEMP; the last step removes both whatever happened
# before it.
#
# An RC is produced when a change to scripts/release/release-version.json
# (`release_version.py bump-build` or `set`) merges into main, or on demand
# from main. A version and build that already have an artifact or a release
# asset are not built again.
on:
  push:
    branches: [main]
    paths:
      - scripts/release/release-version.json
  workflow_dispatch:

permissions:
  contents: read

# One RC at a time, and never a cancelled one: a notarization cut short would
# leave an accepted submission with no artifact.
concurrency:
  group: release-rc
  cancel-in-progress: false

jobs:
  release-rc:
    name: Signed and notarized release candidate
    runs-on: xcode-27
    environment: release
    # Three notarizations (helper pair, App, DMG) wait on Apple; each may take
    # from minutes to hours. The helper pair, ArkForge and the App build
    # concurrently and the first two notarizations overlap (about 11 minutes
    # of build step sequentially in run 36590793565, mostly the App archive).
    timeout-minutes: 300
    # actions: read lists this repository's artifacts for the duplicate check.
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Require protected main
        run: |
          set -eu
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error title=Release candidates come from main only::$GITHUB_REF is not refs/heads/main"
            exit 1
          fi

      - name: Checkout exact revision with runner Git
        env:
          ARKDECK_CI_SHA: ${{ github.sha }}
        run: |
          set -eu
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --prune origin \
            "+${ARKDECK_CI_SHA}:refs/remotes/origin/ci"
          git checkout --detach refs/remotes/origin/ci
          test "$(git rev-parse HEAD)" = "$ARKDECK_CI_SHA"

      - name: Read the release version
        id: version
        run: |
          set -euo pipefail
          python3 scripts/release/release_version.py check
          release=$(python3 scripts/release/release_version.py print)
          version=$(printf '%s' "$release" | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')
          build=$(printf '%s' "$release" | python3 -c 'import json, sys; print(json.load(sys.stdin)["build"])')
          {
            echo "version=$version"
            echo "build=$build"
            echo "artifact=arkdeck-rc-$version-$build"
            echo "dmg=ArkDeck-$version-$build.dmg"
          } >> "$GITHUB_OUTPUT"
          echo "release $version ($build)"

      # A version and build are notarized once. A non-expired artifact of that
      # name, or a GitHub release carrying that DMG, means this RC exists:
      # the job ends green without building. Bump the build to make another.
      - name: Skip a release candidate that already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.version.outputs.artifact }}
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          set -euo pipefail
          artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | length')
          assets=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].assets[].name')
          if [ "$artifacts" != 0 ] || printf '%s\n' "$assets" | grep -Fxq "$DMG"; then
            echo "::notice title=Release candidate already exists::$ARTIFACT (artifact or release asset $DMG); bump the build with scripts/release/release_version.py bump-build to produce another"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Exact Xcode 27.0 preflight
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -eu
          test -d "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Activate the Rust toolchain for Apple silicon
        if: steps.existing.outputs.exists == 'false'
        working-directory: rust
        run: |
          set -eu
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add aarch64-apple-darwin
          rustc --version
          cargo --version

      # Build caches (TASK-XPA-017 release speed). Every cache is restored
      # here, before any credential exists on the runner, and saved only at
      # the end of a successful main run, after the credentials are removed.
      # They hold build inputs and unsigned intermediates only: the cargo
      # registry and git sources, the two release target directories (both
      # packagers copy the binaries out of them and sign the copies), and
      # xcodebuild's SwiftPM clones. Nothing signed, no keychain and no
      # credential file lives under a cached path, and no Rust crate of this
      # repository reads an ARKDECK_* variable at compile time. A stale entry
      # cannot change what is signed: cargo rebuilds every crate whose
      # sources, toolchain or flags differ (the fresh checkout's mtimes rebuild
      # the workspace crates every time), and xcodebuild checks packages out
      # at exactly the committed Package.resolved revisions
      # (-onlyUsePackageVersionsFromResolvedFile) and compiles them into a
      # fresh DerivedData. Xcode compilation caching is not used: its content
      # store would carry compiled objects from an earlier run into the
      # signed App. Keys carry the runner image build and the resolved rustc,
      # so a new image or toolchain starts from its own entries.
      - name: Identify release build caches
        id: caches
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          if [ -z "${ImageVersion:-}" ]; then
            echo "::warning::ImageVersion is unset; the release build caches key on 'unknown'"
          fi
          rustc_id=$(cd rust && rustc -vV | shasum -a 256 | cut -c1-16)
          pin=$(PYTHONDONTWRITEBYTECODE=1 python3 -c 'import sys; sys.path.insert(0, "scripts/release"); import build_macos_release; print(build_macos_release.arkforge_pin())')
          {
            echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}"
            echo "rustc=$rustc_id"
            echo "arkforge-pin=$pin"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the cargo registry and git sources
        id: cargo-home-cache
        if: steps.existing.outputs.exists == 'false'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: arkdeck-release-cargo-home-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-arkforge-${{ steps.caches.outputs.arkforge-pin }}
          restore-keys: |
            arkdeck-release-cargo-home-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore the Rust helper release target
        id: rust-target-cache
        if: steps.existing.outputs.exists == 'false'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: rust/target
          key: arkdeck-release-rust-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.caches.outputs.image }}-rustc-${{ steps.caches.outputs.rustc }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            arkdeck-release-rust-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.caches.outputs.image }}-rustc-${{ steps.caches.outputs.rustc }}-

      # Every network fetch happens before any credential exists on the runner.
      # ArkForge is public, so neither fetch needs a key.
      - name: Fetch the locked Rust dependency graph
        if: steps.existing.outputs.exists == 'false'
        working-directory: rust
        run: cargo fetch --locked

      # build_macos_release.py builds ArkForge.bundle from a clean checkout
      # whose HEAD is the revision rust/Cargo.toml pins, and ArkForge's
      # packager builds offline.
      - name: Check out ArkForge at the pinned revision
        if: steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          pin=$(PYTHONDONTWRITEBYTECODE=1 python3 -c 'import sys; sys.path.insert(0, "scripts/release"); import build_macos_release; print(build_macos_release.arkforge_pin())')
          checkout="$RUNNER_TEMP/ArkForge"
          git init "$checkout"
          git -C "$checkout" remote add origin https://github.com/ArkDeck/ArkForge.git
          git -C "$checkout" fetch --no-tags --depth=1 origin "$pin"
          git -C "$checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$checkout" rev-parse HEAD)" = "$pin"
          (cd "$checkout" && cargo fetch --locked)
          echo "ARKDECK_ARKFORGE_CHECKOUT=$checkout" >> "$GITHUB_ENV"

      - name: Restore the ArkForge release target
        id: arkforge-target-cache
        if: steps.existing.outputs.exists == 'false'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/ArkForge/target
          key: arkdeck-release-arkforge-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.caches.outputs.image }}-rustc-${{ steps.caches.outputs.rustc }}-${{ steps.caches.outputs.arkforge-pin }}
          restore-keys: |
            arkdeck-release-arkforge-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.caches.outputs.image }}-rustc-${{ steps.caches.outputs.rustc }}-

      # xcodebuild's SwiftPM clones: package sources only, keyed on the
      # committed Package.resolved files.
      - name: Restore the SwiftPM clones
        id: swiftpm-cache
        if: steps.existing.outputs.exists == 'false'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-swiftpm/SourcePackages
          key: arkdeck-release-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-${{ hashFiles('ArkDeck.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/ArkDeckKit/Package.resolved') }}
          restore-keys: |
            arkdeck-release-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-

      # The Developer ID identity goes into a keychain of this job's own, with
      # a random password masked before first use; codesign may use its key
      # without a prompt, and the keychain joins the user search list because
      # `xcodebuild -exportArchive` and ArkForge's packager take no keychain
      # option. The .p12 is deleted once imported. The provisioning profiles
      # and the App Store Connect API key are written as files; only their
      # paths reach later steps.
      - name: Install release credentials
        if: steps.existing.outputs.exists == 'false'
        env:
          ARKDECK_DEVELOPER_ID_P12_BASE64: ${{ secrets.ARKDECK_DEVELOPER_ID_P12_BASE64 }}
          ARKDECK_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.ARKDECK_DEVELOPER_ID_P12_PASSWORD }}
          ARKDECK_CLI_PROVISIONING_PROFILE_BASE64: ${{ secrets.ARKDECK_CLI_PROVISIONING_PROFILE_BASE64 }}
          ARKDECK_DAEMON_PROVISIONING_PROFILE_BASE64: ${{ secrets.ARKDECK_DAEMON_PROVISIONING_PROFILE_BASE64 }}
          ARKDECK_NOTARY_API_KEY_P8_BASE64: ${{ secrets.ARKDECK_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          for name in ARKDECK_DEVELOPER_ID_P12_BASE64 ARKDECK_DEVELOPER_ID_P12_PASSWORD \
            ARKDECK_CLI_PROVISIONING_PROFILE_BASE64 ARKDECK_DAEMON_PROVISIONING_PROFILE_BASE64 \
            ARKDECK_NOTARY_API_KEY_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Release secret missing::$name is not set in the release environment"
              exit 1
            fi
          done
          credentials="$RUNNER_TEMP/arkdeck-release-credentials"
          keychain="$credentials/arkdeck-release.keychain-db"
          mkdir -m 700 "$credentials"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$ARKDECK_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$credentials/developer-id.p12"
          printf '%s' "$ARKDECK_CLI_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$credentials/cli.provisionprofile"
          printf '%s' "$ARKDECK_DAEMON_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$credentials/daemon.provisionprofile"
          printf '%s' "$ARKDECK_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$credentials/notary-api-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$credentials/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$ARKDECK_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$credentials/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          search_list=("$keychain")
          while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry#\"}"
            entry="${entry%\"}"
            if [ -n "$entry" ] && [ "$entry" != "$keychain" ]; then
              search_list+=("$entry")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${search_list[@]}"
          {
            echo "ARKDECK_CODESIGN_KEYCHAIN=$keychain"
            echo "ARKDECK_CLI_PROVISIONING_PROFILE=$credentials/cli.provisionprofile"
            echo "ARKDECK_DAEMON_PROVISIONING_PROFILE=$credentials/daemon.provisionprofile"
            echo "ARKDECK_NOTARY_API_KEY_PATH=$credentials/notary-api-key.p8"
          } >> "$GITHUB_ENV"

      - name: Build the signed and notarized release candidate
        if: steps.existing.outputs.exists == 'false'
        env:
          ARKDECK_NOTARY_API_KEY_ID: ${{ secrets.ARKDECK_NOTARY_API_KEY_ID }}
          ARKDECK_NOTARY_API_ISSUER_ID: ${{ secrets.ARKDECK_NOTARY_API_ISSUER_ID }}
          ARKDECK_XCODE_SOURCE_PACKAGES: ${{ runner.temp }}/arkdeck-swiftpm/SourcePackages
        run: >-
          python3 scripts/release/build_macos_release.py release
          --output "$RUNNER_TEMP/rc"
          --arkforge-checkout "$ARKDECK_ARKFORGE_CHECKOUT"

      # Runs whatever happened above, before anything is uploaded: deleting
      # the keychain also takes it off the search list.
      - name: Remove release credentials
        if: always()
        run: |
          set -u
          credentials="$RUNNER_TEMP/arkdeck-release-credentials"
          keychain="$credentials/arkdeck-release.keychain-db"
          status=0
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain" || status=1
          fi
          rm -rf "$credentials" || status=1
          test ! -e "$credentials" || status=1
          exit "$status"

      - name: Keep the release candidate
        if: success() && steps.existing.outputs.exists == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ runner.temp }}/rc/
          if-no-files-found: error
          retention-days: 90

      - name: Release candidate summary
        if: success() && steps.existing.outputs.exists == 'false'
        env:
          ARTIFACT: ${{ steps.version.outputs.artifact }}
        run: |
          set -euo pipefail
          sha256=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["dmg"]["sha256"])' "$RUNNER_TEMP/rc/release-receipt.json")
          {
            echo "### Release candidate"
            echo "- Artifact: \`$ARTIFACT\` (\`gh run download $GITHUB_RUN_ID -n $ARTIFACT\`)"
            echo "- Source: \`$GITHUB_SHA\`"
            echo "- DMG SHA-256: \`$sha256\`"
            echo "- Signed, notarized and stapled by build_macos_release.py; see release-receipt.json and the notary logs in the artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      # Saved only from a successful main run, after the credentials are gone,
      # and only when the exact key missed.
      - name: Save the cargo registry and git sources
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.existing.outputs.exists == 'false' &&
          steps.cargo-home-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: arkdeck-release-cargo-home-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/Cargo.lock') }}-arkforge-${{ steps.caches.outputs.arkforge-pin }}

      - name: Save the Rust helper release target
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.existing.outputs.exists == 'false' &&
          steps.rust-target-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: rust/target
          key: arkdeck-release-rust-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.caches.outputs.image }}-rustc-${{ steps.caches.outputs.rustc }}-${{ hashFiles('rust/Cargo.lock') }}

      - name: Save the ArkForge release target
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.existing.outputs.exists == 'false' &&
          steps.arkforge-target-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/ArkForge/target
          key: arkdeck-release-arkforge-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.caches.outputs.image }}-rustc-${{ steps.caches.outputs.rustc }}-${{ steps.caches.outputs.arkforge-pin }}

      - name: Save the SwiftPM clones
        if: >-
          success() &&
          github.ref == 'refs/heads/main' &&
          steps.existing.outputs.exists == 'false' &&
          steps.swiftpm-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ${{ runner.temp }}/arkdeck-swiftpm/SourcePackages
          key: arkdeck-release-swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.0-${{ hashFiles('ArkDeck.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Packages/ArkDeckKit/Package.resolved') }}
