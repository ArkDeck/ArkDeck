name: Feature request
description: A product change that is not a vulnerability
title: "request: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the journey you need. A new operation, provider, device profile,
        or destructive-admission change also needs an OpenSpec change. See
        CONTRIBUTING.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you want, including what must stay impossible.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - macOS app
        - Windows client
        - CLI or daemon
        - Catalog operation
        - Docs
        - Other
    validations:
      required: true
