# Version-update PRs. Secret scanning, push protection, and Dependabot
# security updates are repository settings; this file does not enable them.
# pip is omitted: the only pin file is hack/requirements-sdd.txt, which
# Dependabot's pip ecosystem does not scan (it looks for requirements.txt,
# a Pipfile, or pyproject.toml).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: swift
    directory: /apple/Packages/ArkDeckKit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: swift
    directory: /apple/ArkDeck.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /windows
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: nuget
    directory: /tools/experiments/windows-spikes/spk4
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /docs/design/arkdeck-ds
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
