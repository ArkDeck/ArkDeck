# Third-party additions and version changes require an explicit allowlist
# change as well as cargo-vet coverage. Every target and dev dependency is
# checked; the read-only binaries are not excluded because publish is false.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
include-dev = true
include-build = true
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
allow = [
    "arkdeck-agentd@0.1.0",
    "arkdeck-cli@0.1.0",
    "arkdeck-client@0.1.0",
    "arkdeck-contract@0.1.0",
    "arkdeck-control@0.1.0",
    "arkdeck-hoststore@0.1.0",
    "arkdeck-platform@0.1.0",
    "arkdeck-provider-hdc@0.1.0",
    "block-buffer@0.10.4",
    "cfg-if@1.0.4",
    "cpufeatures@0.2.17",
    "crypto-common@0.1.6",
    "digest@0.10.7",
    "generic-array@0.14.7",
    "hmac@0.12.1",
    "itoa@1.0.15",
    "libc@0.2.189",
    "memchr@2.8.3",
    "proc-macro2@1.0.106",
    "quote@1.0.47",
    "serde@1.0.228",
    "serde_core@1.0.228",
    "serde_derive@1.0.228",
    "serde_json@1.0.151",
    "sha2@0.10.9",
    "subtle@2.6.1",
    "syn@2.0.119",
    "typenum@1.20.1",
    "unicode-ident@1.0.18",
    "unicode-segmentation@1.13.3",
    "version_check@0.9.4",
    "windows-link@0.2.1",
    "windows-sys@0.61.2",
    "zmij@1.0.21",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
