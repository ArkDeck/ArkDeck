[package]
name = "arkdeck-hoststore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arkdeck-bootstrap.workspace = true
arkdeck-contract.workspace = true
arkdeck-platform.workspace = true
arkdeck-rockchip-binding.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
unicode-segmentation.workspace = true

# The Job events reader's cursor, and the Target owners (TASK-XPA-004), which
# read the HDC provider's candidates and observation rules (macOS and Windows).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
arkdeck-provider-hdc.workspace = true
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
# Workspace signing (TASK-XPA-015): the design's crate graph, RUNTIME --> PWS;
# its credential pinning is composed on Windows too (TASK-XPA-011).
arkdeck-provider-workspace.workspace = true

# The Flash archive reader streams its SHA-256 on macOS and Windows
# (TASK-XPA-010).
sha2.workspace = true

# The ArkForge Flash lane's provider (TASK-XPA-010).
arkdeck-provider-arkforge.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# A stand-in for the ArkForge lane daemon's public socket, spoken with
# ArkForge's own codec.
[target.'cfg(target_os = "macos")'.dev-dependencies]
arkforge-ipc.workspace = true
# The pager's tests count what a read holds at once (TASK-XPA-025).
arkdeck-platform = { workspace = true, features = ["allocation-meter"] }

# The pager's tests run on Windows too, counting the same way. The ArkForge
# lane daemon's stand-in speaks ArkForge's codec over its own named pipes
# there (TASK-XPA-010).
[target.'cfg(windows)'.dev-dependencies]
arkdeck-platform = { workspace = true, features = ["allocation-meter"] }
arkforge-ipc.workspace = true
arkforge-platform.workspace = true

[lints]
workspace = true
