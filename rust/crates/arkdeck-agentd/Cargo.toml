[package]
name = "arkdeck-agentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arkdeck-contract.workspace = true
arkdeck-control.workspace = true
arkdeck-platform.workspace = true
arkdeck-provider-hdc.workspace = true
serde.workspace = true
serde_json.workspace = true

# The Target owners (TASK-XPA-004) and the Artifact read and export
# owners (TASK-XPA-006) are composed on macOS and Windows; every other
# host-store owner on macOS only.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
arkdeck-hoststore.workspace = true
# The ArkForge lane (TASK-XPA-010).
arkdeck-provider-arkforge.workspace = true

# A stand-in for `arkforged`'s public socket (pipe on Windows), spoken with
# ArkForge's own codec and transport.
[target.'cfg(any(target_os = "macos", windows))'.dev-dependencies]
arkforge-ipc.workspace = true
arkforge-platform.workspace = true

# The Windows client start path and service leaves, driven against this
# crate's daemon (`tests/windows_client_start_process.rs`).
[target.'cfg(windows)'.dev-dependencies]
arkdeck-cli = { path = "../arkdeck-cli" }
arkdeck-client.workspace = true

# The daemon launches this test binary as its lane's stand-in `arkforged`,
# which must take the daemon role before any test framework reads the
# arguments.
[[test]]
name = "arkforged_owner_stop"
harness = false

# The workspace provider's inspector is this test binary itself, copied into
# the development root, which must answer before any test framework reads
# the arguments.
[[test]]
name = "windows_workspace_provider_process"
harness = false

[lints]
workspace = true
