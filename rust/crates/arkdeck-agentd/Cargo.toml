[package]
name = "arkdeck-agentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arkdeck-contract.workspace = true
arkdeck-control.workspace = true
arkdeck-platform.workspace = true
arkdeck-provider-hdc.workspace = true
serde.workspace = true
serde_json.workspace = true

# The Target owners are composed on macOS and Windows (TASK-XPA-004); every
# other host-store owner on macOS only.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
arkdeck-hoststore.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
arkdeck-provider-arkforge.workspace = true

# A stand-in for `arkforged`'s public socket, spoken with ArkForge's own codec.
[target.'cfg(target_os = "macos")'.dev-dependencies]
arkforge-ipc.workspace = true

# The daemon launches this test binary as its lane's stand-in `arkforged`,
# which must take the daemon role before any test framework reads the
# arguments.
[[test]]
name = "arkforged_owner_stop"
harness = false

[lints]
workspace = true
