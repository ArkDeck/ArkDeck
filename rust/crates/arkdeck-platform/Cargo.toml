[package]
name = "arkdeck-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test support only: a counting global allocator (src/allocation_meter.rs).
allocation-meter = []

[dependencies]
sha2.workspace = true

# sha2 0.10 selects the ARM SHA instruction backend only with `asm`.
# The dependency dispatches by runtime CPU capability and retains soft fallback;
# every byte, full-file digest and descriptor/path revalidation is unchanged.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
serde_json.workspace = true

# The fake tool of the Windows tool-dispatch tests is the test binary itself,
# so it runs without libtest, whose output would reach the child's streams.
[[test]]
name = "windows_tool_dispatch"
harness = false

# The console child of the Windows secret-entry tests is this binary itself,
# attached to a pseudo console.
[[test]]
name = "windows_console_secret"
harness = false

# The fake signer of the Windows PTY exchange tests is this binary itself,
# attached to the pseudo console the exchange creates.
[[test]]
name = "windows_pty_exchange"
harness = false

# The fake `hdc shell` of the Windows persistent shell channel tests is this
# binary itself, attached to the channel's pseudo console.
[[test]]
name = "windows_shell_channel"
harness = false

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
