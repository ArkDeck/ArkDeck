[package]
name = "arkdeck-provider-arkforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arkdeck-contract.workspace = true
arkdeck-platform.workspace = true
# ArkForge's authority API, whose StepPermit this authority signs.
arkforge-authority-api.workspace = true
arkforge-client.workspace = true
# The typed identifiers and digests a StepPermit is made of.
arkforge-core.workspace = true
# The messages `arkforge-client`'s controller surface takes and returns.
arkforge-ipc.workspace = true

[dev-dependencies]
serde_json.workspace = true

# The lane launches this test binary as its stand-in `arkforged`, which must
# take the daemon role before any test framework reads the arguments.
[[test]]
name = "lane"
harness = false

[lints]
workspace = true
