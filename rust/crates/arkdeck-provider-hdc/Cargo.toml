[package]
name = "arkdeck-provider-hdc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arkdeck-contract.workspace = true
arkdeck-platform.workspace = true
arkdeck-rockchip-binding.workspace = true
hmac.workspace = true
serde_json.workspace = true
sha2.workspace = true
unicode-segmentation.workspace = true

[lints]
workspace = true

# The fake `hdc` of the Windows managed-server tests is the test binary
# itself, so it runs without libtest, whose output would reach its streams.
[[test]]
name = "windows_managed_hdc"
harness = false

# The fake `hdc` of the Windows lifecycle tests is the test binary itself,
# which starts its replacement server detached as HDC does.
[[test]]
name = "windows_lifecycle"
harness = false
