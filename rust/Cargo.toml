[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

[workspace.dependencies]
arkdeck-agentd = { path = "crates/arkdeck-agentd" }
arkdeck-contract = { path = "crates/arkdeck-contract" }
arkdeck-platform = { path = "crates/arkdeck-platform" }
arkdeck-bootstrap = { path = "crates/arkdeck-bootstrap" }
arkdeck-control = { path = "crates/arkdeck-control" }
arkdeck-hoststore = { path = "crates/arkdeck-hoststore" }
arkdeck-provider-hdc = { path = "crates/arkdeck-provider-hdc" }
arkdeck-rockchip-binding = { path = "crates/arkdeck-rockchip-binding" }
arkdeck-provider-workspace = { path = "crates/arkdeck-provider-workspace" }
arkdeck-client = { path = "crates/arkdeck-client" }
arkdeck-provider-arkforge = { path = "crates/arkdeck-provider-arkforge" }
# One reviewed ArkForge revision for the Rust lane, asserted by
# `scripts/check-arkforge-pin.py`. PR #46 introduced consumer contract 1.0.0.
# Development uses a commit, never a tag/release. Upgrade every rev together,
# regenerate Cargo.lock and run the upstream consumer contracts and lane tests.
arkforge-arkdeck-adapter = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "0445530207ac5e6689e61e7b51c0edd4de7f2aec" }
arkforge-artifact = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "0445530207ac5e6689e61e7b51c0edd4de7f2aec" }
arkforge-authority-api = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "0445530207ac5e6689e61e7b51c0edd4de7f2aec" }
arkforge-client = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "0445530207ac5e6689e61e7b51c0edd4de7f2aec" }
arkforge-core = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "0445530207ac5e6689e61e7b51c0edd4de7f2aec" }
arkforge-ipc = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "0445530207ac5e6689e61e7b51c0edd4de7f2aec" }
arkforge-platform = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "0445530207ac5e6689e61e7b51c0edd4de7f2aec" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.10.9"
hmac = "0.12.1"
libc = "0.2"
windows-sys = "0.61.2"
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

# Every worktree, contract view and agent task keeps its own Cargo target, so
# debug artifacts multiply per host. One worktree's debug target reached 15 GB,
# 9.2 GB of it incremental caches, and these targets together filled the host
# disk. Tasks rebuild about once per change, so incremental caches cost more
# disk than the time they save. Line tables keep file:line in panics and
# backtraces; dependencies carry no debuginfo. Set `debug = true` locally to
# step through code in a debugger.
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# A registered tool is identified by the SHA-256 of its bytes, and a
# commandless HDC identity observation hashes the 6 MB hdc three times (open
# and two revalidations). Unoptimized, that alone passes Swift's 1000 ms
# observation budget, so a debug daemon reported every server unobserved.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
panic = "abort"
lto = "thin"
strip = "debuginfo"
