[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
arkdeck-contract = { path = "crates/arkdeck-contract" }
arkdeck-platform = { path = "crates/arkdeck-platform" }
arkdeck-bootstrap = { path = "crates/arkdeck-bootstrap" }
arkdeck-control = { path = "crates/arkdeck-control" }
arkdeck-hoststore = { path = "crates/arkdeck-hoststore" }
arkdeck-provider-hdc = { path = "crates/arkdeck-provider-hdc" }
arkdeck-rockchip-binding = { path = "crates/arkdeck-rockchip-binding" }
arkdeck-provider-workspace = { path = "crates/arkdeck-provider-workspace" }
arkdeck-client = { path = "crates/arkdeck-client" }
arkdeck-provider-arkforge = { path = "crates/arkdeck-provider-arkforge" }
# ArkForge's own crates, at the revision `Packages/ArkDeckKit/Package.swift`
# pins for the Swift SDK: one ArkForge revision for both lanes, asserted by
# `scripts/check-arkforge-pin.py`. They carry no third-party dependency.
arkforge-authority-api = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "c1dc0553b42627581583abfba3fec34d13343282" }
arkforge-client = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "c1dc0553b42627581583abfba3fec34d13343282" }
arkforge-core = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "c1dc0553b42627581583abfba3fec34d13343282" }
arkforge-ipc = { git = "https://github.com/ArkDeck/ArkForge.git", rev = "c1dc0553b42627581583abfba3fec34d13343282" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.10.9"
hmac = "0.12.1"
libc = "0.2"
windows-sys = "0.61.2"
unicode-segmentation = "=1.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

# A registered tool is identified by the SHA-256 of its bytes, and a
# commandless HDC identity observation hashes the 6 MB hdc three times (open
# and two revalidations). Unoptimized, that alone passes Swift's 1000 ms
# observation budget, so a debug daemon reported every server unobserved.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
panic = "abort"
lto = "thin"
strip = "debuginfo"
